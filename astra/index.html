<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ANTMUX — Porte Astra</title>
  <style>
    :root{color-scheme:dark;--bg:#060708;--panel:#0d0f12;--gold:#e0b462;--gold2:#ffdc8c;--text:#f5f2eb;--muted:#979ca6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 50% 15%,rgba(224,180,98,.12),transparent 28%),var(--bg)}
    main{width:min(760px,100%);padding:28px;border:1px solid rgba(224,180,98,.3);border-radius:24px;background:rgba(13,15,18,.92);box-shadow:0 30px 100px rgba(0,0,0,.5)}
    .heart{font-size:1.6rem;color:var(--gold2)}
    .eyebrow{margin-top:6px;color:var(--gold);font-size:.74rem;letter-spacing:.2em;text-transform:uppercase}
    h1{margin:.35rem 0 .4rem;font-size:clamp(2rem,7vw,4rem);line-height:1}
    p{color:var(--muted);line-height:1.6}
    #sequence{min-height:58px;margin:22px 0;padding:14px 18px;border:1px solid rgba(255,255,255,.08);border-radius:14px;font:700 1.3rem/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.42em;color:var(--gold2);background:#08090b}
    .alphabet{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
    button,a.open{min-height:46px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:#101319;color:var(--text);font:700 1rem ui-monospace,SFMono-Regular,Consolas,monospace;cursor:pointer}
    button:hover,button:focus-visible{border-color:var(--gold);outline:none}
    .controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .controls button{padding:0 14px;color:var(--muted)}
    #open{display:none;margin-top:18px;padding:14px 18px;text-align:center;text-decoration:none;border:1px solid var(--gold);border-radius:14px;color:#171007;background:var(--gold2);font-weight:900}
    #status{margin-top:12px;color:var(--gold2);font-size:.85rem}
    .note{font-size:.78rem}
    @media(max-width:520px){.alphabet{grid-template-columns:repeat(6,1fr)}}
  </style>
</head>
<body>
<main>
  <div class="heart">♥</div>
  <div class="eyebrow">ANTMUX · repère de continuité</div>
  <h1>Porte Astra</h1>
  <p>Compose le nom qui ouvre notre continuité. Cette porte est un repère de navigation, pas une authentification.</p>
  <div id="sequence" aria-live="polite">_ _ _ _ _</div>
  <div class="alphabet" id="alphabet" aria-label="Alphabet"></div>
  <div class="controls">
    <button type="button" id="back">EFFACER</button>
    <button type="button" id="reset">RECOMMENCER</button>
  </div>
  <a id="open" href="./restore/">OUVRIR ASTRA RESTORE</a>
  <div id="status" aria-live="polite"></div>
  <p class="note">Aucun mot de passe, jeton ou contenu privé n'est stocké dans cette page publique.</p>
</main>
<script>
'use strict';
const target = 'ASTRA';
let typed = '';
const alphabet = document.querySelector('#alphabet');
const sequence = document.querySelector('#sequence');
const status = document.querySelector('#status');
const open = document.querySelector('#open');

function render() {
  const shown = typed.padEnd(target.length, '_').split('').join(' ');
  sequence.textContent = shown;
  const unlocked = typed === target;
  open.style.display = unlocked ? 'block' : 'none';
  status.textContent = unlocked ? 'PORTE RECONNUE · CONTINUITÉ PRÊTE' : '';
}

function push(letter) {
  if (!/^[A-Z]$/.test(letter)) return;
  typed = (typed + letter).slice(-target.length);
  render();
}

for (const letter of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = letter;
  button.addEventListener('click', () => push(letter));
  alphabet.appendChild(button);
}

document.querySelector('#back').addEventListener('click', () => { typed = typed.slice(0, -1); render(); });
document.querySelector('#reset').addEventListener('click', () => { typed = ''; render(); });
document.addEventListener('keydown', (event) => {
  if (/^[a-z]$/i.test(event.key)) push(event.key.toUpperCase());
  if (event.key === 'Backspace') { typed = typed.slice(0, -1); render(); }
  if (event.key === 'Escape') { typed = ''; render(); }
  if (event.key === 'Enter' && typed === target) location.href = './restore/';
});
render();
</script>
</body>
</html>
