<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Brutotableur — vitrine verrouillée</title>
  <style>
    :root{color-scheme:dark;--bg:#030712;--panel:#07111f;--line:#16455f;--text:#e5f7ff;--muted:#8faebb;--gold:#ffc13d;--cyan:#23d8ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#092038 0,#030712 48%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;padding:24px}
    main{width:min(720px,100%);padding:28px;border:1px solid var(--line);border-radius:14px;background:rgba(7,17,31,.93)}
    .eyebrow{color:var(--cyan);font:800 12px ui-monospace,monospace;letter-spacing:.12em}.lock{font-size:44px;margin:8px 0}h1{margin:0 0 12px;font-size:clamp(28px,5vw,48px)}p{color:var(--muted);line-height:1.65}.status{display:inline-block;margin-top:10px;padding:8px 11px;border:1px solid rgba(255,193,61,.45);border-radius:999px;color:#ffe6a8;font:800 11px ui-monospace,monospace;letter-spacing:.08em}a{display:inline-block;margin-top:22px;color:var(--cyan);text-decoration:none;font-weight:800}a:hover{color:white}
  </style>
</head>
<body>
  <main>
    <!-- BRUTOTABLEUR_PRIVATE_SAFE_STUB -->
    <div class="lock" aria-hidden="true">🔒</div>
    <p class="eyebrow">ANTMUX · BRUTOTABLEUR · ACCÈS PRIVÉ</p>
    <h1>Vitrine verrouillée</h1>
    <p>L'application interactive n'est pas exposée au public. Le serveur doit autoriser explicitement l'accès avant de livrer le Brutotableur utilisable.</p>
    <span class="status">BRUTOTABLEUR_PRIVATE_SAFE_STUB</span><br />
    <a href="../">← Retour à la vitrine publique</a>
  </main>
</body>
</html>
