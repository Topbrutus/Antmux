name: ASTRA STEP8 Enable P2 Safely

on:
  push:
    branches:
      - astra/gamezel-control-20261003
    paths:
      - '.github/workflows/astra-step8-enable-p2.yml'

permissions:
  contents: read

concurrency:
  group: astra-step8-enable-p2
  cancel-in-progress: false

jobs:
  enable-p2:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          test "$actual_public_key" = "$expected_public_key"
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Enable P2 with automatic rollback
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/zelstereos-gamezel"
          ENABLE="$ROOT/bin/gamezel-enable-ai-seat"
          DISABLE="$ROOT/bin/gamezel-disable-ai-seat"
          STATUS="$ROOT/bin/gamezel-ai-status"

          test -x "$ENABLE"
          test -x "$DISABLE"
          test "$(systemctl --user is-active zelstereos-gamezel.service 2>/dev/null || true)" = active

          echo "P2_PRE_SERVICE=$(systemctl --user is-active zelstereos-gamezel-p2.service 2>/dev/null || true)"
          "$ENABLE" P2 2>&1 | sed -E 's#(token|secret|key|password)=.*#\1=REDACTED#Ig'
          sleep 3

          p2_state="$(systemctl --user is-active zelstereos-gamezel-p2.service 2>/dev/null || true)"
          main_state="$(systemctl --user is-active zelstereos-gamezel.service 2>/dev/null || true)"
          p2_enabled="$(systemctl --user is-enabled zelstereos-gamezel-p2.service 2>/dev/null || true)"
          echo "P2_POST_SERVICE=$p2_state"
          echo "P2_POST_ENABLED=$p2_enabled"
          echo "MAIN_POST_SERVICE=$main_state"

          if test "$p2_state" != active || test "$main_state" != active; then
            echo 'P2_ACTIVATION=FAIL_ROLLBACK'
            "$DISABLE" P2 >/dev/null 2>&1 || true
            exit 1
          fi

          if test -x "$STATUS"; then
            "$STATUS" 2>&1 | sed -E 's#(token|secret|key|password)=.*#\1=REDACTED#Ig' | sed -n '1,40p'
          fi
          echo 'P2_ACTIVATION=PASS'
          REMOTE
