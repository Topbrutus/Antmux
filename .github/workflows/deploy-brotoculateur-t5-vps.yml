name: Deploy Brotoculateur T5 Operational Independence VPS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit, start T5 operational independence shadow, or disable T5
        required: true
        default: audit
        type: choice
        options: [audit, canary_start, disable]
      confirm:
        description: Type BRUTUS-T5-VPS for canary_start or disable
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: brotoculateur-t5-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate request and T5 tools
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$MODE" in audit|canary_start|disable) ;; *) exit 2 ;; esac
          if [ "$MODE" != audit ]; then test "$CONFIRM" = 'BRUTUS-T5-VPS'; fi
          python3 -m py_compile \
            deploy/vps-t5/t5_independence.py \
            deploy/vps-t5/patch_brotoculateur_t5_independence.py \
            deploy/vps-t5/test_t5_independence.py

      - name: Configure pinned VPS SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage T5 tools
        if: inputs.mode == 'canary_start'
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy/vps-t5/t5_independence.py \
            deploy/vps-t5/patch_brotoculateur_t5_independence.py \
            deploy/vps-t5/test_t5_independence.py \
            "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Audit or deploy T5
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "MODE='$MODE' bash -se" <<'REMOTE'
          set -euo pipefail
          BROTO_ROOT="$HOME/brotoculateur"
          PKG="$BROTO_ROOT/src/brotoculateur"
          ORCH="$PKG/orchestrator.py"
          DASH="$PKG/dashboard.py"
          T4MOD="$PKG/t4_convergence.py"
          T5MOD="$PKG/t5_independence.py"
          STATUS_URL='http://127.0.0.1:8781/api/status'

          PRE_T4='736f19b2b2bf25b65d7fa32e17576c3dac3125fb8bf3cb063bb00e6629482ed5'
          PRE_ORCH='1ee7c8e61d538f4d8c5617179a64bc3b15e8c3084ea096a909fa4343afbf737e'
          PRE_DASH='0d2a7f64fe8082186060210891ded1fc12ddeef01daacfbaff496f9e63d41cc6'
          POST_T4='228333cc7153a390f45b93ca3f79a43065ba0697a36b54034a67b623c21387c8'
          POST_T5='22d71b4d3d52093ee10aa78a5ea0f620abc4c5c06e5bddfe6ddf09b9a638a3c6'
          POST_ORCH='461a18418bf2abc0c4f434287e5783d1e29bfaf67d9837d9e388b8a6f1b8fb7c'
          POST_DASH='dc7d1fe9212a30f40371381b8abfcca91d5ea490227859a4759412d72ca59c10'

          test -f "$ORCH" -a -f "$DASH" -a -f "$T4MOD"
          systemctl --user is-active --quiet brotoculateur.service
          curl -fsS --max-time 5 "$STATUS_URL" >/tmp/t5-before.json

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t5-before.json',encoding='utf-8'))
          c2=d.get('c2_fingerprint') or {}; t2=d.get('t2_exact_duplicate') or {}; t3=d.get('t3_neighborhood') or {}; t4=d.get('t4_convergence') or {}; t5=d.get('t5_independence') or {}
          print('STATE='+str(d.get('state')))
          print('PROCESSED='+str(d.get('processed_packets')))
          print('CRYSTALS='+str((d.get('brutomagique') or {}).get('total_crystals')))
          print('C2_TOTAL='+str(c2.get('total_fingerprints')))
          print('T2_DUPLICATES='+str(t2.get('exact_duplicates')))
          print('T3_OBSERVATIONS='+str(t3.get('observations')))
          print('T4_OBSERVATIONS='+str(t4.get('observations')))
          print('T4_CONVERGENCES='+str(t4.get('structural_convergence_events')))
          print('T4_TARGETS='+str(t4.get('convergent_targets')))
          print('T5_MODE='+str(t5.get('mode')))
          print('T5_ENABLED='+str(t5.get('enabled')))
          print('T5_OBSERVATIONS='+str(t5.get('observations')))
          print('T5_CANDIDATE_TARGETS='+str(t5.get('independence_candidate_targets')))
          PY

          orch_hash=$(sha256sum "$ORCH"|awk '{print $1}')
          dash_hash=$(sha256sum "$DASH"|awk '{print $1}')
          t4_hash=$(sha256sum "$T4MOD"|awk '{print $1}')
          if [ -f "$T5MOD" ]; then t5_hash=$(sha256sum "$T5MOD"|awk '{print $1}'); else t5_hash='ABSENT'; fi
          source_state='UNKNOWN'
          if [ "$orch_hash" = "$PRE_ORCH" ] && [ "$dash_hash" = "$PRE_DASH" ] && [ "$t4_hash" = "$PRE_T4" ] && [ "$t5_hash" = 'ABSENT' ]; then source_state='PRE_T5'; fi
          if [ "$orch_hash" = "$POST_ORCH" ] && [ "$dash_hash" = "$POST_DASH" ] && [ "$t4_hash" = "$POST_T4" ] && [ "$t5_hash" = "$POST_T5" ]; then source_state='POST_T5'; fi
          test "$source_state" != 'UNKNOWN'
          echo "T5_SOURCE_STATE=$source_state"
          df -P / | awk 'NR==2 {print "ROOT_DISK_USED=" $5 " ROOT_DISK_FREE_KB=" $4}'

          if [ "$MODE" = audit ]; then
            SOURCE_STATE="$source_state" python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/t5-before.json',encoding='utf-8'))
          c2=d.get('c2_fingerprint') or {}; c3=d.get('c3_library') or {}; c4=d.get('c4_novelty') or {}; c5=d.get('c5_rarity') or {}; c6=d.get('c6_provenance') or {}; c7=d.get('c7_router') or {}; t1=d.get('t1_family') or {}; t2=d.get('t2_exact_duplicate') or {}; t3=d.get('t3_neighborhood') or {}; t4=d.get('t4_convergence') or {}; t5=d.get('t5_independence') or {}
          assert not d.get('worker_error'), d.get('worker_error')
          n=int(c2.get('total_fingerprints') or 0)
          assert n==int(c3.get('observations') or 0)==int(c4.get('observations') or 0)==int(c5.get('observations') or 0)==int(c6.get('observations') or 0)==int(c7.get('observations') or 0)==int(t1.get('observations') or 0)==int(t2.get('observations') or 0)==int(t3.get('observations') or 0)==int(t4.get('observations') or 0)
          assert int(t2.get('cross_family_conflicts') or 0)==0
          assert int(t4.get('t2_consistency_conflicts') or 0)==0 and int(t4.get('t3_consistency_conflicts') or 0)==0
          assert t4.get('exact_duplicate_counts_as_convergence') is False
          if os.environ['SOURCE_STATE']=='POST_T5' and t5.get('enabled') is True:
              assert n==int(t5.get('observations') or 0)
              assert t5.get('authority')=='SHADOW_ONLY'
              assert t5.get('source_of_truth')=='T4_READ_ONLY_TARGET_SUMMARY'
              assert t5.get('scientific_independence_claim') is False
              assert t5.get('operational_candidate_only') is True
              assert int(t5.get('t4_consistency_conflicts') or 0)==0
              assert int(t5.get('packets_collapsed') or 0)==0 and int(t5.get('compute_skips') or 0)==0
              assert t5.get('controls_routing') is False and t5.get('controls_scheduling') is False
              assert t5.get('proof_promotion') is False
          print('T5_AUDIT_ONLY=PASS')
          PY
            exit 0
          fi

          if [ "$MODE" = canary_start ]; then
            test "$source_state" = 'PRE_T5'
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t5-before.json',encoding='utf-8'))
          z=d.get('brutus_cortex') or {}; c2=d.get('c2_fingerprint') or {}; c3=d.get('c3_library') or {}; c4=d.get('c4_novelty') or {}; c5=d.get('c5_rarity') or {}; c6=d.get('c6_provenance') or {}; c7=d.get('c7_router') or {}; t1=d.get('t1_family') or {}; t2=d.get('t2_exact_duplicate') or {}; t3=d.get('t3_neighborhood') or {}; t4=d.get('t4_convergence') or {}
          assert d.get('state') in {'RUNNING','PAUSED'} and not d.get('worker_error')
          assert z.get('enabled') is True and int(z.get('rollout_percent') or 0)==10
          assert all(x.get('enabled') is True for x in (c2,c3,c4,c5,c6,c7,t1,t2,t3,t4))
          n=int(c2.get('total_fingerprints') or 0)
          assert n==int(c3.get('observations') or 0)==int(c4.get('observations') or 0)==int(c5.get('observations') or 0)==int(c6.get('observations') or 0)==int(c7.get('observations') or 0)==int(t1.get('observations') or 0)==int(t2.get('observations') or 0)==int(t3.get('observations') or 0)==int(t4.get('observations') or 0)
          assert int(t4.get('t2_consistency_conflicts') or 0)==0 and int(t4.get('t3_consistency_conflicts') or 0)==0
          print('T5_REQUIRES_T4_T3_T2_T1_C7_C6_C5_C4_C3_C2_Z10=PASS')
          PY

            STAGE="/tmp/brotoculateur-t5-stage-$$"
            rm -rf "$STAGE"; mkdir -p "$STAGE/src"
            cp -a "$PKG" "$STAGE/src/brotoculateur"
            python3 /tmp/patch_brotoculateur_t5_independence.py "$STAGE"
            test "$(sha256sum "$STAGE/src/brotoculateur/orchestrator.py"|awk '{print $1}')" = "$POST_ORCH"
            test "$(sha256sum "$STAGE/src/brotoculateur/dashboard.py"|awk '{print $1}')" = "$POST_DASH"
            test "$(sha256sum "$STAGE/src/brotoculateur/t4_convergence.py"|awk '{print $1}')" = "$POST_T4"
            test "$(sha256sum "$STAGE/src/brotoculateur/t5_independence.py"|awk '{print $1}')" = "$POST_T5"
            PYTHONPATH="$STAGE/src" python3 /tmp/test_t5_independence.py
            echo 'T5_EXACT_LIVE_STAGE=PASS'
          else
            test "$source_state" = 'POST_T5'
          fi

          WAS_RUNNING=$(python3 - <<'PY'
          import json
          print('1' if json.load(open('/tmp/t5-before.json',encoding='utf-8')).get('state')=='RUNNING' else '0')
          PY
          )
          if [ "$WAS_RUNNING" = 1 ]; then
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/save >/tmp/t5-save.json
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/pause >/tmp/t5-pause.json
          fi
          curl -fsS --max-time 5 "$STATUS_URL" >/tmp/t5-paused.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t5-paused.json',encoding='utf-8'))
          assert d.get('state')=='PAUSED', d.get('state')
          print('T5_PAUSE_VERIFY=PASS')
          PY

          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP="$BROTO_ROOT/backups/t5-$STAMP"
          mkdir -p "$BACKUP"
          cp -a "$ORCH" "$DASH" "$T4MOD" "$BACKUP/"
          [ ! -f "$T5MOD" ] || cp -a "$T5MOD" "$BACKUP/"
          cp -a /tmp/t5-before.json "$BACKUP/status-before.json"
          DROPIN_DIR="$HOME/.config/systemd/user/brotoculateur.service.d"
          DROPIN="$DROPIN_DIR/95-brutus-t5.conf"
          mkdir -p "$DROPIN_DIR"
          HAD_DROPIN=0; [ ! -f "$DROPIN" ] || { HAD_DROPIN=1; cp -a "$DROPIN" "$BACKUP/95-brutus-t5.conf"; }
          HAD_T5=0; [ ! -f "$T5MOD" ] || HAD_T5=1
          echo "T5_BACKUP=$BACKUP"

          rollback() {
            rc=$?; set +e; echo "T5_ROLLBACK_BEGIN rc=$rc"
            cp -a "$BACKUP/orchestrator.py" "$ORCH"
            cp -a "$BACKUP/dashboard.py" "$DASH"
            cp -a "$BACKUP/t4_convergence.py" "$T4MOD"
            if [ "$HAD_T5" = 1 ]; then cp -a "$BACKUP/t5_independence.py" "$T5MOD"; else rm -f "$T5MOD"; fi
            if [ "$HAD_DROPIN" = 1 ]; then cp -a "$BACKUP/95-brutus-t5.conf" "$DROPIN"; else rm -f "$DROPIN"; fi
            systemctl --user daemon-reload
            systemctl --user restart brotoculateur.service
            sleep 2
            if [ "$WAS_RUNNING" = 1 ]; then curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/start >/tmp/t5-rollback-start.json || true; fi
            echo 'T5_ROLLBACK_DONE'; exit "$rc"
          }
          trap rollback ERR

          if [ "$MODE" = canary_start ]; then
            cp -a "$STAGE/src/brotoculateur/orchestrator.py" "$ORCH"
            cp -a "$STAGE/src/brotoculateur/dashboard.py" "$DASH"
            cp -a "$STAGE/src/brotoculateur/t4_convergence.py" "$T4MOD"
            cp -a "$STAGE/src/brotoculateur/t5_independence.py" "$T5MOD"
            cat > "$DROPIN" <<'EOF'
          [Service]
          Environment="BROTO_T5_ENABLED=1"
          EOF
          else
            cat > "$DROPIN" <<'EOF'
          [Service]
          Environment="BROTO_T5_ENABLED=0"
          EOF
          fi

          systemctl --user daemon-reload
          systemctl --user restart brotoculateur.service
          ok=0
          for _ in $(seq 1 20); do
            if systemctl --user is-active --quiet brotoculateur.service && curl -fsS --max-time 2 "$STATUS_URL" >/tmp/t5-after.json; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

          MODE="$MODE" python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/t5-after.json',encoding='utf-8'))
          t4=d.get('t4_convergence') or {}; t5=d.get('t5_independence') or {}
          assert not d.get('worker_error'), d.get('worker_error')
          assert t4.get('enabled') is True
          if os.environ['MODE']=='canary_start':
              assert t5.get('mode')=='BRUTUS_T5_OPERATIONAL_INDEPENDENCE_V1' and t5.get('enabled') is True
              assert t5.get('authority')=='SHADOW_ONLY'
              assert t5.get('source_of_truth')=='T4_READ_ONLY_TARGET_SUMMARY'
              assert t5.get('scientific_independence_claim') is False and t5.get('operational_candidate_only') is True
              assert int(t5.get('packets_collapsed') or 0)==0 and int(t5.get('compute_skips') or 0)==0
          else:
              assert t5.get('enabled') is False
          print('T5_DEPLOY_VERIFY=PASS')
          PY

          if [ "$MODE" = canary_start ] || [ "$WAS_RUNNING" = 1 ]; then
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/start >/tmp/t5-start.json
            live=0
            for _ in $(seq 1 30); do
              curl -fsS --max-time 2 "$STATUS_URL" >/tmp/t5-live.json || true
              if MODE="$MODE" python3 - <<'PY'
          import json,os,sys
          try: d=json.load(open('/tmp/t5-live.json',encoding='utf-8'))
          except Exception: sys.exit(1)
          t4=d.get('t4_convergence') or {}; t5=d.get('t5_independence') or {}
          good=d.get('state')=='RUNNING' and not d.get('worker_error')
          if os.environ.get('MODE')=='canary_start':
              n=int(t5.get('observations') or 0)
              good=good and n>0 and n==int(t4.get('observations') or 0)
              good=good and int(t5.get('t4_consistency_conflicts') or 0)==0
              good=good and int(t5.get('packets_collapsed') or 0)==0 and int(t5.get('compute_skips') or 0)==0
          sys.exit(0 if good else 1)
          PY
              then live=1; break; fi
              sleep 1
            done
            test "$live" = 1
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t5-live.json',encoding='utf-8'))
          t4=d.get('t4_convergence') or {}; t5=d.get('t5_independence') or {}
          print('T5_LIVE_STATE='+str(d.get('state')))
          print('T5_LIVE_PROCESSED='+str(d.get('processed_packets')))
          print('T5_LIVE_CRYSTALS='+str((d.get('brutomagique') or {}).get('total_crystals')))
          print('T5_LIVE_T4='+str(t4.get('observations')))
          print('T5_LIVE_OBSERVATIONS='+str(t5.get('observations')))
          print('T5_LIVE_TIERS='+str(t5.get('tier_target_counts')))
          print('T5_LIVE_CANDIDATE_TARGETS='+str(t5.get('independence_candidate_targets')))
          print('T5_LIVE_T4_CONFLICTS='+str(t5.get('t4_consistency_conflicts')))
          print('T5_LIVE_VERIFY=PASS')
          PY
          fi

          if [ "$MODE" = canary_start ]; then
            test "$(sha256sum "$ORCH"|awk '{print $1}')" = "$POST_ORCH"
            test "$(sha256sum "$DASH"|awk '{print $1}')" = "$POST_DASH"
            test "$(sha256sum "$T4MOD"|awk '{print $1}')" = "$POST_T4"
            test "$(sha256sum "$T5MOD"|awk '{print $1}')" = "$POST_T5"
          fi
          df -P / | awk 'NR==2 {print "T5_ROOT_DISK_USED=" $5 " T5_ROOT_DISK_FREE_KB=" $4}'
          trap - ERR
          rm -rf "${STAGE:-}"
          echo 'T5_WORKFLOW=PASS'
          REMOTE
