name: Deploy Genesis progressive LIVE runtime

on:
  push:
    branches:
      - main
    paths:
      - 'laboratoire/genesis/live-v2/**'
      - '.github/workflows/deploy-genesis-progressive-live-runtime.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-GENESIS-PROGRESSIVE-LIVE'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: genesis-progressive-live-runtime-deploy
  cancel-in-progress: false

jobs:
  deploy-progressive-live:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY-GENESIS-PROGRESSIVE-LIVE'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TARGET_ROOT: /var/www/antmux.com/public_html/laboratoire/genesis
      REMOTE_STAGE: /tmp/antmux-genesis-progressive-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Validate progressive LIVE runtime through C068
        run: |
          set -euo pipefail
          node laboratoire/genesis/live-v2/test-progressive-live.mjs
          node laboratoire/genesis/live-v2/test-progressive-live-c067.mjs
          node laboratoire/genesis/live-v2/test-progressive-live-c068.mjs
          bash -n laboratoire/genesis/live/sync-public-read-only.sh
          cat > /tmp/genesis-status.env <<'EOF'
          science_baseline=GREEN
          genesis003_c041_c060=COMPLETE_VALIDATED
          experiment_selection_performed=true
          selected_experiment_status=PLANNED_NOT_EXECUTED
          hypothesis_selection_performed=false
          hypothesis_ranking_produced=false
          uncertainty_promotion_performed=false
          probabilities_produced=false
          evidence_ledger_auto_promotion=false
          GENESIS_AUDIT_FAILED=0
          EOF
          GENESIS_PUBLIC_LIVE_ACTIVE=1 node laboratoire/genesis/live-v2/build-public-source-progressive-c068.mjs /tmp/genesis-status.env /tmp/progressive-input.json
          node laboratoire/genesis/live-v2/bridge-public-progressive-c068.mjs /tmp/progressive-input.json
          node laboratoire/genesis/validate-public-v2.mjs .build/genesis-public-read-only-bridge/public-read-only-envelope.json

      - name: Assemble and smoke-test exact progressive runtime package
        run: |
          set -euo pipefail
          rm -rf _genesis_progressive_deploy
          mkdir -p _genesis_progressive_deploy/runtime/live-v2
          cp laboratoire/genesis/live-v2/build-public-source-progressive-c067.mjs _genesis_progressive_deploy/runtime/live-v2/build-public-source-progressive-c067.mjs
          cp laboratoire/genesis/live-v2/bridge-public-progressive-c067.mjs _genesis_progressive_deploy/runtime/live-v2/bridge-public-progressive-c067.mjs
          cp laboratoire/genesis/live-v2/build-public-source-progressive-c068.mjs _genesis_progressive_deploy/runtime/live-v2/build-public-source-progressive-c068.mjs
          cp laboratoire/genesis/live-v2/bridge-public-progressive-c068.mjs _genesis_progressive_deploy/runtime/live-v2/bridge-public-progressive-c068.mjs
          cp laboratoire/genesis/live-v2/build-public-source-progressive-c068.mjs _genesis_progressive_deploy/runtime/live-v2/build-public-source-progressive.mjs
          cp laboratoire/genesis/live-v2/bridge-public-progressive-c068.mjs _genesis_progressive_deploy/runtime/live-v2/bridge-public-progressive.mjs
          cp laboratoire/genesis/live/sync-public-read-only.sh _genesis_progressive_deploy/runtime/live-v2/
          cp laboratoire/genesis/validate-public-v2.mjs _genesis_progressive_deploy/runtime/
          chmod 0755 _genesis_progressive_deploy/runtime/live-v2/sync-public-read-only.sh
          (
            cd _genesis_progressive_deploy
            sha256sum \
              runtime/live-v2/build-public-source-progressive-c067.mjs \
              runtime/live-v2/bridge-public-progressive-c067.mjs \
              runtime/live-v2/build-public-source-progressive-c068.mjs \
              runtime/live-v2/bridge-public-progressive-c068.mjs \
              runtime/live-v2/build-public-source-progressive.mjs \
              runtime/live-v2/bridge-public-progressive.mjs \
              runtime/live-v2/sync-public-read-only.sh \
              runtime/validate-public-v2.mjs > SHA256SUMS
          )
          cat > /tmp/package-status.env <<'EOF'
          science_baseline=GREEN
          genesis003_c041_c060=COMPLETE_VALIDATED
          experiment_selection_performed=true
          selected_experiment_status=PLANNED_NOT_EXECUTED
          hypothesis_selection_performed=false
          hypothesis_ranking_produced=false
          uncertainty_promotion_performed=false
          probabilities_produced=false
          evidence_ledger_auto_promotion=false
          GENESIS_AUDIT_FAILED=0
          EOF
          rm -rf .build/genesis-public-read-only-bridge
          GENESIS_PUBLIC_LIVE_ACTIVE=1 node _genesis_progressive_deploy/runtime/live-v2/build-public-source-progressive.mjs /tmp/package-status.env /tmp/package-input.json
          node _genesis_progressive_deploy/runtime/live-v2/bridge-public-progressive.mjs /tmp/package-input.json
          node _genesis_progressive_deploy/runtime/validate-public-v2.mjs .build/genesis-public-read-only-bridge/public-read-only-envelope.json
          test -f _genesis_progressive_deploy/runtime/live-v2/build-public-source-progressive-c067.mjs
          test -f _genesis_progressive_deploy/runtime/live-v2/bridge-public-progressive-c067.mjs
          test -f _genesis_progressive_deploy/runtime/live-v2/build-public-source-progressive-c068.mjs
          test -f _genesis_progressive_deploy/runtime/live-v2/bridge-public-progressive-c068.mjs
          echo 'GENESIS_PROGRESSIVE_PACKAGE_IMPORT_SMOKE=PASS'

      - name: Configure pinned VPS SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          test "$actual_public_key" = "$expected_public_key"
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Preflight VPS and private read-only source
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE'
          set -euo pipefail
          TARGET_ROOT='/var/www/antmux.com/public_html/laboratoire/genesis'
          key="$HOME/.ssh/seedgenesis_only_readonly_ed25519"
          known="$HOME/.ssh/known_hosts_seedgenesis"
          test -d "$TARGET_ROOT"
          test -w "$TARGET_ROOT"
          test -f "$key"
          test -f "$known"
          chmod 600 "$key" "$known"
          sshopts="-i $key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known -o HostKeyAlgorithms=ssh-ed25519"
          probe="$(mktemp -d)"
          trap 'rm -rf "$probe"' EXIT
          git init --bare -q "$probe/source.git"
          git --git-dir="$probe/source.git" remote add origin git@github.com:Topbrutus/seedgenesis.git
          GIT_SSH_COMMAND="ssh $sshopts" git --git-dir="$probe/source.git" fetch -q --no-tags --depth=1 origin public/live-source
          GIT_SSH_COMMAND="ssh $sshopts" git --git-dir="$probe/source.git" show FETCH_HEAD:public/live/status.env > "$probe/status.env"
          lines="$(wc -l < "$probe/status.env" | tr -d ' ')"
          test "$lines" = '10' || test "$lines" = '15' || test "$lines" = '24' || test "$lines" = '31' || test "$lines" = '38' || test "$lines" = '42' || test "$lines" = '46' || test "$lines" = '51' || test "$lines" = '56'
          grep -Fxq 'science_baseline=GREEN' "$probe/status.env"
          grep -Fxq 'selected_experiment_status=PLANNED_NOT_EXECUTED' "$probe/status.env"
          grep -Fxq 'GENESIS_AUDIT_FAILED=0' "$probe/status.env"
          echo "PRIVATE_PROGRESSIVE_SOURCE_PREFLIGHT=PASS lines=$lines"
          REMOTE

      - name: Upload progressive runtime package
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "rm -rf '$REMOTE_STAGE' && mkdir -p '$REMOTE_STAGE'"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -r _genesis_progressive_deploy/. "$VPS_USER@$VPS_HOST:$REMOTE_STAGE/"

      - name: Backup install validate and atomically switch cron
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE'
          set -euo pipefail
          TARGET_ROOT='/var/www/antmux.com/public_html/laboratoire/genesis'
          REMOTE_STAGE='${{ env.REMOTE_STAGE }}'
          RUNTIME_ROOT="$HOME/antmux-genesis-live-v2"
          STATE_ROOT="$HOME/.local/state/antmux-genesis-live-v2"
          BACKUP_ROOT="$HOME/antmux-genesis-live-v2-backups/$(date -u +%Y%m%d-%H%M%S)-${{ github.sha }}"
          cd "$REMOTE_STAGE"
          sha256sum -c SHA256SUMS
          mkdir -p "$BACKUP_ROOT"
          crontab -l > "$BACKUP_ROOT/crontab.before" 2>/dev/null || true
          if test -f "$TARGET_ROOT/live/public-read-only.json"; then cp -a "$TARGET_ROOT/live/public-read-only.json" "$BACKUP_ROOT/public-read-only.json"; fi
          if test -d "$RUNTIME_ROOT"; then cp -a "$RUNTIME_ROOT" "$BACKUP_ROOT/runtime.before"; fi
          install -d -m 0700 "$RUNTIME_ROOT" "$RUNTIME_ROOT/live-v2" "$STATE_ROOT"
          install -d -m 0755 "$TARGET_ROOT/live"
          install -m 0600 "$REMOTE_STAGE/runtime/live-v2/build-public-source-progressive-c067.mjs" "$RUNTIME_ROOT/live-v2/build-public-source-progressive-c067.mjs"
          install -m 0600 "$REMOTE_STAGE/runtime/live-v2/bridge-public-progressive-c067.mjs" "$RUNTIME_ROOT/live-v2/bridge-public-progressive-c067.mjs"
          install -m 0600 "$REMOTE_STAGE/runtime/live-v2/build-public-source-progressive-c068.mjs" "$RUNTIME_ROOT/live-v2/build-public-source-progressive-c068.mjs"
          install -m 0600 "$REMOTE_STAGE/runtime/live-v2/bridge-public-progressive-c068.mjs" "$RUNTIME_ROOT/live-v2/bridge-public-progressive-c068.mjs"
          install -m 0600 "$REMOTE_STAGE/runtime/live-v2/build-public-source-progressive.mjs" "$RUNTIME_ROOT/live-v2/build-public-source-progressive.mjs"
          install -m 0600 "$REMOTE_STAGE/runtime/live-v2/bridge-public-progressive.mjs" "$RUNTIME_ROOT/live-v2/bridge-public-progressive.mjs"
          install -m 0700 "$REMOTE_STAGE/runtime/live-v2/sync-public-read-only.sh" "$RUNTIME_ROOT/live-v2/sync-public-read-only.sh"
          install -m 0600 "$REMOTE_STAGE/runtime/validate-public-v2.mjs" "$RUNTIME_ROOT/validate-public-v2.mjs"
          cat > "$RUNTIME_ROOT/run-sync-v2.sh" <<'RUNNER'
          #!/usr/bin/env bash
          set -euo pipefail
          export GENESIS_PRIVATE_REPO_SSH='git@github.com:Topbrutus/seedgenesis.git'
          export GENESIS_PRIVATE_REF='public/live-source'
          export GENESIS_PRIVATE_RESULT_PATH='public/live/status.env'
          export GENESIS_DEPLOY_KEY="$HOME/.ssh/seedgenesis_only_readonly_ed25519"
          export GENESIS_GITHUB_KNOWN_HOSTS="$HOME/.ssh/known_hosts_seedgenesis"
          export GENESIS_RUNTIME_DIR="$HOME/.local/state/antmux-genesis-live-v2"
          export GENESIS_PUBLIC_OUTPUT='/var/www/antmux.com/public_html/laboratoire/genesis/live/public-read-only.json'
          export GENESIS_BUILDER="$HOME/antmux-genesis-live-v2/live-v2/build-public-source-progressive.mjs"
          export GENESIS_BRIDGE="$HOME/antmux-genesis-live-v2/live-v2/bridge-public-progressive.mjs"
          export GENESIS_VALIDATOR="$HOME/antmux-genesis-live-v2/validate-public-v2.mjs"
          export GENESIS_PUBLIC_LIVE_ACTIVE='1'
          exec "$HOME/antmux-genesis-live-v2/live-v2/sync-public-read-only.sh"
          RUNNER
          chmod 0700 "$RUNTIME_ROOT/run-sync-v2.sh"
          "$RUNTIME_ROOT/run-sync-v2.sh"
          node "$RUNTIME_ROOT/validate-public-v2.mjs" "$TARGET_ROOT/live/public-read-only.json" >/dev/null
          node --input-type=module - "$TARGET_ROOT/live/public-read-only.json" <<'NODE'
          import { readFile } from 'node:fs/promises';
          const d=JSON.parse(await readFile(process.argv[2],'utf8'));
          if(d.mode!=='LIVE_READ_ONLY'||d.source_status!=='PUBLIC_READ_ONLY'||d.integrity_status!=='VERIFIED_PUBLIC') process.exit(1);
          if(d.payload?.publication_gates?.current_gate!=='LIVE_READ_ONLY_ACTIVE') process.exit(1);
          const stage=d.payload?.metrics?.find(x=>x.id==='genesis003-validated-through');
          if(!stage||!['C060','C061','C062','C063','C064','C065','C066','C067','C068'].includes(stage.value)||stage.status!=='VERIFIED_PUBLIC') process.exit(1);
          const write=d.payload?.metrics?.find(x=>x.id==='bridge-write-capability');
          if(write?.value!=='NONE') process.exit(1);
          NODE
          cron_line="*/2 * * * * $RUNTIME_ROOT/run-sync-v2.sh >> $STATE_ROOT/sync.log 2>&1"
          { crontab -l 2>/dev/null | grep -Fv 'antmux-genesis-live/run-sync.sh' | grep -Fv 'antmux-genesis-live-v2/run-sync-v2.sh' || true; printf '%s\n' "$cron_line"; } | crontab -
          crontab -l | grep -Fxq "$cron_line"
          rm -rf "$REMOTE_STAGE"
          echo 'GENESIS_PROGRESSIVE_LIVE_RUNTIME_DEPLOY=PASS'
          echo 'GENESIS_PROGRESSIVE_LIVE_REFRESH_MINUTES=2'
          echo 'GENESIS_PROGRESSIVE_LIVE_MAX_STAGE=C068'
          echo 'PUBLIC_WRITE_CAPABILITY=NONE'
          echo 'PRIVATE_SOURCE_CHECKOUT_PERSISTED=no'
          echo "BACKUP_ROOT=$BACKUP_ROOT"
          REMOTE

      - name: Verify public progressive LIVE endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 6 --retry-delay 2 https://antmux.com/laboratoire/genesis/live/public-read-only.json -o /tmp/live.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/live.json','utf8'));
          if(d.mode!=='LIVE_READ_ONLY'||d.source_status!=='PUBLIC_READ_ONLY'||d.integrity_status!=='VERIFIED_PUBLIC') throw new Error('public boundary');
          const stage=d.payload?.metrics?.find(x=>x.id==='genesis003-validated-through');
          if(!stage||!['C060','C061','C062','C063','C064','C065','C066','C067','C068'].includes(stage.value)) throw new Error('progressive stage');
          const active=d.payload?.metrics?.find(x=>x.id==='public-live-active');
          if(active?.value!==true||active?.status!=='VERIFIED_PUBLIC') throw new Error('live active');
          const text=JSON.stringify(d);
          for(const forbidden of [
            'Topbrutus/seedgenesis','Topbrutus/gesis','public/live-source','public/live/status.env','file:///','refs/heads/',
            'e8a3bfed7d518d579fc24515996b5296346c9e0842b5a6f3173ab02b030d3e54','932c41a3af4272ae40f74ffac0885f6a56ffaa99c2ba239a451a788b534246d5','8d4a6af197fc6ffb060d01126a317efadd63428fa0b0a96d781b12f364e2793c',
            'MiniMaxAI/MiniMax-Music3','LOCAL_HUGGINGFACE_DIFFUSERS','huggingface/diffusers','fbdf52fbaaca799592917417eb05f1899f1255ec','dafe3733fcfdbf3c48915fe77be3aef65b5d6a2d',
            'c302f498bf518f7e9b2c15a7c6fa552343ee8cb3a6e639112a98d191635cfbc5','dfcdae683b561ffb1379d8f7d92fed67439ae5d593e90e29a39100a22a3cc4d2','779a78432902c898dc37e05a62f90d69317638c38c0e1e1002e2d7077e953bdf',
            'generator_provider','model_name','model_version_or_build','runtime_repository','runtime_revision','model_revision'
          ]) if(text.includes(forbidden)) throw new Error(`private leak ${forbidden}`);
          console.log(`GENESIS_PROGRESSIVE_PUBLIC_ENDPOINT=PASS stage=${stage.value}`);
          NODE
