name: One-shot GAMEZEL runtime deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-gamezel-runtime-deploy.yml'

permissions:
  contents: read

concurrency:
  group: gamezel-runtime-one-shot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET_ZEL_SHA: 8a83b58ac857f5563a5b65601b76c80c80265a83
      EXPECTED_SERVER_SHA256: 7c462c14d21e12294a3f9eca8ce54b17960851f31211c9662a1df2fe6268e82e

    steps:
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          test "$actual_public_key" = "$expected_public_key"
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Patch GAMEZEL runtime with backup and rollback
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" \
            "TARGET_ZEL_SHA='$TARGET_ZEL_SHA' EXPECTED_SERVER_SHA256='$EXPECTED_SERVER_SHA256' bash -se" <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/zelstereos-gamezel"
          SERVICE="zelstereos-gamezel.service"
          cd "$ROOT"

          test -f server.js
          test -w server.js
          systemctl --user is-active --quiet "$SERVICE"

          OLD_LINE='    TIMESTAMP: cue.TIMESTAMP || cue.CREATED_AT || Date.now()'
          NEW_LINE='    TIMESTAMP: cue.STARTED_AT ?? cue.TIMESTAMP ?? cue.CREATED_AT ?? Date.now()'
          old_count="$(grep -Fxc "$OLD_LINE" server.js || true)"
          new_count="$(grep -Fxc "$NEW_LINE" server.js || true)"
          test "$old_count" = "1"
          test "$new_count" = "0"

          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          BACKUP_ROOT="$HOME/zelstereos-gamezel-backups/$STAMP-$TARGET_ZEL_SHA"
          mkdir -p "$BACKUP_ROOT"
          cp -a server.js "$BACKUP_ROOT/server.js"
          OLD_SHA256="$(sha256sum server.js | awk '{print $1}')"

          rollback() {
            echo "GAMEZEL_RUNTIME_DEPLOY=ROLLBACK"
            cp -a "$BACKUP_ROOT/server.js" server.js || true
            systemctl --user restart "$SERVICE" || true
          }
          trap rollback ERR

          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text(encoding='utf-8')
          old = "    TIMESTAMP: cue.TIMESTAMP || cue.CREATED_AT || Date.now()"
          new = "    TIMESTAMP: cue.STARTED_AT ?? cue.TIMESTAMP ?? cue.CREATED_AT ?? Date.now()"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one old timestamp mapping, found {s.count(old)}')
          if new in s:
              raise SystemExit('new timestamp mapping already present unexpectedly')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          grep -Fqx "$NEW_LINE" server.js
          test "$(sha256sum server.js | awk '{print $1}')" = "$EXPECTED_SERVER_SHA256"
          node --check server.js

          systemctl --user restart "$SERVICE"
          for _ in $(seq 1 20); do
            if systemctl --user is-active --quiet "$SERVICE" && curl --fail --silent --show-error http://127.0.0.1:3217/api/public/gamezel/state >/tmp/gamezel-state.json; then
              break
            fi
            sleep 1
          done
          systemctl --user is-active --quiet "$SERVICE"
          curl --fail --silent --show-error http://127.0.0.1:3217/api/public/gamezel/state >/tmp/gamezel-state.json

          presence="$(curl --fail --silent --show-error http://127.0.0.1:3217/api/public/gamezel/presence)"
          draw_enabled="$(printf '%s' "$presence" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).draw_enabled?'true':'false'))")"
          if test "$draw_enabled" = "true"; then
            curl --fail --silent --show-error -X POST http://127.0.0.1:3217/api/public/gamezel/draw \
              -H 'Content-Type: application/json' \
              --data '{"player_id":"P1"}' >/tmp/gamezel-safe-draw.json
            echo "GAMEZEL_SAFE_DRAW=TRIGGERED"
          else
            echo "GAMEZEL_SAFE_DRAW=DISABLED"
          fi

          trap - ERR
          echo "GAMEZEL_RUNTIME_DEPLOY=PASS"
          echo "SOURCE_ZEL_SHA=$TARGET_ZEL_SHA"
          echo "OLD_SERVER_SHA256=$OLD_SHA256"
          echo "NEW_SERVER_SHA256=$(sha256sum server.js | awk '{print $1}')"
          echo "BACKUP_ROOT=$BACKUP_ROOT"
          REMOTE

      - name: Verify public mirror heartbeat and timestamp stability
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/zelstereos/live/state.json -o /tmp/state-a.json
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/zelstereos/live/audio.json -o /tmp/audio-a.json
          sleep 11
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/zelstereos/live/state.json -o /tmp/state-b.json
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/zelstereos/live/audio.json -o /tmp/audio-b.json
          python - <<'PY'
          import json
          sa=json.load(open('/tmp/state-a.json',encoding='utf-8'))
          sb=json.load(open('/tmp/state-b.json',encoding='utf-8'))
          aa=json.load(open('/tmp/audio-a.json',encoding='utf-8'))
          ab=json.load(open('/tmp/audio-b.json',encoding='utf-8'))
          assert int(sb['generated_at']) > int(sa['generated_at']), (sa.get('generated_at'), sb.get('generated_at'))
          a={c.get('EVENT_ID'):c for c in aa.get('cues',[]) if c.get('EVENT_ID')}
          b={c.get('EVENT_ID'):c for c in ab.get('cues',[]) if c.get('EVENT_ID')}
          common=sorted(set(a)&set(b))
          changed=[eid for eid in common if a[eid].get('TIMESTAMP') != b[eid].get('TIMESTAMP')]
          assert not changed, changed[:10]
          print('GAMEZEL_PUBLIC_MIRROR_HEARTBEAT=PASS')
          print(f'GAMEZEL_AUDIO_COMMON_CUES={len(common)}')
          print(f'GAMEZEL_AUDIO_TIMESTAMP_CHANGED={len(changed)}')
          PY
