name: Inspect Antigravity SDK API on VPS

on:
  push:
    branches:
      - astra/gamezel-vps-audit-20261002
    paths:
      - '.github/workflows/inspect-antigravity-sdk-api.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect SDK signatures
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE'
          set -euo pipefail
          PY="$HOME/.local/share/gamezel-antigravity-sdk/venv/bin/python"
          test -x "$PY"
          "$PY" - <<'PY'
          import inspect
          from google.antigravity import Agent, LocalAgentConfig

          print("=== LOCAL_AGENT_CONFIG ===")
          print(inspect.signature(LocalAgentConfig))
          print("=== AGENT CTOR ===")
          print(inspect.signature(Agent))
          print("=== AGENT PUBLIC METHODS ===")
          for name in sorted(n for n in dir(Agent) if not n.startswith("_")):
              obj=getattr(Agent,name)
              try:
                  sig=inspect.signature(obj)
              except Exception:
                  sig=""
              print(f"{name}{sig}")
          PY
          REMOTE
