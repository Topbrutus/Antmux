name: ASTRA GAMEZEL Acceptance Peek
on:
  push:
    branches: [astra/gamezel-control-20261003]
    paths: ['.github/workflows/astra-gamezel-acceptance-peek.yml']
permissions:
  contents: read
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '${{ secrets.ANTMUX_VPS_HOST }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Peek live acceptance state
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/zelstereos-gamezel"
          "$ROOT/bin/gamezel-p1" status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); c=d.get("currentTurn") or d.get("current_turn") or {}; print("ROUND_ACTIVE="+str(bool(d.get("roundActive") if "roundActive" in d else d.get("round_active"))).upper()); print("ROUND="+str(d.get("round"))); print("CURRENT="+str(c.get("PLAYER_ID") or c.get("player_id")))'
          for x in p2 p3 p4; do
            echo "=== $x ==="
            journalctl --user -u "zelstereos-gamezel-$x.service" --since '10 minutes ago' -o cat --no-pager | tail -n 15 | sed -E 's#(token|secret|key|password)=([^ ]+)#\1=REDACTED#Ig' || true
          done
          REMOTE
