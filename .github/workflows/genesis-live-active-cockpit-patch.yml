name: Patch Genesis cockpit active gate

on:
  push:
    branches:
      - genesis/connect-public-read-only-endpoint
    paths:
      - '.github/workflows/genesis-live-active-cockpit-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: genesis/connect-public-read-only-endpoint
          fetch-depth: 1

      - name: Require ACTIVE state before cockpit displays LIVE
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('laboratoire/genesis/index.html')
          text = p.read_text(encoding='utf-8')
          old = "if(live?.status!=='PASSED')throw new Error('Le gate LIVE_READ_ONLY doit être PASSED.');const age=Date.now()-Date.parse(d.published_at);"
          new = "if(live?.status!=='PASSED')throw new Error('Le gate LIVE_READ_ONLY doit être PASSED.');if(d.payload.publication_gates?.current_gate!=='LIVE_READ_ONLY_ACTIVE')throw new Error('Le LIVE public existe mais n’est pas activé.');const activeMetric=d.payload.metrics?.find(x=>x.id==='public-live-active');if(activeMetric?.value!==true||activeMetric?.status!=='VERIFIED_PUBLIC')throw new Error('Le LIVE public doit attester public-live-active=true.');const age=Date.now()-Date.parse(d.published_at);"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one cockpit LIVE gate target, found {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          grep -Fq "LIVE_READ_ONLY_ACTIVE" laboratoire/genesis/index.html
          grep -Fq "public-live-active" laboratoire/genesis/index.html
          ! grep -Fq "Topbrutus/seedgenesis" laboratoire/genesis/index.html
          git diff --check

      - name: Commit cockpit gate
        run: |
          set -euo pipefail
          git config user.name 'Topbrutus'
          git config user.email 'topbrutus.ordinadoc@gmail.com'
          git add -- laboratoire/genesis/index.html
          git diff --cached --name-only
          git diff --cached --check
          git commit -m 'security: require active live gate in public cockpit'
          git push origin HEAD:genesis/connect-public-read-only-endpoint
