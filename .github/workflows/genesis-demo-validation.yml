name: Genesis Vision Center validation

on:
  push:
    branches:
      - lab/public-research-v1
      - genesis/vision-center-v2
      - prepare-snapshot-view-validate-deploy
      - genesis/evaluate-live-read-only
      - main
    paths:
      - 'laboratoire/**'
      - '.github/workflows/genesis-demo-validation.yml'
  pull_request:
    paths:
      - 'laboratoire/**'
      - '.github/workflows/genesis-demo-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-genesis-vision-center:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate historical v1 DEMO snapshot
        run: node laboratoire/genesis/validate-demo.mjs

      - name: Run historical v1 adversarial tests
        run: node laboratoire/genesis/test-validator.mjs

      - name: Validate canonical v2 DEMO snapshot
        run: node laboratoire/genesis/validate-public-v2.mjs

      - name: Run v2 adversarial validator tests
        run: node laboratoire/genesis/test-public-v2.mjs

      - name: Validate Genesis Public Adapter boundary
        run: node laboratoire/genesis/adapter/validate-public-adapter.mjs

      - name: Run Genesis Public Adapter adversarial tests
        run: node laboratoire/genesis/adapter/test-public-adapter.mjs

      - name: Validate frozen public snapshot 0001
        run: node laboratoire/genesis/snapshot/validate-snapshot-0001.mjs

      - name: Run public snapshot 0001 adversarial tests
        run: node laboratoire/genesis/snapshot/test-snapshot-0001.mjs

      - name: Evaluate LIVE_READ_ONLY boundary without activation
        run: node laboratoire/genesis/live/evaluate-live-read-only.mjs

      - name: Run LIVE_READ_ONLY adversarial evaluation tests
        run: node laboratoire/genesis/live/test-live-read-only.mjs

      - name: Validate server-side public read-only bridge
        run: node laboratoire/genesis/live/bridge-public-read-only.mjs

      - name: Run server-side public read-only bridge adversarial tests
        run: node laboratoire/genesis/live/test-public-read-only-bridge.mjs

      - name: Smoke-test packaged progressive C067 runtime imports
        run: |
          set -euo pipefail
          package=/tmp/genesis-progressive-package
          rm -rf "$package" .build/genesis-public-read-only-bridge
          mkdir -p "$package/runtime/live-v2"
          cp laboratoire/genesis/live-v2/build-public-source-progressive-c067.mjs "$package/runtime/live-v2/build-public-source-progressive-c067.mjs"
          cp laboratoire/genesis/live-v2/bridge-public-progressive-c067.mjs "$package/runtime/live-v2/bridge-public-progressive-c067.mjs"
          cp laboratoire/genesis/live-v2/build-public-source-progressive-c067.mjs "$package/runtime/live-v2/build-public-source-progressive.mjs"
          cp laboratoire/genesis/live-v2/bridge-public-progressive-c067.mjs "$package/runtime/live-v2/bridge-public-progressive.mjs"
          cp laboratoire/genesis/validate-public-v2.mjs "$package/runtime/validate-public-v2.mjs"
          cat > /tmp/package-status.env <<'EOF'
          science_baseline=GREEN
          genesis003_c041_c060=COMPLETE_VALIDATED
          experiment_selection_performed=true
          selected_experiment_status=PLANNED_NOT_EXECUTED
          hypothesis_selection_performed=false
          hypothesis_ranking_produced=false
          uncertainty_promotion_performed=false
          probabilities_produced=false
          evidence_ledger_auto_promotion=false
          GENESIS_AUDIT_FAILED=0
          EOF
          GENESIS_PUBLIC_LIVE_ACTIVE=1 node "$package/runtime/live-v2/build-public-source-progressive.mjs" /tmp/package-status.env /tmp/package-input.json
          node "$package/runtime/live-v2/bridge-public-progressive.mjs" /tmp/package-input.json
          node "$package/runtime/validate-public-v2.mjs" .build/genesis-public-read-only-bridge/public-read-only-envelope.json
          echo 'GENESIS_PROGRESSIVE_PACKAGE_IMPORT_SMOKE=PASS'

      - name: Upload LIVE_READ_ONLY evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-live-read-only-evaluation
          path: .build/genesis-live-read-only-evaluation/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload server-side public read-only bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-public-read-only-bridge
          path: .build/genesis-public-read-only-bridge/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Genesis Public Adapter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-public-adapter-evidence
          path: .build/genesis-adapter-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload frozen public snapshot 0001
        uses: actions/upload-artifact@v4
        with:
          name: genesis-public-snapshot-0001
          path: laboratoire/genesis/snapshot/genesis-public-snapshot-0001.json
          if-no-files-found: error
          retention-days: 7

      - name: Smoke-test v2 static cockpit over HTTP
        run: node laboratoire/genesis/smoke-cockpit.mjs

      - name: Install isolated Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render and verify v2 cockpit in real Chromium
        run: node laboratoire/genesis/browser-cockpit.mjs

      - name: Upload Chromium visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-cockpit-v2-browser-evidence
          path: .build/genesis-browser-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Antmux home to laboratory to Genesis in real Chromium
        run: node laboratoire/browser-public-site.mjs

      - name: Upload public laboratory navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antmux-lab-browser-evidence
          path: .build/antmux-lab-browser-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Build deployable Genesis Vision Center bundle
        run: node laboratoire/genesis/build-public-bundle.mjs

      - name: Upload Genesis Vision Center bundle
        uses: actions/upload-artifact@v4
        with:
          name: genesis-vision-center-v2
          path: .build/genesis-vision-center-snapshot/
          if-no-files-found: error
          retention-days: 7

      - name: Build Antmux laboratory public overlay
        run: node laboratoire/build-public-overlay.mjs

      - name: Upload Antmux laboratory public overlay
        uses: actions/upload-artifact@v4
        with:
          name: antmux-laboratoire-public
          path: .build/antmux-laboratoire-public/
          if-no-files-found: error
          retention-days: 7
