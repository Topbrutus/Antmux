name: Genesis DEMO validation

on:
  push:
    branches:
      - lab/public-research-v1
    paths:
      - 'laboratoire/genesis/**'
      - '.github/workflows/genesis-demo-validation.yml'
  pull_request:
    paths:
      - 'laboratoire/genesis/**'
      - '.github/workflows/genesis-demo-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate canonical DEMO snapshot
        run: node laboratoire/genesis/validate-demo.mjs

      - name: Run adversarial validator tests
        run: node laboratoire/genesis/test-validator.mjs
