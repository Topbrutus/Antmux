name: Genesis Vision Center validation

on:
  push:
    branches:
      - lab/public-research-v1
      - genesis/vision-center-v2
      - prepare-snapshot-view-validate-deploy
      - main
    paths:
      - 'laboratoire/**'
      - '.github/workflows/genesis-demo-validation.yml'
  pull_request:
    paths:
      - 'laboratoire/**'
      - '.github/workflows/genesis-demo-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-genesis-vision-center:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate historical v1 DEMO snapshot
        run: node laboratoire/genesis/validate-demo.mjs

      - name: Run historical v1 adversarial tests
        run: node laboratoire/genesis/test-validator.mjs

      - name: Validate canonical v2 DEMO snapshot
        run: node laboratoire/genesis/validate-public-v2.mjs

      - name: Run v2 adversarial validator tests
        run: node laboratoire/genesis/test-public-v2.mjs

      - name: Validate Genesis Public Adapter boundary
        run: node laboratoire/genesis/adapter/validate-public-adapter.mjs

      - name: Run Genesis Public Adapter adversarial tests
        run: node laboratoire/genesis/adapter/test-public-adapter.mjs

      - name: Validate frozen public snapshot 0001
        run: node laboratoire/genesis/snapshot/validate-snapshot-0001.mjs

      - name: Run public snapshot 0001 adversarial tests
        run: node laboratoire/genesis/snapshot/test-snapshot-0001.mjs

      - name: Upload Genesis Public Adapter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-public-adapter-evidence
          path: .build/genesis-adapter-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload frozen public snapshot 0001
        uses: actions/upload-artifact@v4
        with:
          name: genesis-public-snapshot-0001
          path: laboratoire/genesis/snapshot/genesis-public-snapshot-0001.json
          if-no-files-found: error
          retention-days: 7

      - name: Smoke-test v2 static cockpit over HTTP
        run: node laboratoire/genesis/smoke-cockpit.mjs

      - name: Install isolated Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render and verify v2 cockpit in real Chromium
        run: node laboratoire/genesis/browser-cockpit.mjs

      - name: Upload Chromium visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-cockpit-v2-browser-evidence
          path: .build/genesis-browser-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Antmux home to laboratory to Genesis in real Chromium
        run: node laboratoire/browser-public-site.mjs

      - name: Upload public laboratory navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antmux-lab-browser-evidence
          path: .build/antmux-lab-browser-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Build deployable Genesis Vision Center bundle
        run: node laboratoire/genesis/build-public-bundle.mjs

      - name: Upload Genesis Vision Center bundle
        uses: actions/upload-artifact@v4
        with:
          name: genesis-vision-center-v2
          path: .build/genesis-vision-center-snapshot/
          if-no-files-found: error
          retention-days: 7

      - name: Build Antmux laboratory public overlay
        run: node laboratoire/build-public-overlay.mjs

      - name: Upload Antmux laboratory public overlay
        uses: actions/upload-artifact@v4
        with:
          name: antmux-laboratoire-public
          path: .build/antmux-laboratoire-public/
          if-no-files-found: error
          retention-days: 7
