name: Genesis DEMO validation

on:
  push:
    branches:
      - lab/public-research-v1
      - main
    paths:
      - 'index.html'
      - 'laboratoire/**'
      - '.github/workflows/genesis-demo-validation.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'laboratoire/**'
      - '.github/workflows/genesis-demo-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate canonical DEMO snapshot
        run: node laboratoire/genesis/validate-demo.mjs

      - name: Run adversarial validator tests
        run: node laboratoire/genesis/test-validator.mjs

      - name: Smoke-test static cockpit over HTTP
        run: node laboratoire/genesis/smoke-cockpit.mjs

      - name: Install isolated Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render and verify cockpit in real Chromium
        run: node laboratoire/genesis/browser-cockpit.mjs

      - name: Upload Chromium visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-cockpit-browser-evidence
          path: .build/genesis-browser-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Antmux home to laboratory to Genesis in real Chromium
        run: node laboratoire/browser-public-site.mjs

      - name: Upload public laboratory navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antmux-lab-browser-evidence
          path: .build/antmux-lab-browser-evidence/
          if-no-files-found: warn
          retention-days: 7

      - name: Build deployable public DEMO bundle
        run: node laboratoire/genesis/build-public-bundle.mjs

      - name: Upload Genesis Vision Center DEMO bundle
        uses: actions/upload-artifact@v4
        with:
          name: genesis-vision-center-demo
          path: .build/genesis-vision-center-demo/
          if-no-files-found: error
          retention-days: 7

      - name: Build Antmux laboratory public overlay
        run: node laboratoire/build-public-overlay.mjs

      - name: Upload Antmux laboratory public overlay
        uses: actions/upload-artifact@v4
        with:
          name: antmux-laboratoire-public
          path: .build/antmux-laboratoire-public/
          if-no-files-found: error
          retention-days: 7
