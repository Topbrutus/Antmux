name: Deploy Formules Nav Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-formules-nav-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antmux-formules-nav-hotfix
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure VPS SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Put Formules Zenodo in its own visible fixed slot
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE'
          set -euo pipefail
          ROOT='/var/www/antmux.com/public_html'
          HOME_INDEX="$ROOT/index.html"
          BACKUP="$HOME/antmux-formules-nav/backups/$(date -u +%Y%m%d-%H%M%S)"
          mkdir -p "$BACKUP"
          cp -a "$HOME_INDEX" "$BACKUP/index.html"

          rollback(){
            install -m 0644 "$BACKUP/index.html" "$HOME_INDEX" || true
          }
          trap 'rollback' ERR

          python3 - <<'PY'
          from pathlib import Path
          import re, base64

          p=Path('/var/www/antmux.com/public_html/index.html')
          text=p.read_text(encoding='utf-8')

          text=re.sub(
              r'<!-- ANTMUX-FORMULES-ENTRY-v0\.[0-9]+ -->.*?<!-- /ANTMUX-FORMULES-ENTRY-v0\.[0-9]+ -->',
              '', text, flags=re.S
          )

          nav_match=re.search(r'<nav id="antmux-quick-nav".*?</nav>', text, re.S)
          assert nav_match, 'antmux-quick-nav not found'
          nav=nav_match.group(0)
          nav=re.sub(
              r'\s*<a\b[^>]*data-antmux-secondary="formules-zenodo"[^>]*>.*?</a>\s*',
              '\n', nav, flags=re.S
          )
          primary=re.findall(r'<a\s+href="([^"]+)"[^>]*>([^<]+)</a>', nav)
          assert primary == [('/brutus/','BRUTUS'),('/laboratoire/','LABORATOIRE'),('/carrou/','IMAGE')], primary
          text=text[:nav_match.start()] + nav + text[nav_match.end():]

          block=base64.b64decode('').decode('utf-8')
          assert '</body>' in text
          text=text.replace('</body>', block+'\n</body>', 1)
          p.write_text(text, encoding='utf-8', newline='\n')
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('/var/www/antmux.com/public_html/index.html').read_text(encoding='utf-8')
          nav=re.search(r'<nav id="antmux-quick-nav".*?</nav>', text, re.S)
          assert nav
          pairs=re.findall(r'<a\s+href="([^"]+)"[^>]*>([^<]+)</a>', nav.group(0))
          assert pairs == [('/brutus/','BRUTUS'),('/laboratoire/','LABORATOIRE'),('/carrou/','IMAGE')], pairs
          assert 'data-antmux-secondary="formules-zenodo"' not in nav.group(0)
          assert text.count('ANTMUX-FORMULES-ENTRY-v0.2') == 2
          assert 'id="antmux-formules-zenodo-entry"' in text
          assert 'right:18px!important' in text
          assert 'z-index:2147483647!important' in text
          assert '∑ FORMULES · ZENODO' in text
          PY

          curl -fsS https://antmux.com/ -o /tmp/formules-nav-live.html
          grep -Fq 'ANTMUX-FORMULES-ENTRY-v0.2' /tmp/formules-nav-live.html
          grep -Fq 'id="antmux-formules-zenodo-entry"' /tmp/formules-nav-live.html
          grep -Fq 'right:18px!important' /tmp/formules-nav-live.html
          grep -Fq 'z-index:2147483647!important' /tmp/formules-nav-live.html
          grep -Fq '∑ FORMULES · ZENODO' /tmp/formules-nav-live.html
          trap - ERR
          echo 'FORMULES_NAV_HOTFIX_V2=PASS'
          REMOTE
