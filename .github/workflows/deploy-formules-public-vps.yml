name: Deploy Public Formulas Catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-formules-public-vps.yml'
      - 'site/formules/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antmux-formules-public
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REMOTE_STAGE: /tmp/antmux-formules-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout requested revision
        uses: actions/checkout@v4

      - name: Verify formulas and public proof artifacts
        run: |
          set -euo pipefail
          test -f site/formules/index.html
          grep -Fq 'data-antmux-formulas="v0.2"' site/formules/index.html
          grep -Fq 'Certificats & preuves' site/formules/index.html
          test -f site/formules/preuves/index.html
          test -f site/formules/preuves/PAPILLON_FS_V2_0_GROK_CERTIFICATE_2026-10-12.json
          test -f site/formules/preuves/PAPILLON_FS_V2_0_GROK_CERTIFICATE_2026-10-12.md
          test "$(sha256sum site/formules/preuves/PAPILLON_FS_V2_0_GROK_CERTIFICATE_2026-10-12.json | awk '{print $1}')" = 'acdc04e8263bf876b65e79eabd9ea63d34994497219b4e79cb73e2061428283c'
          test "$(sha256sum site/formules/preuves/PAPILLON_FS_V2_0_GROK_CERTIFICATE_2026-10-12.md | awk '{print $1}')" = 'bd44ce058ee173294df1202e7e069b2a913ab79be8726f5cb78242f07218ae2c'
          test "$(sha256sum site/formules/preuves/GSP_001_TO_GSP_012_RAPPORT_SYNOPTIQUE_AUDIT_2026-10-12.md | awk '{print $1}')" = '2132d759a6891f0f073df196eba6abd4b61765c76637005cf242afe009d67d8f'
          echo 'FORMULAS_PROOFS_SOURCE_VERIFY=PASS'

      - name: Configure VPS SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload formulas tree
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "rm -rf '$REMOTE_STAGE' && mkdir -p '$REMOTE_STAGE'"
          scp -r -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes site/formules/. "$VPS_USER@$VPS_HOST:$REMOTE_STAGE/"

      - name: Install with rollback backup
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE'
          set -euo pipefail
          ROOT='/var/www/antmux.com/public_html'
          FORM_DIR="$ROOT/formules"
          STAGE='${{ env.REMOTE_STAGE }}'
          BACKUP="$HOME/antmux-formules/backups/$(date -u +%Y%m%d-%H%M%S)-proofs"
          mkdir -p "$BACKUP"
          if [ -d "$FORM_DIR" ]; then cp -a "$FORM_DIR" "$BACKUP/formules-old"; fi
          rollback(){
            rm -rf "$FORM_DIR"
            if [ -d "$BACKUP/formules-old" ]; then cp -a "$BACKUP/formules-old" "$FORM_DIR"; fi
          }
          trap 'rollback' ERR
          rm -rf "$FORM_DIR"
          mkdir -p "$FORM_DIR"
          cp -a "$STAGE/." "$FORM_DIR/"
          grep -Fq 'Certificats & preuves' "$FORM_DIR/index.html"
          grep -Fq '221b097c890621aa9ed338f7101b342f02cc408dd7237169b466d6ae489467cd' "$FORM_DIR/preuves/index.html"
          trap - ERR
          rm -rf "$STAGE"
          echo 'FORMULAS_PROOFS_INSTALL=PASS'
          REMOTE

      - name: Verify public catalog and proofs externally
        run: |
          set -euo pipefail
          curl -fsSL https://antmux.com/formules/ -o /tmp/formules.html
          curl -fsSL https://antmux.com/formules/preuves/ -o /tmp/preuves.html
          curl -fsSL https://antmux.com/formules/preuves/PAPILLON_FS_V2_0_GROK_CERTIFICATE_2026-10-12.json -o /tmp/cert.json
          grep -Fq 'Certificats & preuves' /tmp/formules.html
          grep -Fq 'Certificate fingerprint SHA-256' /tmp/preuves.html
          test "$(sha256sum /tmp/cert.json | awk '{print $1}')" = 'acdc04e8263bf876b65e79eabd9ea63d34994497219b4e79cb73e2061428283c'
          echo 'FORMULAS_PROOFS_HTTPS_VERIFY=PASS'
