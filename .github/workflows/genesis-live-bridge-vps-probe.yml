name: Genesis LIVE bridge VPS capability probe

on:
  push:
    branches:
      - genesis/connect-public-read-only-endpoint
    paths:
      - '.github/workflows/genesis-live-bridge-vps-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_ROOT: /var/www/antmux.com/public_html/laboratoire/genesis
    steps:
      - name: Configure pinned Antmux VPS identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          test "$actual_public_key" = "$expected_public_key"
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Generate unique seedgenesis read-only deploy key
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE'
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/seedgenesis_only_readonly_ed25519"
          if test ! -f "$key"; then
            ssh-keygen -q -t ed25519 -N '' -C 'seedgenesis-only-antmux-vps-readonly' -f "$key"
          fi
          chmod 600 "$key"
          chmod 644 "$key.pub"
          printf 'SEEDGENESIS_UNIQUE_KEY_READY=yes\n'
          printf 'SEEDGENESIS_UNIQUE_PUBLIC_KEY=%s\n' "$(cat "$key.pub")"
          REMOTE
