name: Genesis LIVE bridge VPS capability probe

on:
  push:
    branches:
      - genesis/connect-public-read-only-endpoint
    paths:
      - '.github/workflows/genesis-live-bridge-vps-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_ROOT: /var/www/antmux.com/public_html/laboratoire/genesis
    steps:
      - name: Configure pinned Antmux VPS identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          test "$actual_public_key" = "$expected_public_key"
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Probe capabilities and provision dedicated read-only deploy key
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "TARGET_ROOT='$TARGET_ROOT' bash -se" <<'REMOTE'
          set -eu
          yn() { if "$@" >/dev/null 2>&1; then printf 'yes'; else printf 'no'; fi; }
          printf 'VPS_USER_MATCH=%s\n' "$(yn test "$(id -un)" = 'rob')"
          printf 'TARGET_EXISTS=%s\n' "$(yn test -d "$TARGET_ROOT")"
          printf 'TARGET_WRITE=%s\n' "$(yn test -w "$TARGET_ROOT")"
          printf 'GIT_AVAILABLE=%s\n' "$(yn command -v git)"
          printf 'NODE_AVAILABLE=%s\n' "$(yn command -v node)"
          printf 'PYTHON3_AVAILABLE=%s\n' "$(yn command -v python3)"
          printf 'CURL_AVAILABLE=%s\n' "$(yn command -v curl)"
          printf 'CRONTAB_AVAILABLE=%s\n' "$(yn command -v crontab)"

          install -d -m 700 "$HOME/.ssh"
          key="$HOME/.ssh/seedgenesis_readonly_ed25519"
          if test ! -f "$key"; then
            ssh-keygen -q -t ed25519 -N '' -C 'antmux-genesis-readonly-vps' -f "$key"
          fi
          chmod 600 "$key"
          chmod 644 "$key.pub"
          printf 'SEEDGENESIS_DEPLOY_KEY_READY=yes\n'
          printf 'SEEDGENESIS_DEPLOY_KEY_PUBLIC=%s\n' "$(cat "$key.pub")"

          if command -v git >/dev/null 2>&1; then
            if GIT_TERMINAL_PROMPT=0 git ls-remote https://github.com/Topbrutus/seedgenesis.git HEAD >/dev/null 2>&1; then
              printf 'PRIVATE_REPO_HTTPS_READ=yes\n'
            else
              printf 'PRIVATE_REPO_HTTPS_READ=no\n'
            fi
          fi
          REMOTE
