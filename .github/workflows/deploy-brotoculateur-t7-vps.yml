name: Deploy Brotoculateur T7 Calculation Telemetry VPS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit, start T7 calculation telemetry shadow, or disable T7
        required: true
        default: audit
        type: choice
        options: [audit, canary_start, disable]
      confirm:
        description: Type BRUTUS-T7-VPS for canary_start or disable
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: brotoculateur-t7-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate request and T7 tools
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$MODE" in audit|canary_start|disable) ;; *) exit 2 ;; esac
          if [ "$MODE" != audit ]; then test "$CONFIRM" = 'BRUTUS-T7-VPS'; fi
          python3 -m py_compile \
            deploy/vps-t7/t7_calculation.py \
            deploy/vps-t7/patch_brotoculateur_t7_calculation.py \
            deploy/vps-t7/test_t7_calculation.py

      - name: Configure pinned VPS SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage T7 tools
        if: inputs.mode == 'canary_start'
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy/vps-t7/t7_calculation.py \
            deploy/vps-t7/patch_brotoculateur_t7_calculation.py \
            deploy/vps-t7/test_t7_calculation.py \
            "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Audit or deploy T7
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "MODE='$MODE' bash -se" <<'REMOTE'
          set -euo pipefail
          BROTO_ROOT="$HOME/brotoculateur"
          PKG="$BROTO_ROOT/src/brotoculateur"
          PAP="$PKG/papillon_engine.py"
          T6MOD="$PKG/t6_papillon.py"
          T7MOD="$PKG/t7_calculation.py"
          ORCH="$PKG/orchestrator.py"
          DASH="$PKG/dashboard.py"
          STATUS_URL='http://127.0.0.1:8781/api/status'

          PRE_PAP='c66cd7530d06e88c08857b9a1b3a42748296a06f542d7a0bbee0ad7ce0ccc101'
          PRE_T6='6c58c96cd46de6f10851e443b5882ffdd2c505c82f907b325cae250e1ffd0792'
          PRE_ORCH='de777c45a46b06476a44affbacf3fc9237dec0be380dd9cd767e979fa437bd56'
          PRE_DASH='52ca5d46a25c3e444eca03b38f0c9647c113741c4eafcc1f027559c370533dbd'
          POST_PAP='87045c18db95871f4cc9521bdfae1c7c4175dcf0a09ef33a8f7e35c5879fa50a'
          POST_T6="$PRE_T6"
          POST_T7='5d6ce094a5b9238994182d56b1740555633f4c49983a40e4abceb0a7495303fd'
          POST_ORCH='cf4978cb315f817abf2283f41630c322a80ccbb94c75662eac8b4a87c7a05d63'
          POST_DASH='e9bf39bfd632a2945bd976373a3e749d28140ca26160c7faeb07297cbf5af690'

          test -f "$PAP" -a -f "$T6MOD" -a -f "$ORCH" -a -f "$DASH"
          systemctl --user is-active --quiet brotoculateur.service
          curl -fsS --max-time 5 "$STATUS_URL" >/tmp/t7-before.json

          pap_hash=$(sha256sum "$PAP"|awk '{print $1}')
          t6_hash=$(sha256sum "$T6MOD"|awk '{print $1}')
          orch_hash=$(sha256sum "$ORCH"|awk '{print $1}')
          dash_hash=$(sha256sum "$DASH"|awk '{print $1}')
          if [ -f "$T7MOD" ]; then t7_hash=$(sha256sum "$T7MOD"|awk '{print $1}'); else t7_hash='ABSENT'; fi
          source_state='UNKNOWN'
          if [ "$pap_hash" = "$PRE_PAP" ] && [ "$t6_hash" = "$PRE_T6" ] && [ "$orch_hash" = "$PRE_ORCH" ] && [ "$dash_hash" = "$PRE_DASH" ] && [ "$t7_hash" = 'ABSENT' ]; then source_state='PRE_T7'; fi
          if [ "$pap_hash" = "$POST_PAP" ] && [ "$t6_hash" = "$POST_T6" ] && [ "$orch_hash" = "$POST_ORCH" ] && [ "$dash_hash" = "$POST_DASH" ] && [ "$t7_hash" = "$POST_T7" ]; then source_state='POST_T7'; fi
          test "$source_state" != 'UNKNOWN'
          echo "T7_SOURCE_STATE=$source_state"

          SOURCE_STATE="$source_state" python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/t7-before.json',encoding='utf-8'))
          pap=d.get('papillon') or {}; t6=d.get('t6_papillon') or {}; t7=d.get('t7_calculation') or {}
          print('STATE='+str(d.get('state')))
          print('PROCESSED='+str(d.get('processed_packets')))
          print('CRYSTALS='+str((d.get('brutomagique') or {}).get('total_crystals')))
          print('T6_OBSERVATIONS='+str(t6.get('observations')))
          print('PAPILLON_SHARDS='+str(pap.get('shards')))
          print('T7_MODE='+str(t7.get('mode')))
          print('T7_ENABLED='+str(t7.get('enabled')))
          print('T7_PACKETS='+str(t7.get('packet_observations')))
          print('T7_LOGICAL='+str(t7.get('logical_formula_attempts')))
          print('T7_PHYSICAL='+str(t7.get('physical_formula_calls')))
          print('T7_MEMO_HITS='+str(t7.get('memo_hits_observed')))
          assert not d.get('worker_error'), d.get('worker_error')
          assert int(pap.get('shards') or 0)==144
          assert t6.get('enabled') is True
          if os.environ['SOURCE_STATE']=='POST_T7' and t7.get('enabled') is True:
              n=int(t7.get('packet_observations') or 0)
              assert n==int(d.get('processed_packets') or 0)
              logical=int(t7.get('logical_formula_attempts') or 0)
              assert logical==n*len(d.get('formula_ids') or [])
              assert logical==int(t7.get('native_attempts') or 0)+int(t7.get('papillon_evaluations') or 0)
              assert int(t7.get('accounting_conflicts') or 0)==0
              assert int(t7.get('negative_delta_conflicts') or 0)==0
              assert t7.get('authority')=='SHADOW_ONLY'
              assert t7.get('controls_formula_selection') is False
              assert t7.get('controls_papillon') is False
              assert int(t7.get('compute_skips') or 0)==0
              assert t7.get('proof_promotion') is False
          print('T7_AUDIT_ONLY=PASS')
          PY
          df -P / | awk 'NR==2 {print "ROOT_DISK_USED=" $5 " ROOT_DISK_FREE_KB=" $4}'

          if [ "$MODE" = audit ]; then exit 0; fi

          if [ "$MODE" = canary_start ]; then
            test "$source_state" = 'PRE_T7'
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t7-before.json',encoding='utf-8'))
          z=d.get('brutus_cortex') or {}; t6=d.get('t6_papillon') or {}; pap=d.get('papillon') or {}
          assert d.get('state') in {'RUNNING','PAUSED'} and not d.get('worker_error')
          assert z.get('enabled') is True and int(z.get('rollout_percent') or 0)==10
          assert t6.get('enabled') is True and int(pap.get('shards') or 0)==144
          print('T7_REQUIRES_T6_PLUS_PAPILLON144=PASS')
          PY
            STAGE="/tmp/brotoculateur-t7-stage-$$"
            rm -rf "$STAGE"; mkdir -p "$STAGE/src"
            cp -a "$PKG" "$STAGE/src/brotoculateur"
            python3 /tmp/patch_brotoculateur_t7_calculation.py "$STAGE"
            test "$(sha256sum "$STAGE/src/brotoculateur/papillon_engine.py"|awk '{print $1}')" = "$POST_PAP"
            test "$(sha256sum "$STAGE/src/brotoculateur/t6_papillon.py"|awk '{print $1}')" = "$POST_T6"
            test "$(sha256sum "$STAGE/src/brotoculateur/t7_calculation.py"|awk '{print $1}')" = "$POST_T7"
            test "$(sha256sum "$STAGE/src/brotoculateur/orchestrator.py"|awk '{print $1}')" = "$POST_ORCH"
            test "$(sha256sum "$STAGE/src/brotoculateur/dashboard.py"|awk '{print $1}')" = "$POST_DASH"
            PYTHONPATH="$STAGE/src" python3 /tmp/test_t7_calculation.py
            echo 'T7_EXACT_LIVE_STAGE=PASS'
          else
            test "$source_state" = 'POST_T7'
          fi

          WAS_RUNNING=$(python3 - <<'PY'
          import json
          print('1' if json.load(open('/tmp/t7-before.json',encoding='utf-8')).get('state')=='RUNNING' else '0')
          PY
          )
          if [ "$WAS_RUNNING" = 1 ]; then
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/save >/tmp/t7-save.json
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/pause >/tmp/t7-pause.json
          fi
          curl -fsS --max-time 5 "$STATUS_URL" >/tmp/t7-paused.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/t7-paused.json',encoding='utf-8')).get('state')=='PAUSED'
          print('T7_PAUSE_VERIFY=PASS')
          PY

          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP="$BROTO_ROOT/backups/t7-$STAMP"
          mkdir -p "$BACKUP"
          cp -a "$PAP" "$T6MOD" "$ORCH" "$DASH" "$BACKUP/"
          [ ! -f "$T7MOD" ] || cp -a "$T7MOD" "$BACKUP/"
          cp -a /tmp/t7-before.json "$BACKUP/status-before.json"
          DROPIN_DIR="$HOME/.config/systemd/user/brotoculateur.service.d"
          DROPIN="$DROPIN_DIR/97-brutus-t7.conf"
          mkdir -p "$DROPIN_DIR"
          HAD_DROPIN=0; [ ! -f "$DROPIN" ] || { HAD_DROPIN=1; cp -a "$DROPIN" "$BACKUP/97-brutus-t7.conf"; }
          HAD_T7=0; [ ! -f "$T7MOD" ] || HAD_T7=1
          echo "T7_BACKUP=$BACKUP"

          rollback() {
            rc=$?; set +e; echo "T7_ROLLBACK_BEGIN rc=$rc"
            cp -a "$BACKUP/papillon_engine.py" "$PAP"
            cp -a "$BACKUP/t6_papillon.py" "$T6MOD"
            cp -a "$BACKUP/orchestrator.py" "$ORCH"
            cp -a "$BACKUP/dashboard.py" "$DASH"
            if [ "$HAD_T7" = 1 ]; then cp -a "$BACKUP/t7_calculation.py" "$T7MOD"; else rm -f "$T7MOD"; fi
            if [ "$HAD_DROPIN" = 1 ]; then cp -a "$BACKUP/97-brutus-t7.conf" "$DROPIN"; else rm -f "$DROPIN"; fi
            systemctl --user daemon-reload
            systemctl --user restart brotoculateur.service
            sleep 2
            if [ "$WAS_RUNNING" = 1 ]; then curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/start >/tmp/t7-rollback-start.json || true; fi
            echo 'T7_ROLLBACK_DONE'; exit "$rc"
          }
          trap rollback ERR

          if [ "$MODE" = canary_start ]; then
            cp -a "$STAGE/src/brotoculateur/papillon_engine.py" "$PAP"
            cp -a "$STAGE/src/brotoculateur/t6_papillon.py" "$T6MOD"
            cp -a "$STAGE/src/brotoculateur/t7_calculation.py" "$T7MOD"
            cp -a "$STAGE/src/brotoculateur/orchestrator.py" "$ORCH"
            cp -a "$STAGE/src/brotoculateur/dashboard.py" "$DASH"
            cat > "$DROPIN" <<'EOF'
          [Service]
          Environment="BROTO_T7_ENABLED=1"
          EOF
          else
            cat > "$DROPIN" <<'EOF'
          [Service]
          Environment="BROTO_T7_ENABLED=0"
          EOF
          fi

          systemctl --user daemon-reload
          systemctl --user restart brotoculateur.service
          ok=0
          for _ in $(seq 1 20); do
            if systemctl --user is-active --quiet brotoculateur.service && curl -fsS --max-time 2 "$STATUS_URL" >/tmp/t7-after.json; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

          MODE="$MODE" python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/t7-after.json',encoding='utf-8'))
          t6=d.get('t6_papillon') or {}; t7=d.get('t7_calculation') or {}; pap=d.get('papillon') or {}
          assert not d.get('worker_error'), d.get('worker_error')
          assert t6.get('enabled') is True and int(pap.get('shards') or 0)==144
          if os.environ['MODE']=='canary_start':
              assert t7.get('mode')=='BRUTUS_T7_CALCULATION_TELEMETRY_V1' and t7.get('enabled') is True
              assert t7.get('authority')=='SHADOW_ONLY'
              assert t7.get('controls_formula_selection') is False and t7.get('controls_papillon') is False
          else:
              assert t7.get('enabled') is False
          print('T7_DEPLOY_VERIFY=PASS')
          PY

          if [ "$MODE" = canary_start ] || [ "$WAS_RUNNING" = 1 ]; then
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/start >/tmp/t7-start.json
            live=0
            for _ in $(seq 1 30); do
              curl -fsS --max-time 2 "$STATUS_URL" >/tmp/t7-live.json || true
              if MODE="$MODE" python3 - <<'PY'
          import json,os,sys
          try: d=json.load(open('/tmp/t7-live.json',encoding='utf-8'))
          except Exception: sys.exit(1)
          t7=d.get('t7_calculation') or {}
          good=d.get('state')=='RUNNING' and not d.get('worker_error')
          if os.environ.get('MODE')=='canary_start':
              n=int(t7.get('packet_observations') or 0)
              logical=int(t7.get('logical_formula_attempts') or 0)
              good=good and n>0 and n==int(d.get('processed_packets') or 0)
              good=good and logical==n*len(d.get('formula_ids') or [])
              good=good and logical==int(t7.get('native_attempts') or 0)+int(t7.get('papillon_evaluations') or 0)
              good=good and int(t7.get('accounting_conflicts') or 0)==0 and int(t7.get('negative_delta_conflicts') or 0)==0
          sys.exit(0 if good else 1)
          PY
              then live=1; break; fi
              sleep 1
            done
            test "$live" = 1
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t7-live.json',encoding='utf-8'))
          t7=d.get('t7_calculation') or {}; pap=d.get('papillon') or {}
          print('T7_LIVE_STATE='+str(d.get('state')))
          print('T7_LIVE_PROCESSED='+str(d.get('processed_packets')))
          print('T7_LIVE_CRYSTALS='+str((d.get('brutomagique') or {}).get('total_crystals')))
          print('T7_LIVE_PACKETS='+str(t7.get('packet_observations')))
          print('T7_LIVE_LOGICAL='+str(t7.get('logical_formula_attempts')))
          print('T7_LIVE_PHYSICAL='+str(t7.get('physical_formula_calls')))
          print('T7_LIVE_PREDICATES='+str(t7.get('physical_predicate_calls')))
          print('T7_LIVE_MEMO_HITS='+str(t7.get('memo_hits_observed')))
          print('T7_LIVE_RATIO='+str(t7.get('logical_to_physical_formula_ratio')))
          print('T7_LIVE_PAPILLON_EVALUATIONS='+str(pap.get('evaluations')))
          print('T7_LIVE_VERIFY=PASS')
          PY
          fi

          if [ "$MODE" = canary_start ]; then
            test "$(sha256sum "$PAP"|awk '{print $1}')" = "$POST_PAP"
            test "$(sha256sum "$T6MOD"|awk '{print $1}')" = "$POST_T6"
            test "$(sha256sum "$T7MOD"|awk '{print $1}')" = "$POST_T7"
            test "$(sha256sum "$ORCH"|awk '{print $1}')" = "$POST_ORCH"
            test "$(sha256sum "$DASH"|awk '{print $1}')" = "$POST_DASH"
          fi
          df -P / | awk 'NR==2 {print "T7_ROOT_DISK_USED=" $5 " T7_ROOT_DISK_FREE_KB=" $4}'
          trap - ERR
          rm -rf "${STAGE:-}"
          echo 'T7_WORKFLOW=PASS'
          REMOTE
