name: Deploy disabled /carrou/ landing page

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CARROU-LANDING'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: disable-carrou-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'CARROU-LANDING'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate disabled landing source
        run: |
          set -euo pipefail
          test -f carrou/index.html
          test -f carrou/brutus-papillon-144.jpg
          grep -Fq "brutus-papillon-144.jpg" carrou/index.html
          grep -Fq '← Retour' carrou/index.html
          grep -Fq 'Carrou · en pause' carrou/index.html
          ! grep -Fq 'src="./app.js"' carrou/index.html
          ! grep -Fq 'type="module"' carrou/index.html
          ! grep -Fq '../carrou/' generator/index.html

      - name: Configure pinned VPS SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage landing page
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            carrou/index.html carrou/brutus-papillon-144.jpg \
            "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Install disabled landing with rollback backup
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(hostname)" = 'server1.antmux.com'
          ROOT='/var/www/antmux.com/public_html'
          CAR="$ROOT/carrou"
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP="$HOME/static-backups/carrou-landing-$STAMP"
          mkdir -p "$BACKUP"

          if [ -e "$CAR" ] || [ -L "$CAR" ]; then
            chmod u+rwx "$CAR" 2>/dev/null || true
            cp -a "$CAR" "$BACKUP/carrou-before" 2>/dev/null || true
            rm -rf "$CAR"
          fi

          mkdir -p "$CAR"
          install -m 0644 /tmp/index.html "$CAR/index.html"
          install -m 0644 /tmp/brutus-papillon-144.jpg "$CAR/brutus-papillon-144.jpg"
          chmod 0755 "$CAR"
          rm -f /tmp/index.html /tmp/brutus-papillon-144.jpg

          echo "BACKUP=$BACKUP"
          sha256sum "$CAR/index.html" "$CAR/brutus-papillon-144.jpg" | tee "$BACKUP/deployed.sha256"
          echo 'CARROU_DISABLED_LANDING_INSTALL=PASS'
          REMOTE

      - name: Verify public disabled landing
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            code=$(curl -sS -o /tmp/carrou.html -w '%{http_code}' --max-time 8 https://antmux.com/carrou/ || true)
            echo "CARROU_HTTP=$code"
            if [ "$code" = '200' ] \
              && grep -Fq 'brutus-papillon-144.jpg' /tmp/carrou.html \
              && grep -Fq '← Retour' /tmp/carrou.html \
              && grep -Fq 'Carrou · en pause' /tmp/carrou.html \
              && ! grep -Fq 'src="./app.js"' /tmp/carrou.html; then
              image_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 https://antmux.com/carrou/brutus-papillon-144.jpg || true)
              echo "CARROU_BG_HTTP=$image_code"
              test "$image_code" = '200'
              curl -fsSL --max-time 8 https://antmux.com/ -o /tmp/antmux-home.html
              ! grep -Fq 'href="/carrou/"' /tmp/antmux-home.html
              echo 'CARROU_DISABLED_LANDING=PASS'
              exit 0
            fi
            sleep 2
          done
          echo 'CARROU_DISABLED_LANDING=FAIL' >&2
          exit 1
