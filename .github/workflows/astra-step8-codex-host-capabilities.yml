name: ASTRA STEP8 Codex Host Capabilities

on:
  push:
    branches:
      - astra/gamezel-control-20261003
    paths:
      - '.github/workflows/astra-step8-codex-host-capabilities.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          test "$actual_public_key" = "$expected_public_key"
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read host isolation capabilities
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "MAIN_USER_SERVICE=$(systemctl --user is-active zelstereos-gamezel.service 2>/dev/null || true)"
          echo "KERNEL=$(uname -r)"
          if test -r /proc/sys/kernel/unprivileged_userns_clone; then echo "UNPRIVILEGED_USERNS=$(cat /proc/sys/kernel/unprivileged_userns_clone)"; else echo 'UNPRIVILEGED_USERNS=UNKNOWN'; fi
          if test -r /proc/sys/user/max_user_namespaces; then echo "MAX_USER_NAMESPACES=$(cat /proc/sys/user/max_user_namespaces)"; else echo 'MAX_USER_NAMESPACES=UNKNOWN'; fi
          if test -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then echo "APPARMOR_RESTRICT_USERNS=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"; else echo 'APPARMOR_RESTRICT_USERNS=UNKNOWN'; fi
          if test -r /sys/module/apparmor/parameters/enabled; then echo "APPARMOR_ENABLED=$(cat /sys/module/apparmor/parameters/enabled)"; else echo 'APPARMOR_ENABLED=UNKNOWN'; fi
          for bin in systemd-run unshare bwrap podman docker firejail aa-status aa-exec; do
            key="$(printf '%s' "$bin" | tr '[:lower:]-' '[:upper:]_')"
            if command -v "$bin" >/dev/null 2>&1; then echo "${key}=YES"; else echo "${key}=NO"; fi
          done
          systemd-run --version 2>/dev/null | head -n 1 || true
          echo "MAIN_USER_SERVICE_AFTER=$(systemctl --user is-active zelstereos-gamezel.service 2>/dev/null || true)"
          REMOTE
