name: ASTRA GAMEZEL VPS Autoplayer Inspect
on:
  push:
    branches: [astra/gamezel-control-20261003]
    paths: ['.github/workflows/astra-gamezel-vps-autoplayer-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '${{ secrets.ANTMUX_VPS_HOST }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect P4 runner wiring
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/zelstereos-gamezel"
          echo '=== P4 CODE ==='
          grep -nE 'runAntigravity|ANTIGRAVITY_BIN|antigravity-card-agent|GEMINI_API_KEY|buildAntigravityArgs' "$ROOT/agents/gamezel-autoplayer.mjs" || true
          echo '=== P4 ENV SAFE ==='
          sed -E 's#(TOKEN|SECRET|KEY|PASSWORD|CREDENTIAL)[^=]*=.*#\1=REDACTED#Ig' "$HOME/.config/zelstereos/agents/p4.env" 2>/dev/null | grep -E 'GAMEZEL_|ANTIGRAVITY_|PATH|HOME' || true
          echo '=== RUNNER HASH ==='
          sha256sum "$ROOT/agents/gamezel-autoplayer.mjs" || true
          REMOTE
