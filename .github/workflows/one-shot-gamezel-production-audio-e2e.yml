name: One-shot GAMEZEL production audio E2E

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-gamezel-production-audio-e2e.yml'

permissions:
  contents: read

jobs:
  production-audio-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          test "$actual_public_key" = "$expected_public_key"
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Start a real TABLE_4 round on production VPS
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/zelstereos-gamezel"
          SERVICE='zelstereos-gamezel.service'
          systemctl --user is-active --quiet "$SERVICE"

          for seat in 1 2 3 4; do
            cmd="$ROOT/bin/gamezel-p${seat}"
            test -x "$cmd"
            "$cmd" join --json > "/tmp/gamezel-p${seat}-join.json"
            node - "$seat" "/tmp/gamezel-p${seat}-join.json" <<'NODE'
          const fs=require('fs');
          const seat=String(process.argv[2]);
          const d=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          if (d.ok !== true || d.PLAYER_ID !== `P${seat}`) process.exit(1);
          console.log(`P${seat}_JOIN=PASS`);
          NODE
          done

          START="$ROOT/bin/gamezel-start-round"
          test -x "$START"
          "$START" > /tmp/gamezel-start-round.out
          echo 'ROUND_START_COMMAND=PASS'

          systemctl --user is-active --quiet "$SERVICE"
          echo 'PRODUCTION_GAMEZEL_SERVICE_ACTIVE=PASS'
          sleep 6
          REMOTE
