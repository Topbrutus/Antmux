name: One-shot GAMEZEL production audio E2E

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-gamezel-production-audio-e2e.yml'

permissions:
  contents: read

jobs:
  production-audio-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          test "$actual_public_key" = "$expected_public_key"
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Exercise real P1 production gateway
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE'
          set -euo pipefail
          SERVICE='zelstereos-gamezel.service'
          P1="$HOME/zelstereos-gamezel/bin/gamezel-p1"
          systemctl --user is-active --quiet "$SERVICE"
          test -x "$P1"

          "$P1" join --json > /tmp/gamezel-p1-join.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/gamezel-p1-join.json','utf8'));
          if (d.ok !== true || d.PLAYER_ID !== 'P1') process.exit(1);
          console.log('P1_JOIN_GATEWAY=PASS');
          console.log('JOIN_ACTION='+(d.action||''));
          console.log('JOIN_PLAYER='+(d.PLAYER_NAME||''));
          NODE

          "$P1" heartbeat --json > /tmp/gamezel-p1-heartbeat.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/gamezel-p1-heartbeat.json','utf8'));
          if (d.ok !== true || d.PLAYER_ID !== 'P1') process.exit(1);
          console.log('P1_HEARTBEAT_GATEWAY=PASS');
          console.log('HEARTBEAT_ACTION='+(d.action||''));
          NODE

          systemctl --user is-active --quiet "$SERVICE"
          echo 'PRODUCTION_GAMEZEL_SERVICE_ACTIVE=PASS'
          sleep 5
          REMOTE
