name: ASTRA GAMEZEL Server Migration Prep

on:
  push:
    branches:
      - astra/gamezel-control-20261003
    paths:
      - '.github/workflows/astra-gamezel-server-migration.yml'

permissions:
  contents: read

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare encrypted JEV handoff and audit VPS
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/zelstereos-gamezel"
          CFG="$HOME/.config/gamezel"
          install -d -m 700 "$CFG"
          python3 - <<'PY'
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          import base64
          cfg=Path.home()/'.config/gamezel'
          privp=cfg/'jev_x25519_private.pem'
          if not privp.exists():
              priv=X25519PrivateKey.generate()
              privp.write_bytes(priv.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()))
              privp.chmod(0o600)
          else:
              priv=serialization.load_pem_private_key(privp.read_bytes(),password=None)
          pub=priv.public_key().public_bytes(serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          print('JEV_X25519_PUBLIC_B64='+base64.b64encode(pub).decode())
          PY
          echo "ROOT_EXISTS=$(test -d "$ROOT" && echo YES || echo NO)"
          if test -d "$ROOT/.git"; then
            echo "ROOT_HEAD=$(git -C "$ROOT" rev-parse HEAD 2>/dev/null || true)"
            echo "ROOT_BRANCH=$(git -C "$ROOT" branch --show-current 2>/dev/null || true)"
            echo "ROOT_DIRTY=$(test -n "$(git -C "$ROOT" status --porcelain 2>/dev/null)" && echo YES || echo NO)"
          fi
          for svc in zelstereos-gamezel.service zelstereos-gamezel-p2.service zelstereos-gamezel-p3.service zelstereos-gamezel-p4.service; do
            echo "$svc=$(systemctl --user is-active "$svc" 2>/dev/null || true)"
          done
          for bin in muse grok agy; do
            p="$(command -v "$bin" 2>/dev/null || true)"
            echo "BIN_${bin^^}=${p:-MISSING}"
            if test -n "$p"; then "$p" --version 2>/dev/null | head -n 1 | sed "s/^/${bin^^}_VERSION=/" || true; fi
          done
          echo "ANTIGRAVITY_PYTHON=$(test -x "$HOME/.local/share/gamezel-antigravity-sdk/venv/bin/python" && echo YES || echo NO)"
          echo "LIVE_DIR=$(test -d /var/www/antmux.com/public_html/laboratoire/zelstereos/live && echo YES || echo NO)"
          echo "AUDIO_JSON=$(test -f /var/www/antmux.com/public_html/laboratoire/zelstereos/live/audio.json && echo YES || echo NO)"
          echo "SPEECH_JSON=$(test -f /var/www/antmux.com/public_html/laboratoire/zelstereos/live/speech.json && echo YES || echo NO)"
          curl -fsS --max-time 3 http://127.0.0.1:3217/api/jev/status 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print("JEV_CONFIGURED="+str(bool(d.get("configured"))).upper()); print("JEV_MODEL="+str(d.get("model")))' || echo 'JEV_LOCAL=UNAVAILABLE'
          if test -x "$ROOT/bin/gamezel-ai-status"; then "$ROOT/bin/gamezel-ai-status" 2>&1 | sed -E 's#(token|secret|key|password)=.*#\1=REDACTED#Ig' | head -n 60; fi
          REMOTE
