name: Deploy Genesis to VPS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-GENESIS to allow the manual VPS deployment'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: genesis-vps-deploy
  cancel-in-progress: false

jobs:
  deploy-genesis:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY-GENESIS'
    runs-on: ubuntu-latest

    env:
      TARGET_ROOT: /var/www/antmux.com/public_html/laboratoire/genesis
      REMOTE_STAGE: /tmp/antmux-genesis-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Validate Genesis public v1 and v2
        run: |
          node laboratoire/genesis/validate-demo.mjs
          node laboratoire/genesis/test-validator.mjs
          node laboratoire/genesis/validate-public-v2.mjs
          node laboratoire/genesis/test-public-v2.mjs
          node laboratoire/genesis/smoke-cockpit.mjs

      - name: Assemble exact Genesis public payload
        run: |
          set -euo pipefail
          rm -rf _genesis_deploy
          mkdir -p _genesis_deploy/demo

          cp laboratoire/genesis/index.html _genesis_deploy/
          cp laboratoire/genesis/README.md _genesis_deploy/
          cp laboratoire/genesis/PUBLIC-CONTRACT-v1.md _genesis_deploy/
          cp laboratoire/genesis/PUBLIC-CONTRACT-v2.md _genesis_deploy/
          cp laboratoire/genesis/demo/genesis-demo-v1.json _genesis_deploy/demo/
          cp laboratoire/genesis/demo/genesis-demo-v2.json _genesis_deploy/demo/

          test -f _genesis_deploy/index.html
          test -f _genesis_deploy/README.md
          test -f _genesis_deploy/PUBLIC-CONTRACT-v1.md
          test -f _genesis_deploy/PUBLIC-CONTRACT-v2.md
          test -f _genesis_deploy/demo/genesis-demo-v1.json
          test -f _genesis_deploy/demo/genesis-demo-v2.json

          test ! -e _genesis_deploy/validate-demo.mjs
          test ! -e _genesis_deploy/validate-public-v2.mjs
          test ! -e _genesis_deploy/test-validator.mjs
          test ! -e _genesis_deploy/test-public-v2.mjs
          test ! -e _genesis_deploy/browser-cockpit.mjs

          (
            cd _genesis_deploy
            sha256sum index.html README.md PUBLIC-CONTRACT-v1.md PUBLIC-CONTRACT-v2.md demo/genesis-demo-v1.json demo/genesis-demo-v2.json > SHA256SUMS
          )

      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          if [ "$actual_public_key" != "$expected_public_key" ]; then
            echo 'ANTMUX_VPS_SSH_PRIVATE_KEY does not match github-actions-antmux-2026.' >&2
            exit 1
          fi

          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Preflight VPS ownership and write access
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"

          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" \
            "set -e; test -d '$TARGET_ROOT'; test -w '$TARGET_ROOT'; test \"\$(id -un)\" = '$VPS_USER'"

      - name: Upload staged Genesis payload
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" \
            "rm -rf '$REMOTE_STAGE' && mkdir -p '$REMOTE_STAGE'"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -r _genesis_deploy/. \
            "$VPS_USER@$VPS_HOST:$REMOTE_STAGE/"

      - name: Backup current Genesis and deploy exact files
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE'
          set -euo pipefail

          TARGET_ROOT='/var/www/antmux.com/public_html/laboratoire/genesis'
          REMOTE_STAGE='${{ env.REMOTE_STAGE }}'
          BACKUP_ROOT="$HOME/antmux-genesis-deploy-backups/$(date -u +%Y%m%d-%H%M%S)-${{ github.sha }}"

          cd "$REMOTE_STAGE"
          sha256sum -c SHA256SUMS

          mkdir -p "$BACKUP_ROOT/demo"
          for file in index.html README.md PUBLIC-CONTRACT-v1.md PUBLIC-CONTRACT-v2.md; do
            if test -f "$TARGET_ROOT/$file"; then
              cp -a "$TARGET_ROOT/$file" "$BACKUP_ROOT/$file"
            fi
          done
          for file in genesis-demo-v1.json genesis-demo-v2.json; do
            if test -f "$TARGET_ROOT/demo/$file"; then
              cp -a "$TARGET_ROOT/demo/$file" "$BACKUP_ROOT/demo/$file"
            fi
          done

          install -d -m 0755 "$TARGET_ROOT/demo"
          install -m 0644 "$REMOTE_STAGE/index.html" "$TARGET_ROOT/index.html"
          install -m 0644 "$REMOTE_STAGE/README.md" "$TARGET_ROOT/README.md"
          install -m 0644 "$REMOTE_STAGE/PUBLIC-CONTRACT-v1.md" "$TARGET_ROOT/PUBLIC-CONTRACT-v1.md"
          install -m 0644 "$REMOTE_STAGE/PUBLIC-CONTRACT-v2.md" "$TARGET_ROOT/PUBLIC-CONTRACT-v2.md"
          install -m 0644 "$REMOTE_STAGE/demo/genesis-demo-v1.json" "$TARGET_ROOT/demo/genesis-demo-v1.json"
          install -m 0644 "$REMOTE_STAGE/demo/genesis-demo-v2.json" "$TARGET_ROOT/demo/genesis-demo-v2.json"

          cd "$TARGET_ROOT"
          sha256sum -c "$REMOTE_STAGE/SHA256SUMS"

          rm -rf "$REMOTE_STAGE"
          printf 'BACKUP_ROOT=%s\n' "$BACKUP_ROOT"
          REMOTE

      - name: Verify public Genesis endpoints
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/genesis/ >/dev/null
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/genesis/demo/genesis-demo-v2.json >/dev/null
