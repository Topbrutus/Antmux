name: Deploy ZELSTEREOS to VPS

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-zelstereos-vps.yml'
      - 'laboratoire/zelstereos/index.html'
      - 'laboratoire/zelstereos/api/state'
      - 'laboratoire/zelstereos/assets/sfx/**'
      - 'laboratoire/zelstereos/assets/voices/**'
      - 'laboratoire/index.html'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-ZELSTEREOS to allow the manual VPS deployment'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: zelstereos-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY-ZELSTEREOS'))
    runs-on: ubuntu-latest
    env:
      LAB_ROOT: /var/www/antmux.com/public_html/laboratoire
      TARGET_ROOT: /var/www/antmux.com/public_html/laboratoire/zelstereos
      REMOTE_STAGE: /tmp/antmux-zelstereos-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Validate public payload
        run: |
          set -euo pipefail
          test -f laboratoire/zelstereos/index.html
          test -f laboratoire/zelstereos/api/state
          test -f laboratoire/zelstereos/assets/sfx/manifest.json
          test -f laboratoire/index.html
          test "$(find laboratoire/zelstereos/assets/sfx -maxdepth 1 -type f -name 'SFX*.mp3' | wc -l)" -eq 36
          test -f laboratoire/zelstereos/assets/sfx/VOICE_P1_ASTRA_PLAY.mp3
          test -f laboratoire/zelstereos/assets/sfx/VOICE_P2_MUSE_PLAY.mp3
          test -f laboratoire/zelstereos/assets/sfx/VOICE_P3_GROK_PLAY.mp3
          test -f laboratoire/zelstereos/assets/sfx/VOICE_P4_ANTIGRAVITY_PLAY.mp3
          test "$(find laboratoire/zelstereos/assets/sfx/gamezel -maxdepth 1 -type f -name 'SFX*.mp3' | wc -l)" -eq 84
          test "$(find laboratoire/zelstereos/assets/sfx/legacy -maxdepth 1 -type f -name 'SFX*.mp3' | wc -l)" -eq 36
          test "$(find laboratoire/zelstereos/assets/voices/gamezel -maxdepth 1 -type f -name 'SFX*.mp3' | wc -l)" -eq 16
          test -f laboratoire/zelstereos/assets/sfx/legacy/archive-mapping.json
          grep -Fq '<title>ANTMUX / ZELSTÉRÉOS — Public Safe Live</title>' laboratoire/zelstereos/index.html
          grep -Fq 'id="tabScreen1"' laboratoire/zelstereos/index.html
          grep -Fq 'id="tabScreen5"' laboratoire/zelstereos/index.html
          grep -Fq 'id="gamezelQuickPlay"' laboratoire/zelstereos/index.html
          grep -Fq 'data-gamezel-player="P1"' laboratoire/zelstereos/index.html
          grep -Fq 'data-gamezel-player="P4"' laboratoire/zelstereos/index.html
          grep -Fq './zelstereos/' laboratoire/index.html
          ! grep -Eq 'Â|Ã|â' laboratoire/zelstereos/index.html
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('laboratoire/zelstereos/assets/sfx')
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert m['count']==36
          assert [c['id'] for c in m['clips']]==[f'SFX{i:02d}' for i in range(1,37)]
          assert all((root/c['file']).is_file() and (root/c['file']).stat().st_size>1000 for c in m['clips'])
          all_mp3 = sorted(root.rglob('*.mp3')) + sorted((root.parent/'voices').rglob('*.mp3'))
          assert len(all_mp3) == 176, len(all_mp3)
          for audio in all_mp3:
              data = audio.read_bytes()
              assert len(data) > 1000, audio
              assert data.startswith(b'ID3') or (len(data) >= 2 and data[0] == 0xFF and (data[1] & 0xE0) == 0xE0), audio
          print('ZELSTEREOS_SFX36_PAYLOAD=PASS')
          print('ZELSTEREOS_AUDIO176_PAYLOAD=PASS')
          PY
          rm -rf _zelstereos_deploy
          mkdir -p _zelstereos_deploy/api _zelstereos_deploy/assets/sfx _zelstereos_deploy/assets/voices
          cp laboratoire/zelstereos/index.html _zelstereos_deploy/index.html
          cp laboratoire/zelstereos/api/state _zelstereos_deploy/api/state
          cp -a laboratoire/zelstereos/assets/sfx/. _zelstereos_deploy/assets/sfx/
          cp -a laboratoire/zelstereos/assets/voices/. _zelstereos_deploy/assets/voices/
          cp laboratoire/index.html _zelstereos_deploy/laboratoire-index.html
          (cd _zelstereos_deploy && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          test "$actual_public_key" = "$expected_public_key"
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Preflight VPS
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" \
            "set -e; test -d '$LAB_ROOT'; test -w '$LAB_ROOT'; test \"\$(id -un)\" = '$VPS_USER'"

      - name: Upload staged payload
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" \
            "rm -rf '$REMOTE_STAGE' && mkdir -p '$REMOTE_STAGE'"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -r _zelstereos_deploy/. \
            "$VPS_USER@$VPS_HOST:$REMOTE_STAGE/"
      - name: Backup and deploy exact files
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE'
          set -euo pipefail
          LAB_ROOT='/var/www/antmux.com/public_html/laboratoire'
          TARGET_ROOT="$LAB_ROOT/zelstereos"
          REMOTE_STAGE='${{ env.REMOTE_STAGE }}'
          BACKUP_ROOT="$HOME/antmux-zelstereos-backups/$(date -u +%Y%m%d-%H%M%S)-${{ github.sha }}"
          cd "$REMOTE_STAGE"
          sha256sum -c SHA256SUMS
          mkdir -p "$BACKUP_ROOT"
          if test -f "$TARGET_ROOT/index.html"; then cp -a "$TARGET_ROOT/index.html" "$BACKUP_ROOT/index.html"; fi
          if test -d "$TARGET_ROOT/assets/sfx"; then mkdir -p "$BACKUP_ROOT/assets"; cp -a "$TARGET_ROOT/assets/sfx" "$BACKUP_ROOT/assets/sfx"; fi
          if test -d "$TARGET_ROOT/assets/voices"; then mkdir -p "$BACKUP_ROOT/assets"; cp -a "$TARGET_ROOT/assets/voices" "$BACKUP_ROOT/assets/voices"; fi
          if test -f "$LAB_ROOT/index.html"; then cp -a "$LAB_ROOT/index.html" "$BACKUP_ROOT/laboratoire-index.html"; fi
          install -d -m 0755 "$TARGET_ROOT/api" "$TARGET_ROOT/assets"
          install -m 0644 "$REMOTE_STAGE/index.html" "$TARGET_ROOT/index.html"
          install -m 0644 "$REMOTE_STAGE/api/state" "$TARGET_ROOT/api/state"
          rm -rf "$TARGET_ROOT/assets/sfx"
          cp -a "$REMOTE_STAGE/assets/sfx" "$TARGET_ROOT/assets/sfx"
          find "$TARGET_ROOT/assets/sfx" -type d -exec chmod 0755 {} +
          find "$TARGET_ROOT/assets/sfx" -type f -exec chmod 0644 {} +
          rm -rf "$TARGET_ROOT/assets/voices"
          cp -a "$REMOTE_STAGE/assets/voices" "$TARGET_ROOT/assets/voices"
          find "$TARGET_ROOT/assets/voices" -type d -exec chmod 0755 {} +
          find "$TARGET_ROOT/assets/voices" -type f -exec chmod 0644 {} +
          install -m 0644 "$REMOTE_STAGE/laboratoire-index.html" "$LAB_ROOT/index.html"
          rm -rf "$REMOTE_STAGE"
          printf 'BACKUP_ROOT=%s\n' "$BACKUP_ROOT"
          REMOTE

      - name: Verify public ZELSTEREOS page and laboratory link
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/zelstereos/ -o /tmp/zelstereos.html
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/zelstereos/api/state -o /tmp/zelstereos-state.json
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/zelstereos/assets/sfx/manifest.json -o /tmp/zelstereos-sfx.json
          curl --fail --silent --show-error --location --range 0-63 https://antmux.com/laboratoire/zelstereos/assets/sfx/VOICE_P1_ASTRA_PLAY.mp3 -o /tmp/gamezel-p1.bin
          curl --fail --silent --show-error --location --range 0-63 https://antmux.com/laboratoire/zelstereos/assets/sfx/VOICE_P2_MUSE_PLAY.mp3 -o /tmp/gamezel-p2.bin
          curl --fail --silent --show-error --location --range 0-63 https://antmux.com/laboratoire/zelstereos/assets/sfx/VOICE_P3_GROK_PLAY.mp3 -o /tmp/gamezel-p3.bin
          curl --fail --silent --show-error --location --range 0-63 https://antmux.com/laboratoire/zelstereos/assets/sfx/VOICE_P4_ANTIGRAVITY_PLAY.mp3 -o /tmp/gamezel-p4.bin
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/ -o /tmp/laboratoire.html
          grep -Fq '<title>ANTMUX / ZELSTÉRÉOS — Public Safe Live</title>' /tmp/zelstereos.html
          grep -Fq 'id="tabScreen1"' /tmp/zelstereos.html
          grep -Fq 'id="tabScreen5"' /tmp/zelstereos.html
          grep -Fq 'id="gamezelQuickPlay"' /tmp/zelstereos.html
          grep -Fq 'data-gamezel-player="P1"' /tmp/zelstereos.html
          grep -Fq 'data-gamezel-player="P4"' /tmp/zelstereos.html
          ! grep -Eq 'Â|Ã|â' /tmp/zelstereos.html
          grep -Fq './zelstereos/' /tmp/laboratoire.html
          python - <<'PY'
          import json
          d=json.load(open('/tmp/zelstereos-state.json',encoding='utf-8'))
          assert d['mode']=='PUBLIC_SAFE'
          assert d['read_only'] is True
          assert d['status']=='SNAPSHOT'
          m=json.load(open('/tmp/zelstereos-sfx.json',encoding='utf-8'))
          assert m['count']==36
          assert [c['id'] for c in m['clips']]==[f'SFX{i:02d}' for i in range(1,37)]
          open('/tmp/zelstereos-sfx-files.txt','w',encoding='utf-8').write('\n'.join(c['file'] for c in m['clips'])+'\n')
          print('ZELSTEREOS_STATE_JSON=PASS')
          print('ZELSTEREOS_SFX36_MANIFEST=PASS')
          PY
          while IFS= read -r f; do
            curl --fail --silent --show-error --location --range 0-63 "https://antmux.com/laboratoire/zelstereos/assets/sfx/$f" -o /dev/null
          done < /tmp/zelstereos-sfx-files.txt
          echo 'ZELSTEREOS_SFX36_PUBLIC=PASS'
          check_public_audio() {
            rel="$1"
            ctype="$(curl --fail --silent --show-error --location --head "https://antmux.com/laboratoire/zelstereos/assets/$rel" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{v=tolower($2)} END{print v}')"
            case "$ctype" in
              audio/*) ;;
              *) echo "BAD_AUDIO_CONTENT_TYPE $rel $ctype" >&2; exit 1 ;;
            esac
          }
          find laboratoire/zelstereos/assets -type f -name '*.mp3' -printf '%P\n' | sort > /tmp/zelstereos-all-audio-files.txt
          test "$(wc -l < /tmp/zelstereos-all-audio-files.txt)" -eq 176
          while IFS= read -r f; do
            check_public_audio "$f"
          done < /tmp/zelstereos-all-audio-files.txt
          echo 'ZELSTEREOS_AUDIO176_PUBLIC=PASS'
          echo 'ZELSTEREOS_PUBLIC_DEPLOY=PASS'
