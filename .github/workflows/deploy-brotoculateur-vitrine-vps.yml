name: Deploy Brotoculateur Vitrine to VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-brotoculateur-vitrine-vps.yml'
      - 'laboratoire/index.html'
      - 'laboratoire/brotoculateur/index.html'
  pull_request:
    paths:
      - '.github/workflows/deploy-brotoculateur-vitrine-vps.yml'
      - 'laboratoire/index.html'
      - 'laboratoire/brotoculateur/index.html'

permissions:
  contents: read

concurrency:
  group: brotoculateur-vitrine-vps
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Validate navigation and document-mode contract
        run: |
          set -euo pipefail
          test -f laboratoire/brotoculateur/index.html
          grep -Fq 'BRUTUS WORKSHOP // 7 TABLEAUX' laboratoire/brotoculateur/index.html
          grep -Fq 'Interface originale' laboratoire/brotoculateur/index.html
          grep -Fq 'défilement vertical' laboratoire/brotoculateur/index.html
          grep -Fq 'COMMANDES VERROUILLÉES' laboratoire/brotoculateur/index.html
          grep -Fq '/brutus/public-state.json' laboratoire/brotoculateur/index.html
          grep -Fq 'brotoculateur-height' laboratoire/brotoculateur/index.html
          ! grep -Fq 'brotoculateur-vitrine.png' laboratoire/brotoculateur/index.html
          ! grep -Fq 'RETOUR LABORATOIRE' laboratoire/brotoculateur/index.html
          grep -Fq 'Horloge de la Vie' laboratoire/index.html
          grep -Fq 'NinoScreen' laboratoire/index.html
          ! grep -Fq 'BROTOCULATEUR · VITRINE PUBLIQUE' laboratoire/index.html
          ! grep -Fq 'BRUTOBAC · FOURMI AQUARIUM 3D' laboratoire/index.html
          ! grep -Fq 'BRUTOTABLEUR · VITRINE PUBLIQUE' laboratoire/index.html
          echo 'BROTOCULATEUR_DOCUMENT_CONTRACT=PASS'

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REMOTE_STAGE: /tmp/antmux-brotoculateur-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - name: Assemble payload
        run: |
          set -euo pipefail
          rm -rf _brotoculateur_deploy
          mkdir -p _brotoculateur_deploy
          cp laboratoire/index.html _brotoculateur_deploy/laboratoire-index.html
          cp laboratoire/brotoculateur/index.html _brotoculateur_deploy/brotoculateur-index.html
          cd _brotoculateur_deploy
          sha256sum laboratoire-index.html brotoculateur-index.html > SHA256SUMS
      - name: Configure pinned VPS SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload payload
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "rm -rf '$REMOTE_STAGE' && mkdir -p '$REMOTE_STAGE'"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -r _brotoculateur_deploy/. "$VPS_USER@$VPS_HOST:$REMOTE_STAGE/"
      - name: Deploy canonical Brotoculateur only
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE'
          set -euo pipefail
          LAB_ROOT='/var/www/antmux.com/public_html/laboratoire'
          CANON="$LAB_ROOT/brotoculateur"
          REMOTE_STAGE='${{ env.REMOTE_STAGE }}'
          BACKUP="$HOME/antmux-brotoculateur/backups/$(date -u +%Y%m%d-%H%M%S)-${{ github.sha }}"
          cd "$REMOTE_STAGE"
          sha256sum -c SHA256SUMS
          mkdir -p "$BACKUP" "$CANON"
          test -f "$LAB_ROOT/index.html" && cp -a "$LAB_ROOT/index.html" "$BACKUP/laboratoire-index.html" || true
          test -f "$CANON/index.html" && cp -a "$CANON/index.html" "$BACKUP/brotoculateur-index.html" || true
          install -m 0644 laboratoire-index.html "$LAB_ROOT/index.html"
          install -m 0644 brotoculateur-index.html "$CANON/index.html"
          rm -rf "$REMOTE_STAGE"
          echo 'BROTOCULATEUR_CANONICAL_DEPLOY=PASS'
          REMOTE
      - name: Verify public navigation and live document
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/brotoculateur/ -o /tmp/broto.html
          grep -Fq 'BRUTUS WORKSHOP // 7 TABLEAUX' /tmp/broto.html
          grep -Fq 'défilement vertical' /tmp/broto.html
          grep -Fq 'COMMANDES VERROUILLÉES' /tmp/broto.html
          grep -Fq 'brotoculateur-height' /tmp/broto.html
          ! grep -Fq 'brotoculateur-vitrine.png' /tmp/broto.html
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/ -o /tmp/lab.html
          grep -Fq 'Horloge de la Vie' /tmp/lab.html
          grep -Fq 'NinoScreen' /tmp/lab.html
          ! grep -Fq 'BROTOCULATEUR · VITRINE PUBLIQUE' /tmp/lab.html
          echo 'BROTOCULATEUR_VPS_VERIFY=PASS'
