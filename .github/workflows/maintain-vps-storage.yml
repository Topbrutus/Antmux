name: Maintain VPS Storage

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CLEAN-VPS-STORAGE to prune bounded X72 backups'
        required: true
        default: ''
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: antmux-vps-storage-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.event_name == 'schedule' || inputs.confirm == 'CLEAN-VPS-STORAGE'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          test "$actual_public_key" = "$expected_public_key"
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prune bounded X72 backups and recover public exporter
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_USER:-}"
          echo "::add-mask::$VPS_HOST"
          echo "::add-mask::$VPS_USER"

          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(hostname)" = "server1.antmux.com"
          test "$(id -un)" = "rob"
          echo '--- STORAGE BEFORE ---'
          df -h /
          du -sh "$HOME/antmux-x72-queen-backups" 2>/dev/null || true
          REMOTE

          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" 'bash -s -- "$HOME/antmux-x72-queen-backups"' < deploy/vps-storage/prune_x72_backups.sh

          # Snapshot history is rebuildable; keep a bounded hot window while latest.json remains canonical.
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" \
            'tmp=$(mktemp); cat > "$tmp"; python3 "$tmp" "$HOME/brotoculateur/.brotoculateur_instance_D/snapshots" --retain 512; rm -f "$tmp"' \
            < deploy/vps-storage/prune_brotoculateur_snapshots.py

          # Lossless cold compression for legacy crystals; new writes are already gzip-native.
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$VPS_USER@$VPS_HOST" \
            'tmp=$(mktemp); cat > "$tmp"; nice -n 10 python3 "$tmp" "$HOME/brotoculateur/brutomagique/crystals" --min-age-seconds 1800 --max-files 25000; rm -f "$tmp"' \
            < deploy/vps-storage/compress_brotomagique_crystals.py
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$VPS_USER@$VPS_HOST" \
            'tmp=$(mktemp); cat > "$tmp"; nice -n 10 python3 "$tmp" "$HOME/AppData/Local/Brotoculateur/brotoculateur-overflow/brutomagique/crystals" --min-age-seconds 1800 --max-files 25000; rm -f "$tmp"' \
            < deploy/vps-storage/compress_brotomagique_crystals.py

          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          journalctl --user --vacuum-size=128M >/dev/null 2>&1 || true
          systemctl --user reset-failed brutus-public.service >/dev/null 2>&1 || true
          need_restart=0
          if ! systemctl --user is-active --quiet brutus-public.service; then
            need_restart=1
          elif ! test -s /var/www/antmux.com/public_html/brutus/public-state.json; then
            need_restart=1
          else
            age=$(( $(date +%s) - $(stat -c %Y /var/www/antmux.com/public_html/brutus/public-state.json) ))
            if [ "$age" -gt 120 ]; then need_restart=1; fi
          fi
          if [ "$need_restart" -eq 1 ]; then
            systemctl --user restart brutus-public.service
          fi
          ok=0
          for _ in $(seq 1 30); do
            if systemctl --user is-active --quiet brutus-public.service && test -s /var/www/antmux.com/public_html/brutus/public-state.json; then
              age=$(( $(date +%s) - $(stat -c %Y /var/www/antmux.com/public_html/brutus/public-state.json) ))
              if [ "$age" -le 120 ]; then ok=1; break; fi
            fi
            sleep 2
          done
          test "$ok" -eq 1
          python3 - <<'PY'
          import json
          p='/var/www/antmux.com/public_html/brutus/public-state.json'
          d=json.load(open(p,encoding='utf-8'))
          b=d.get('brotoculateur') or {}
          print('PUBLIC_STATE_GENERATED_AT='+str(d.get('generated_at')))
          print('BROTO_STATE='+str(b.get('state')))
          print('BROTO_PROCESSED='+str(b.get('processed_packets')))
          print('BROTO_CRYSTALS='+str(b.get('crystals')))
          PY
          echo '--- STORAGE AFTER ---'
          df -h /
          used_pct="$(df -P / | awk 'NR==2 {gsub(/%/,"",$5); print $5}')"
          echo "ROOT_USED_PERCENT=$used_pct"
          if [ "$used_pct" -ge 90 ]; then echo 'STORAGE_HIGH_WATERMARK=WARNING'; fi
          du -sh "$HOME/antmux-x72-queen-backups" 2>/dev/null || true
          echo '--- REMAINING X72 BACKUPS ---'
          du -sk "$HOME"/antmux-x72-queen-backups/* 2>/dev/null | sort -nr | head -20 || true
          echo '--- HOME TOP LEVEL ---'
          du -x -k -d 1 "$HOME" 2>/dev/null | sort -nr | head -25 || true
          echo '--- BROTOCULATEUR BREAKDOWN ---'
          du -x -k -d 2 "$HOME/brotoculateur" 2>/dev/null | sort -nr | head -40 || true
          echo '--- BROTOCULATEUR LARGE FILES ---'
          find "$HOME/brotoculateur" -xdev -type f -size +100M -printf '%s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' 2>/dev/null | sort -nr | head -40 || true
          echo '--- QUEEN DATA FILES ---'
          ls -lh "$HOME"/antmux-x72-queen/data/queen.db* 2>/dev/null || true
          echo '--- QUEEN CHECKPOINT STATS ---'
          python3 - <<'PY'
          import sqlite3, pathlib
          p=pathlib.Path.home()/'antmux-x72-queen'/'data'/'queen.db'
          if p.exists():
              db=sqlite3.connect(f'file:{p}?mode=ro', uri=True)
              row=db.execute('SELECT count(*), min(id), max(id), avg(length(state_json)), max(length(state_json)), sum(length(state_json)) FROM checkpoints').fetchone()
              page_size=db.execute('PRAGMA page_size').fetchone()[0]
              page_count=db.execute('PRAGMA page_count').fetchone()[0]
              free_count=db.execute('PRAGMA freelist_count').fetchone()[0]
              print('CHECKPOINTS count=%s min_id=%s max_id=%s avg_json=%s max_json=%s json_total=%s' % row)
              print('SQLITE page_size=%s page_count=%s freelist_count=%s db_bytes=%s free_bytes=%s' % (page_size,page_count,free_count,page_size*page_count,page_size*free_count))
              db.close()
          PY
          echo '--- DELETED OPEN FILES ---'
          if command -v lsof >/dev/null 2>&1; then lsof +L1 2>/dev/null | sort -k7 -nr | head -20 || true; fi
          systemctl --user show brutus-public.service -p ActiveState -p SubState -p NRestarts --no-pager
          REMOTE

