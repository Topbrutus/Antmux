name: Deploy Brotoculateur L4 Canon VPS

on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        default: audit
        type: choice
        options: [audit, canary_start]
      confirm:
        required: false
        default: ''
        type: string

permissions:
  contents: read
concurrency:
  group: brotoculateur-l4-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate request
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$MODE" in audit|canary_start) ;; *) exit 2 ;; esac
          if [ "$MODE" = canary_start ]; then test "$CONFIRM" = 'BRUTUS-L4-VPS'; fi
          python3 -m py_compile deploy/vps-l4/l4_canon.py deploy/vps-l4/patch_brotoculateur_l4_canon.py deploy/vps-l4/test_l4_canon.py
      - name: Configure pinned SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stage L4 tools
        if: inputs.mode == 'canary_start'
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes deploy/vps-l4/*.py "$VPS_USER@$VPS_HOST:/tmp/"
      - name: Audit or deploy L4
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "MODE='$MODE' bash -se" <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/brotoculateur"; PKG="$ROOT/src/brotoculateur"; DASH="$PKG/dashboard.py"; L3="$PKG/l3_press.py"; L4="$PKG/l4_canon.py"; URL='http://127.0.0.1:8781/api/status'
          PRE='b00131bb87a21ffb55baec337e809fcdf39c03d3498d63f1690beda43541ef84'; L3SHA='373f2bf054ec595e72c1012228b3a39ec0279e9a2c8cefa9d7122c7e113fb42d'; L4SHA='9f8ff4d83cec6721eefe0a04bfd333861d47e7e10b17a85dec2dcaf1b9dc336d'
          sha(){ sha256sum "$1"|awk '{print $1}'; }
          test "$(sha "$L3")" = "$L3SHA"; systemctl --user is-active --quiet brotoculateur.service; curl -fsS "$URL" >/tmp/l4-before.json
          dh=$(sha "$DASH"); lh=ABSENT; [ ! -f "$L4" ] || lh=$(sha "$L4")
          if [ "$dh" = "$PRE" ] && [ "$lh" = ABSENT ]; then state=PRE_L4; elif [ "$lh" = "$L4SHA" ]; then state=POST_L4; else exit 3; fi
          echo "L4_SOURCE_STATE=$state"; echo "L4_DASHBOARD_SHA256=$dh"; echo "L4_MODULE_SHA256=$lh"
          SOURCE_STATE="$state" python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/l4-before.json')); t8=d.get('t8_countertest') or {}; t9=d.get('t9_stability') or {}; t10=d.get('t10_replay') or {}; t11=d.get('t11_budget') or {}; t12=d.get('t12_candidate') or {}; l1=d.get('l1_crystal_score') or {}; l2=d.get('l2_threshold') or {}; l3=d.get('l3_press') or {}; l4=d.get('l4_canon') or {}; bm=d.get('brutomagique') or {}
          for k,v in [('STATE',d.get('state')),('PROCESSED',d.get('processed_packets')),('CRYSTALS',bm.get('total_crystals')),('L3_OBSERVATIONS',l3.get('observations')),('L3_PRESSED',l3.get('pressed')),('L3_BLOCKED_L2_OTHER',l3.get('blocked_l2_other')),('L3_BLOCKED_MISSING_Z',l3.get('blocked_missing_z')),('L3_UNIQUE_DUST_KEYS',l3.get('unique_dust_keys')),('L4_OBSERVATIONS',l4.get('observations')),('L4_CANONICAL_RECORDS',l4.get('canonical_records')),('L4_BLOCKED_L3_OTHER',l4.get('blocked_l3_other')),('L4_BLOCKED_MISSING_Z',l4.get('blocked_missing_z')),('L4_UNIQUE_CANONICAL_Z',l4.get('unique_canonical_z'))]: print(f'{k}={v}')
          assert not d.get('worker_error'); assert int(t8.get('failed') or 0)==0 and int(t8.get('limited') or 0)==0; assert int(t9.get('drifts') or 0)==0
          assert int(t8.get('observations') or 0)==int(t9.get('observations') or 0)==int(t10.get('observations') or 0)==int(t11.get('observations') or 0)==int(t12.get('observations') or 0)==int(l1.get('observations') or 0)==int(l2.get('observations') or 0)==int(l3.get('observations') or 0)
          l3_obs=int(l3.get('observations') or 0); l3_pressed=int(l3.get('pressed') or 0); l3_block_l2=int(l3.get('blocked_l2_other') or 0); l3_block_z=int(l3.get('blocked_missing_z') or 0)
          assert l3_obs == l3_pressed + l3_block_l2 + l3_block_z
          if os.environ['SOURCE_STATE']=='POST_L4' and l4.get('enabled') is True:
              assert l4.get('authority')=='SHADOW_ONLY'; assert l4.get('canonical_z_is_output_z_id') is True; assert l4.get('creates_new_identity') is False
              assert l4.get('records_both_l3_reference_sides') is True and l4.get('technical_identity_canon') is True and l4.get('l5_placement_input') is True
              assert l4.get('scientific_canon_claim') is False and l4.get('canonicalizes_scientific_proof') is False and l4.get('proof_promotion') is False
              l4_obs=int(l4.get('observations') or 0); l4_canon=int(l4.get('canonical_records') or 0); l4_block_l3=int(l4.get('blocked_l3_other') or 0); l4_block_z=int(l4.get('blocked_missing_z') or 0)
              assert l4_obs == l3_obs
              assert l4_canon == l3_pressed
              assert l4_block_l3 == l3_block_l2 + l3_block_z
              assert l4_block_z == 0
              assert l4_obs == l4_canon + l4_block_l3 + l4_block_z
              assert int(l4.get('unique_canonical_z') or 0) == int(l3.get('unique_dust_keys') or 0)
          print('L4_AUDIT_ONLY=PASS')
          PY
          df -P / | awk 'NR==2 {print "ROOT_DISK_USED=" $5 " ROOT_DISK_FREE_KB=" $4}'
          [ "$MODE" = canary_start ] || exit 0
          test "$state" = PRE_L4
          STAGE="/tmp/l4-stage-$$"; mkdir -p "$STAGE/src"; cp -a "$PKG" "$STAGE/src/brotoculateur"; python3 /tmp/patch_brotoculateur_l4_canon.py "$STAGE"
          test "$(sha "$STAGE/src/brotoculateur/l4_canon.py")" = "$L4SHA"
          PYTHONPATH="$STAGE/src" BROTO_T8_ENABLED=1 BROTO_T9_ENABLED=1 BROTO_T10_ENABLED=1 BROTO_T11_ENABLED=1 BROTO_T12_ENABLED=1 BROTO_L1_ENABLED=1 BROTO_L2_ENABLED=1 BROTO_L3_ENABLED=1 BROTO_L4_ENABLED=1 BROTO_L2_THRESHOLD=75 BROTO_T11_CPU_SLOTS=8 BROTO_T11_MEMORY_SLOTS=8 BROTO_T11_STORAGE_SLOTS=8 BROTO_T11_TIME_SLOTS=8 python3 /tmp/test_l4_canon.py
          sd=$(sha "$STAGE/src/brotoculateur/dashboard.py"); echo "L4_STAGE_DASHBOARD_SHA256=$sd"; echo L4_EXACT_LIVE_STAGE=PASS
          was=$(python3 -c "import json;print(1 if json.load(open('/tmp/l4-before.json')).get('state')=='RUNNING' else 0)")
          [ "$was" = 0 ] || { curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/save >/dev/null; curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/pause >/dev/null; }
          B="$ROOT/backups/l4-$(date -u +%Y%m%dT%H%M%SZ)"; mkdir -p "$B"; cp -a "$DASH" "$L3" "$B/"; cp -a /tmp/l4-before.json "$B/status-before.json"; echo "L4_BACKUP=$B"
          D="$HOME/.config/systemd/user/brotoculateur.service.d"; F="$D/99-brutus-l4.conf"; mkdir -p "$D"
          rollback(){ set +e; cp -a "$B/dashboard.py" "$DASH"; rm -f "$L4" "$F"; systemctl --user daemon-reload; systemctl --user restart brotoculateur.service; [ "$was" = 0 ] || curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/start >/dev/null || true; exit 1; }; trap rollback ERR
          cp -a "$STAGE/src/brotoculateur/dashboard.py" "$DASH"; cp -a "$STAGE/src/brotoculateur/l4_canon.py" "$L4"; printf '[Service]\nEnvironment="BROTO_L4_ENABLED=1"\n' > "$F"; systemctl --user daemon-reload; systemctl --user restart brotoculateur.service; sleep 2; curl -fsS "$URL" >/tmp/l4-zero.json
          b3=$(python3 -c "import json;print(int((json.load(open('/tmp/l4-zero.json')).get('l3_press') or {}).get('observations') or 0))"); b4=$(python3 -c "import json;print(int((json.load(open('/tmp/l4-zero.json')).get('l4_canon') or {}).get('observations') or 0))"); curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/start >/dev/null
          ok=0; for _ in $(seq 1 30); do sleep 1; curl -fsS "$URL" >/tmp/l4-live.json; if B3="$b3" B4="$b4" python3 - <<'PY'
          import json,os,sys
          d=json.load(open('/tmp/l4-live.json')); l3=d.get('l3_press') or {}; l4=d.get('l4_canon') or {}; a=int(l3.get('observations') or 0)-int(os.environ['B3']); b=int(l4.get('observations') or 0)-int(os.environ['B4'])
          l3_obs=int(l3.get('observations') or 0); l3_pressed=int(l3.get('pressed') or 0); l3_b2=int(l3.get('blocked_l2_other') or 0); l3_bz=int(l3.get('blocked_missing_z') or 0)
          l4_obs=int(l4.get('observations') or 0); l4_canon=int(l4.get('canonical_records') or 0); l4_b3=int(l4.get('blocked_l3_other') or 0); l4_bz=int(l4.get('blocked_missing_z') or 0)
          good=d.get('state')=='RUNNING' and b>0 and a==b
          good=good and l3_obs==l3_pressed+l3_b2+l3_bz
          good=good and l4_obs==l3_obs and l4_canon==l3_pressed and l4_b3==l3_b2+l3_bz and l4_bz==0
          good=good and l4_obs==l4_canon+l4_b3+l4_bz and int(l4.get('unique_canonical_z') or 0)==int(l3.get('unique_dust_keys') or 0)
          sys.exit(0 if good else 1)
          PY
          then ok=1; break; fi; done; test "$ok" = 1
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/l4-live.json')); l3=d.get('l3_press') or {}; l4=d.get('l4_canon') or {}
          print('L4_LIVE_STATE='+str(d.get('state'))); print('L4_LIVE_L3_OBSERVATIONS='+str(l3.get('observations'))); print('L4_LIVE_L3_PRESSED='+str(l3.get('pressed'))); print('L4_LIVE_L3_BLOCKED_L2_OTHER='+str(l3.get('blocked_l2_other'))); print('L4_LIVE_OBSERVATIONS='+str(l4.get('observations'))); print('L4_LIVE_CANONICAL_RECORDS='+str(l4.get('canonical_records'))); print('L4_LIVE_BLOCKED_L3_OTHER='+str(l4.get('blocked_l3_other'))); print('L4_LIVE_UNIQUE_CANONICAL_Z='+str(l4.get('unique_canonical_z'))); print('L4_LIVE_REFERENCE_SIDES='+str(l4.get('reference_sides'))); print('L4_LIVE_VERIFY=PASS')
          PY
          test "$(sha "$DASH")" = "$sd"; test "$(sha "$L4")" = "$L4SHA"; echo "L4_POST_DASHBOARD_SHA256=$sd"; trap - ERR; rm -rf "$STAGE"; echo L4_WORKFLOW=PASS
          REMOTE
