name: Deploy BrutoBac Vitrine to VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-brutobac-vitrine-vps.yml'
      - 'laboratoire/index.html'
      - 'laboratoire/brutobac/**'
  pull_request:
    paths:
      - '.github/workflows/deploy-brutobac-vitrine-vps.yml'
      - 'laboratoire/index.html'
      - 'laboratoire/brutobac/**'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-BRUTOBAC-VITRINE'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: brutobac-vitrine-vps
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Validate BrutoBac public contract
        run: |
          set -euo pipefail
          test -f laboratoire/brutobac/index.html
          test -f laboratoire/brutobac/PUBLIC-PROVENANCE.json
          test -f laboratoire/brutobac/README.md
          grep -Fq 'BRUTOBAC · QUEEN SERVER LIVE' laboratoire/brutobac/index.html
          grep -Fq 'http://127.0.0.1:8780/api/status' laboratoire/brutobac/index.html
          grep -Fq '💎 BRUTOBAC · FOURMI AQUARIUM 3D' laboratoire/index.html
          python3 - <<'PY'
          import json, pathlib
          p=json.loads(pathlib.Path('laboratoire/brutobac/PUBLIC-PROVENANCE.json').read_text(encoding='utf-8'))
          assert p['mode'] == 'PUBLIC_READ_ONLY_LIVE_MIRROR'
          assert p['queen_authority'] == 'QUEEN_SERVER_V0_2'
          assert p['queen_public_schema'] == 'BRUTUS-AQUARIUM-EVENT-v1'
          assert p['dust_rendering'] == 'VISUAL_OVERLAY_ONLY'
          assert p['queen_mutation_from_vitrine'] is False
          assert p['dust_mutation_from_vitrine'] is False
          assert p['password_or_secret_in_public_payload'] is False
          assert p['mathematical_proof_claim'] is False
          assert p['fail_closed_when_dust_source_unavailable'] is True
          print('BRUTOBAC_VITRINE_CONTRACT=PASS')
          PY

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY-BRUTOBAC-VITRINE'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REMOTE_STAGE: /tmp/antmux-brutobac-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6

      - name: Assemble payload
        run: |
          set -euo pipefail
          rm -rf _brutobac_deploy
          mkdir -p _brutobac_deploy/public
          cp laboratoire/index.html _brutobac_deploy/laboratoire-index.html
          cp laboratoire/brutobac/index.html _brutobac_deploy/public/
          cp laboratoire/brutobac/PUBLIC-PROVENANCE.json _brutobac_deploy/public/
          cp laboratoire/brutobac/README.md _brutobac_deploy/public/
          cd _brutobac_deploy
          { printf '%s\0' laboratoire-index.html; find public -type f -print0; } | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          test "$actual_public_key" = "$expected_public_key"
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload payload
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "rm -rf '$REMOTE_STAGE' && mkdir -p '$REMOTE_STAGE'"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -r _brutobac_deploy/. "$VPS_USER@$VPS_HOST:$REMOTE_STAGE/"

      - name: Deploy public BrutoBac shell
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE'
          set -euo pipefail
          LAB_ROOT='/var/www/antmux.com/public_html/laboratoire'
          PUBLIC_ROOT="$LAB_ROOT/brutobac"
          REMOTE_STAGE='${{ env.REMOTE_STAGE }}'
          BACKUP="$HOME/antmux-brutobac/backups/$(date -u +%Y%m%d-%H%M%S)-${{ github.sha }}"

          cd "$REMOTE_STAGE"
          sha256sum -c SHA256SUMS
          mkdir -p "$BACKUP"
          test -f "$LAB_ROOT/index.html" && cp -a "$LAB_ROOT/index.html" "$BACKUP/laboratoire-index.html" || true
          test -d "$PUBLIC_ROOT" && cp -a "$PUBLIC_ROOT/." "$BACKUP/" || true

          install -d -m 0755 "$PUBLIC_ROOT"
          install -m 0644 laboratoire-index.html "$LAB_ROOT/index.html"
          install -m 0644 public/index.html "$PUBLIC_ROOT/index.html"
          install -m 0644 public/PUBLIC-PROVENANCE.json "$PUBLIC_ROOT/PUBLIC-PROVENANCE.json"
          install -m 0644 public/README.md "$PUBLIC_ROOT/README.md"

          # The real aquarium must already be mounted by the shared Queen service.
          curl --fail --silent --show-error http://127.0.0.1:8720/api/brutobac/ -o /tmp/brutobac-inner.html
          grep -Fq 'BRUTUS LIVE FOURMI AQUARIUM 3D' /tmp/brutobac-inner.html
          curl --fail --silent --show-error http://127.0.0.1:8720/api/brutobac/snapshot -o /tmp/brutobac-snapshot.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/brutobac-snapshot.json', encoding='utf-8'))
          assert isinstance(data, list) and len(data) >= 2
          assert all(x.get('schema') == 'BRUTUS-AQUARIUM-EVENT-v1' for x in data)
          assert any(x.get('event_type') == 'SYSTEM_STATUS' for x in data)
          assert any(x.get('event_type') == 'ANT_STATE' and x.get('role') == 'QUEEN' for x in data)
          print('BRUTOBAC_QUEEN_SOURCE=PASS')
          PY
          rm -rf "$REMOTE_STAGE"
          REMOTE

      - name: Verify public BrutoBac
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/ -o /tmp/lab.html
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/brutobac/ -o /tmp/brutobac.html
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/brutobac/PUBLIC-PROVENANCE.json -o /tmp/provenance.json
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/embryon-x72/api/brutobac/ -o /tmp/inner.html
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/embryon-x72/api/brutobac/snapshot -o /tmp/snapshot.json
          grep -Fq '💎 BRUTOBAC · FOURMI AQUARIUM 3D' /tmp/lab.html
          grep -Fq 'BRUTOBAC · QUEEN SERVER LIVE' /tmp/brutobac.html
          grep -Fq 'http://127.0.0.1:8780/api/status' /tmp/brutobac.html
          grep -Fq 'BRUTUS LIVE FOURMI AQUARIUM 3D' /tmp/inner.html
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/provenance.json', encoding='utf-8'))
          s=json.load(open('/tmp/snapshot.json', encoding='utf-8'))
          assert p['queen_mutation_from_vitrine'] is False
          assert p['dust_rendering'] == 'VISUAL_OVERLAY_ONLY'
          assert isinstance(s, list) and len(s) >= 2
          assert all(x.get('schema') == 'BRUTUS-AQUARIUM-EVENT-v1' for x in s)
          print('BRUTOBAC_PUBLIC_VITRINE=PASS')
          PY
