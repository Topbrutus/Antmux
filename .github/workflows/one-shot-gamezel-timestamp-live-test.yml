name: One-shot GAMEZEL timestamp live test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-gamezel-timestamp-live-test.yml'

permissions:
  contents: read

jobs:
  live-test:
    runs-on: ubuntu-latest
    steps:
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          test "$actual_public_key" = "$expected_public_key"
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run disposable live timestamp test on VPS
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE'
          set -euo pipefail
          ROOT="$HOME/zelstereos-gamezel"
          SERVICE="zelstereos-gamezel.service"
          TEST_PORT=33217
          TMP_ROOT="/tmp/gamezel-ts-live-test-$$"
          mkdir -p "$TMP_ROOT/live"
          cd "$ROOT"

          systemctl --user is-active --quiet "$SERVICE"
          grep -Fqx '    TIMESTAMP: cue.STARTED_AT ?? cue.TIMESTAMP ?? cue.CREATED_AT ?? Date.now()' server.js
          node --check server.js

          cleanup() {
            if test -n "${TEST_PID:-}"; then kill "$TEST_PID" 2>/dev/null || true; wait "$TEST_PID" 2>/dev/null || true; fi
            rm -rf "$TMP_ROOT"
          }
          trap cleanup EXIT

          HOST=127.0.0.1 \
          PORT="$TEST_PORT" \
          PUBLIC_MIRROR_DIR="$TMP_ROOT/live" \
          PUBLIC_MIRROR_INTERVAL_MS=500 \
          GAMEZEL_PUBLIC_DRAW_ENABLED=true \
          GAMEZEL_PUBLIC_DRAW_COOLDOWN_MS=0 \
          node server.js >"$TMP_ROOT/server.log" 2>&1 &
          TEST_PID=$!

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:$TEST_PORT/api/public/gamezel/presence" >"$TMP_ROOT/presence.json"; then
              ready=1
              break
            fi
            sleep 0.5
          done
          test "$ready" = "1"

          node - "$TMP_ROOT/presence.json" <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if (d.draw_enabled !== true || d.mode !== 'PUBLIC_SAFE' || d.execution !== 'NONE' || d.persisted !== false) process.exit(1);
          console.log('DISPOSABLE_SAFE_DRAW_SURFACE=PASS');
          NODE

          curl --fail --silent --show-error -X POST "http://127.0.0.1:$TEST_PORT/api/public/gamezel/draw" \
            -H 'Content-Type: application/json' \
            --data '{"player_id":"P1"}' >"$TMP_ROOT/draw.json"

          cue_ready=0
          for _ in $(seq 1 20); do
            if test -f "$TMP_ROOT/live/audio.json"; then
              count="$(node -e "const d=require(process.argv[1]); console.log((d.cues||[]).length)" "$TMP_ROOT/live/audio.json" 2>/dev/null || echo 0)"
              if test "$count" -ge 1; then cue_ready=1; break; fi
            fi
            sleep 0.5
          done
          test "$cue_ready" = "1"

          cp "$TMP_ROOT/live/audio.json" "$TMP_ROOT/audio-a.json"
          sleep 2
          cp "$TMP_ROOT/live/audio.json" "$TMP_ROOT/audio-b.json"

          python3 - "$TMP_ROOT/audio-a.json" "$TMP_ROOT/audio-b.json" <<'PY'
          import json, sys
          a=json.load(open(sys.argv[1],encoding='utf-8'))
          b=json.load(open(sys.argv[2],encoding='utf-8'))
          assert int(b['generated_at']) > int(a['generated_at']), (a.get('generated_at'), b.get('generated_at'))
          ca={c.get('EVENT_ID'):c for c in a.get('cues',[]) if c.get('EVENT_ID')}
          cb={c.get('EVENT_ID'):c for c in b.get('cues',[]) if c.get('EVENT_ID')}
          common=sorted(set(ca)&set(cb))
          assert common, 'no common cue across heartbeats'
          changed=[eid for eid in common if ca[eid].get('TIMESTAMP') != cb[eid].get('TIMESTAMP')]
          assert not changed, changed
          eid=common[-1]
          assert isinstance(ca[eid].get('TIMESTAMP'), int), ca[eid]
          print('GAMEZEL_TIMESTAMP_LIVE_REGRESSION=PASS')
          print(f'EVENT_ID={eid}')
          print(f'TIMESTAMP_A={ca[eid]["TIMESTAMP"]}')
          print(f'TIMESTAMP_B={cb[eid]["TIMESTAMP"]}')
          print(f'COMMON_CUES={len(common)}')
          print(f'TIMESTAMP_CHANGED={len(changed)}')
          PY

          systemctl --user is-active --quiet "$SERVICE"
          echo 'PRODUCTION_GAMEZEL_SERVICE_STILL_ACTIVE=PASS'
          REMOTE
