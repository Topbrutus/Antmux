name: Astra Brotoculateur Repair Check

on:
  push:
    branches:
      - astra/vps-read-status-20261009
    paths:
      - '.github/workflows/astra-brotoculateur-repair-check.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Locate Brotoculateur runtime only
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'SH'
          set -u
          echo '=== MATCHING PATHS ==='
          for root in "$HOME" /opt /srv /var/www; do
            [ -e "$root" ] || continue
            find "$root" -maxdepth 5 \( -iname '*brotoc*' -o -iname '*brutocalcul*' \) -print 2>/dev/null | head -160
          done
          echo '=== NGINX REFERENCES ==='
          grep -RniE 'brotoculateur|brutocalculateur|8778|8780' /etc/nginx 2>/dev/null | head -120 || true
          echo '=== SYSTEMD DEFINITIONS ==='
          grep -RniE 'brotoculateur|brutocalculateur|8778|8780' /etc/systemd/system /lib/systemd/system 2>/dev/null | head -120 || true
          echo '=== HOME REPO MARKERS ==='
          find "$HOME" -maxdepth 4 -type f \( -name 'package.json' -o -name 'pyproject.toml' -o -name 'requirements.txt' -o -name '*.service' -o -name '*.py' \) -print 2>/dev/null | grep -Ei 'brotoc|brutocalcul' | head -120 || true
          echo '=== GIT REPOS NAMED BROTO ==='
          find "$HOME" /opt /srv -maxdepth 5 -type d -name .git -print 2>/dev/null | sed 's#/.git$##' | grep -Ei 'brotoc|brutocalcul' | head -80 || true
          echo '=== END ==='
          SH
