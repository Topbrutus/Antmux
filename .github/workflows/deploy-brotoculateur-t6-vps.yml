name: Deploy Brotoculateur T6 Papillon Affinity VPS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit, start T6 Papillon affinity shadow, or disable T6
        required: true
        default: audit
        type: choice
        options: [audit, canary_start, disable]
      confirm:
        description: Type BRUTUS-T6-VPS for canary_start or disable
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: brotoculateur-t6-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate request and T6 tools
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$MODE" in audit|canary_start|disable) ;; *) exit 2 ;; esac
          if [ "$MODE" != audit ]; then test "$CONFIRM" = 'BRUTUS-T6-VPS'; fi
          python3 -m py_compile \
            deploy/vps-t6/t6_papillon.py \
            deploy/vps-t6/patch_brotoculateur_t6_papillon.py \
            deploy/vps-t6/test_t6_papillon.py

      - name: Configure pinned VPS SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage T6 tools
        if: inputs.mode == 'canary_start'
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy/vps-t6/t6_papillon.py \
            deploy/vps-t6/patch_brotoculateur_t6_papillon.py \
            deploy/vps-t6/test_t6_papillon.py \
            "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Audit or deploy T6
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "MODE='$MODE' bash -se" <<'REMOTE'
          set -euo pipefail
          BROTO_ROOT="$HOME/brotoculateur"
          PKG="$BROTO_ROOT/src/brotoculateur"
          PAP="$PKG/papillon_engine.py"
          T5MOD="$PKG/t5_independence.py"
          T6MOD="$PKG/t6_papillon.py"
          ORCH="$PKG/orchestrator.py"
          DASH="$PKG/dashboard.py"
          STATUS_URL='http://127.0.0.1:8781/api/status'

          PRE_PAP='ca45f4ebd9ac4efc241626b9322c2e6d57870873d27982f287d99a9f773871ef'
          PRE_T5='22d71b4d3d52093ee10aa78a5ea0f620abc4c5c06e5bddfe6ddf09b9a638a3c6'
          PRE_ORCH='461a18418bf2abc0c4f434287e5783d1e29bfaf67d9837d9e388b8a6f1b8fb7c'
          PRE_DASH='dc7d1fe9212a30f40371381b8abfcca91d5ea490227859a4759412d72ca59c10'
          POST_PAP='c66cd7530d06e88c08857b9a1b3a42748296a06f542d7a0bbee0ad7ce0ccc101'
          POST_T5="$PRE_T5"
          POST_T6='6c58c96cd46de6f10851e443b5882ffdd2c505c82f907b325cae250e1ffd0792'
          POST_ORCH='de777c45a46b06476a44affbacf3fc9237dec0be380dd9cd767e979fa437bd56'
          POST_DASH='52ca5d46a25c3e444eca03b38f0c9647c113741c4eafcc1f027559c370533dbd'

          test -f "$PAP" -a -f "$T5MOD" -a -f "$ORCH" -a -f "$DASH"
          systemctl --user is-active --quiet brotoculateur.service
          curl -fsS --max-time 5 "$STATUS_URL" >/tmp/t6-before.json

          pap_hash=$(sha256sum "$PAP"|awk '{print $1}')
          t5_hash=$(sha256sum "$T5MOD"|awk '{print $1}')
          orch_hash=$(sha256sum "$ORCH"|awk '{print $1}')
          dash_hash=$(sha256sum "$DASH"|awk '{print $1}')
          if [ -f "$T6MOD" ]; then t6_hash=$(sha256sum "$T6MOD"|awk '{print $1}'); else t6_hash='ABSENT'; fi
          source_state='UNKNOWN'
          if [ "$pap_hash" = "$PRE_PAP" ] && [ "$t5_hash" = "$PRE_T5" ] && [ "$orch_hash" = "$PRE_ORCH" ] && [ "$dash_hash" = "$PRE_DASH" ] && [ "$t6_hash" = 'ABSENT' ]; then source_state='PRE_T6'; fi
          if [ "$pap_hash" = "$POST_PAP" ] && [ "$t5_hash" = "$POST_T5" ] && [ "$orch_hash" = "$POST_ORCH" ] && [ "$dash_hash" = "$POST_DASH" ] && [ "$t6_hash" = "$POST_T6" ]; then source_state='POST_T6'; fi
          test "$source_state" != 'UNKNOWN'
          echo "T6_SOURCE_STATE=$source_state"

          SOURCE_STATE="$source_state" python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/t6-before.json',encoding='utf-8'))
          pap=d.get('papillon') or {}; t5=d.get('t5_independence') or {}; t6=d.get('t6_papillon') or {}
          c2=d.get('c2_fingerprint') or {}; t4=d.get('t4_convergence') or {}
          print('STATE='+str(d.get('state')))
          print('PROCESSED='+str(d.get('processed_packets')))
          print('CRYSTALS='+str((d.get('brutomagique') or {}).get('total_crystals')))
          print('C2_TOTAL='+str(c2.get('total_fingerprints')))
          print('T4_OBSERVATIONS='+str(t4.get('observations')))
          print('T5_OBSERVATIONS='+str(t5.get('observations')))
          print('T5_CANDIDATE_TARGETS='+str(t5.get('independence_candidate_targets')))
          print('PAPILLON_SHARDS='+str(pap.get('shards')))
          print('PAPILLON_MODE='+str(pap.get('mode')))
          print('T6_MODE='+str(t6.get('mode')))
          print('T6_ENABLED='+str(t6.get('enabled')))
          print('T6_OBSERVATIONS='+str(t6.get('observations')))
          assert not d.get('worker_error'), d.get('worker_error')
          assert int(pap.get('shards') or 0)==144
          assert pap.get('mode')=='EXACT_SELECTIVE_MEMO_PRESERVE_TRACE'
          assert t5.get('enabled') is True
          if os.environ['SOURCE_STATE']=='POST_T6' and t6.get('enabled') is True:
              assert int(t6.get('observations') or 0)==int(t5.get('observations') or 0)
              assert int(t6.get('shard_count') or 0)==144
              assert t6.get('authority')=='SHADOW_ONLY'
              assert t6.get('source_of_truth')=='PAPILLON144_PUBLIC_SHARD_INDEX_PLUS_T5_TIER'
              assert t6.get('papillon_cache_mutated') is False
              assert t6.get('papillon_policy_changed') is False
              assert int(t6.get('actual_papillon_routes_applied') or 0)==0
              assert t6.get('controls_papillon') is False
              assert int(t6.get('compute_skips') or 0)==0
              assert t6.get('proof_promotion') is False
          print('T6_AUDIT_ONLY=PASS')
          PY
          df -P / | awk 'NR==2 {print "ROOT_DISK_USED=" $5 " ROOT_DISK_FREE_KB=" $4}'

          if [ "$MODE" = audit ]; then exit 0; fi

          if [ "$MODE" = canary_start ]; then
            test "$source_state" = 'PRE_T6'
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t6-before.json',encoding='utf-8'))
          z=d.get('brutus_cortex') or {}; t5=d.get('t5_independence') or {}; pap=d.get('papillon') or {}
          assert d.get('state') in {'RUNNING','PAUSED'} and not d.get('worker_error')
          assert z.get('enabled') is True and int(z.get('rollout_percent') or 0)==10
          assert t5.get('enabled') is True
          assert int(pap.get('shards') or 0)==144
          print('T6_REQUIRES_T5_PLUS_PAPILLON144=PASS')
          PY
            STAGE="/tmp/brotoculateur-t6-stage-$$"
            rm -rf "$STAGE"; mkdir -p "$STAGE/src"
            cp -a "$PKG" "$STAGE/src/brotoculateur"
            python3 /tmp/patch_brotoculateur_t6_papillon.py "$STAGE"
            test "$(sha256sum "$STAGE/src/brotoculateur/papillon_engine.py"|awk '{print $1}')" = "$POST_PAP"
            test "$(sha256sum "$STAGE/src/brotoculateur/t5_independence.py"|awk '{print $1}')" = "$POST_T5"
            test "$(sha256sum "$STAGE/src/brotoculateur/t6_papillon.py"|awk '{print $1}')" = "$POST_T6"
            test "$(sha256sum "$STAGE/src/brotoculateur/orchestrator.py"|awk '{print $1}')" = "$POST_ORCH"
            test "$(sha256sum "$STAGE/src/brotoculateur/dashboard.py"|awk '{print $1}')" = "$POST_DASH"
            PYTHONPATH="$STAGE/src" python3 /tmp/test_t6_papillon.py
            echo 'T6_EXACT_LIVE_STAGE=PASS'
          else
            test "$source_state" = 'POST_T6'
          fi

          WAS_RUNNING=$(python3 - <<'PY'
          import json
          print('1' if json.load(open('/tmp/t6-before.json',encoding='utf-8')).get('state')=='RUNNING' else '0')
          PY
          )
          if [ "$WAS_RUNNING" = 1 ]; then
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/save >/tmp/t6-save.json
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/pause >/tmp/t6-pause.json
          fi
          curl -fsS --max-time 5 "$STATUS_URL" >/tmp/t6-paused.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/t6-paused.json',encoding='utf-8')).get('state')=='PAUSED'
          print('T6_PAUSE_VERIFY=PASS')
          PY

          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP="$BROTO_ROOT/backups/t6-$STAMP"
          mkdir -p "$BACKUP"
          cp -a "$PAP" "$T5MOD" "$ORCH" "$DASH" "$BACKUP/"
          [ ! -f "$T6MOD" ] || cp -a "$T6MOD" "$BACKUP/"
          cp -a /tmp/t6-before.json "$BACKUP/status-before.json"
          DROPIN_DIR="$HOME/.config/systemd/user/brotoculateur.service.d"
          DROPIN="$DROPIN_DIR/96-brutus-t6.conf"
          mkdir -p "$DROPIN_DIR"
          HAD_DROPIN=0; [ ! -f "$DROPIN" ] || { HAD_DROPIN=1; cp -a "$DROPIN" "$BACKUP/96-brutus-t6.conf"; }
          HAD_T6=0; [ ! -f "$T6MOD" ] || HAD_T6=1
          echo "T6_BACKUP=$BACKUP"

          rollback() {
            rc=$?; set +e; echo "T6_ROLLBACK_BEGIN rc=$rc"
            cp -a "$BACKUP/papillon_engine.py" "$PAP"
            cp -a "$BACKUP/t5_independence.py" "$T5MOD"
            cp -a "$BACKUP/orchestrator.py" "$ORCH"
            cp -a "$BACKUP/dashboard.py" "$DASH"
            if [ "$HAD_T6" = 1 ]; then cp -a "$BACKUP/t6_papillon.py" "$T6MOD"; else rm -f "$T6MOD"; fi
            if [ "$HAD_DROPIN" = 1 ]; then cp -a "$BACKUP/96-brutus-t6.conf" "$DROPIN"; else rm -f "$DROPIN"; fi
            systemctl --user daemon-reload
            systemctl --user restart brotoculateur.service
            sleep 2
            if [ "$WAS_RUNNING" = 1 ]; then curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/start >/tmp/t6-rollback-start.json || true; fi
            echo 'T6_ROLLBACK_DONE'; exit "$rc"
          }
          trap rollback ERR

          if [ "$MODE" = canary_start ]; then
            cp -a "$STAGE/src/brotoculateur/papillon_engine.py" "$PAP"
            cp -a "$STAGE/src/brotoculateur/t5_independence.py" "$T5MOD"
            cp -a "$STAGE/src/brotoculateur/t6_papillon.py" "$T6MOD"
            cp -a "$STAGE/src/brotoculateur/orchestrator.py" "$ORCH"
            cp -a "$STAGE/src/brotoculateur/dashboard.py" "$DASH"
            cat > "$DROPIN" <<'EOF'
          [Service]
          Environment="BROTO_T6_ENABLED=1"
          EOF
          else
            cat > "$DROPIN" <<'EOF'
          [Service]
          Environment="BROTO_T6_ENABLED=0"
          EOF
          fi

          systemctl --user daemon-reload
          systemctl --user restart brotoculateur.service
          ok=0
          for _ in $(seq 1 20); do
            if systemctl --user is-active --quiet brotoculateur.service && curl -fsS --max-time 2 "$STATUS_URL" >/tmp/t6-after.json; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

          MODE="$MODE" python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/t6-after.json',encoding='utf-8'))
          t5=d.get('t5_independence') or {}; t6=d.get('t6_papillon') or {}; pap=d.get('papillon') or {}
          assert not d.get('worker_error'), d.get('worker_error')
          assert t5.get('enabled') is True and int(pap.get('shards') or 0)==144
          if os.environ['MODE']=='canary_start':
              assert t6.get('mode')=='BRUTUS_T6_PAPILLON_AFFINITY_V1' and t6.get('enabled') is True
              assert t6.get('authority')=='SHADOW_ONLY'
              assert int(t6.get('actual_papillon_routes_applied') or 0)==0
              assert t6.get('papillon_cache_mutated') is False and t6.get('controls_papillon') is False
          else:
              assert t6.get('enabled') is False
          print('T6_DEPLOY_VERIFY=PASS')
          PY

          if [ "$MODE" = canary_start ] || [ "$WAS_RUNNING" = 1 ]; then
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/start >/tmp/t6-start.json
            live=0
            for _ in $(seq 1 30); do
              curl -fsS --max-time 2 "$STATUS_URL" >/tmp/t6-live.json || true
              if MODE="$MODE" python3 - <<'PY'
          import json,os,sys
          try: d=json.load(open('/tmp/t6-live.json',encoding='utf-8'))
          except Exception: sys.exit(1)
          t5=d.get('t5_independence') or {}; t6=d.get('t6_papillon') or {}; pap=d.get('papillon') or {}
          good=d.get('state')=='RUNNING' and not d.get('worker_error')
          if os.environ.get('MODE')=='canary_start':
              n=int(t6.get('observations') or 0)
              good=good and n>0 and n==int(t5.get('observations') or 0)
              good=good and int(t6.get('shard_count') or 0)==144 and int(pap.get('shards') or 0)==144
              good=good and int(t6.get('actual_papillon_routes_applied') or 0)==0
          sys.exit(0 if good else 1)
          PY
              then live=1; break; fi
              sleep 1
            done
            test "$live" = 1
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t6-live.json',encoding='utf-8'))
          t5=d.get('t5_independence') or {}; t6=d.get('t6_papillon') or {}; pap=d.get('papillon') or {}
          print('T6_LIVE_STATE='+str(d.get('state')))
          print('T6_LIVE_PROCESSED='+str(d.get('processed_packets')))
          print('T6_LIVE_CRYSTALS='+str((d.get('brutomagique') or {}).get('total_crystals')))
          print('T6_LIVE_T5='+str(t5.get('observations')))
          print('T6_LIVE_OBSERVATIONS='+str(t6.get('observations')))
          print('T6_LIVE_SHARDS_TOUCHED='+str(t6.get('shards_touched')))
          print('T6_LIVE_CANDIDATE_SHARDS='+str(t6.get('candidate_shards')))
          print('T6_LIVE_AFFINITY='+str(t6.get('affinity_counts')))
          print('T6_LIVE_PAPILLON_EVALUATIONS='+str(pap.get('evaluations')))
          print('T6_LIVE_ROUTES_APPLIED='+str(t6.get('actual_papillon_routes_applied')))
          print('T6_LIVE_VERIFY=PASS')
          PY
          fi

          if [ "$MODE" = canary_start ]; then
            test "$(sha256sum "$PAP"|awk '{print $1}')" = "$POST_PAP"
            test "$(sha256sum "$T5MOD"|awk '{print $1}')" = "$POST_T5"
            test "$(sha256sum "$T6MOD"|awk '{print $1}')" = "$POST_T6"
            test "$(sha256sum "$ORCH"|awk '{print $1}')" = "$POST_ORCH"
            test "$(sha256sum "$DASH"|awk '{print $1}')" = "$POST_DASH"
          fi
          df -P / | awk 'NR==2 {print "T6_ROOT_DISK_USED=" $5 " T6_ROOT_DISK_FREE_KB=" $4}'
          trap - ERR
          rm -rf "${STAGE:-}"
          echo 'T6_WORKFLOW=PASS'
          REMOTE