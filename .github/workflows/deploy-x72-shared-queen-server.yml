name: Deploy X72 Shared Queen Server

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-X72-SHARED-QUEEN to install the shared Queen server'
        required: true
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: x72-shared-queen-server-deploy
  cancel-in-progress: false

jobs:
  deploy-x72-shared-queen:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY-X72-SHARED-QUEEN'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REMOTE_STAGE: /tmp/antmux-x72-shared-queen-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Validate deployment payload
        run: |
          set -euo pipefail
          python3 -m py_compile \
            deploy/x72-shared-queen/app/server.py \
            deploy/x72-shared-queen/tests/run_server_tests.py
          node --check deploy/x72-shared-queen/frontend/app.js
          test -f deploy/x72-shared-queen/app/__init__.py

      - name: Assemble deployment payload
        run: |
          set -euo pipefail
          rm -rf _x72_shared_queen_deploy
          mkdir -p _x72_shared_queen_deploy
          cp -a deploy/x72-shared-queen/. _x72_shared_queen_deploy/
          (
            cd _x72_shared_queen_deploy
            find . -type f -not -name agent.md -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          if [ "$actual_public_key" != "$expected_public_key" ]; then
            echo 'ANTMUX_VPS_SSH_PRIVATE_KEY does not match the pinned deployment identity.' >&2
            exit 1
          fi

          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment payload
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_USER:-}"
          echo "::add-mask::$VPS_HOST"
          echo "::add-mask::$VPS_USER"

          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" \
            "rm -rf '${REMOTE_STAGE}' && mkdir -p '${REMOTE_STAGE}'"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -r _x72_shared_queen_deploy/. \
            "$VPS_USER@$VPS_HOST:${REMOTE_STAGE}/"

      - name: Install and test shared Queen server on VPS
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          echo "::add-mask::$VPS_HOST"
          echo "::add-mask::$VPS_USER"

          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE' 2>&1 | tee deploy-x72-shared-queen.log
          set -euo pipefail

          section() {
            printf '\n===== %s =====\n' "$1"
          }

          require_cmd() {
            command -v "$1" >/dev/null 2>&1 || {
              printf 'MISSING_COMMAND=%s\n' "$1"
              exit 1
            }
          }

          APP_ROOT="$HOME/antmux-x72-queen"
          TARGET_ROOT="/var/www/antmux.com/public_html/laboratoire/embryon-x72"
          REMOTE_STAGE='${{ env.REMOTE_STAGE }}'
          BACKUP_ROOT="$HOME/antmux-x72-queen-backups/$(date -u +%Y%m%d-%H%M%S)-${{ github.sha }}"
          REPORT_PATH="$APP_ROOT/data/ANTMUX_X72_SERVER_SHARED_QUEEN_TEST_REPORT.json"
          SERVICE_NAME="antmux-x72-queen.service"
          TEMP_PID=""

          cleanup_temp() {
            if [ -n "${TEMP_PID:-}" ] && kill -0 "$TEMP_PID" >/dev/null 2>&1; then
              kill "$TEMP_PID" >/dev/null 2>&1 || true
              wait "$TEMP_PID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_temp EXIT

          section "preflight"
          test "$(hostname)" = "server1.antmux.com"
          test "$(id -un)" = "rob"
          require_cmd python3
          require_cmd ss
          require_cmd curl
          if ss -ltn | awk '{print $4}' | grep -Eq '(^|:)8720$'; then
            printf 'PORT_8720_BUSY=true\n'
            exit 1
          fi
          test -d "$TARGET_ROOT"
          test -w "$TARGET_ROOT"
          test -d "$REMOTE_STAGE"
          cd "$REMOTE_STAGE"
          sha256sum -c SHA256SUMS

          section "read accessible nginx text only"
          if [ -d /etc/nginx ]; then
            find /etc/nginx -type f \( -name '*.conf' -o -name 'default' -o -name '*.inc' \) -readable -print0 2>/dev/null \
              | xargs -0 grep -HnE 'antmux\.com|embryon-x72|server_name|proxy_pass|location' 2>/dev/null || true
          fi

          section "backup"
          mkdir -p "$BACKUP_ROOT/frontend"
          cp -a "$TARGET_ROOT/." "$BACKUP_ROOT/frontend/"
          printf 'BACKUP_ROOT=%s\n' "$BACKUP_ROOT"

          section "install application files"
          install -d -m 0755 "$APP_ROOT/app" "$APP_ROOT/data" "$APP_ROOT/snapshots" "$APP_ROOT/logs"
          install -m 0644 "$REMOTE_STAGE/app/__init__.py" "$APP_ROOT/app/__init__.py"
          install -m 0644 "$REMOTE_STAGE/app/server.py" "$APP_ROOT/app/server.py"
          install -m 0644 "$REMOTE_STAGE/tests/run_server_tests.py" "$APP_ROOT/run_server_tests.py"
          python3 -m venv "$APP_ROOT/venv"
          "$APP_ROOT/venv/bin/python" -m pip install --upgrade pip
          "$APP_ROOT/venv/bin/python" -m pip install fastapi 'uvicorn[standard]' websockets

          section "temporary backend test"
          ANTMUX_X72_DATA_DIR="$APP_ROOT/data" "$APP_ROOT/venv/bin/python" -m uvicorn app.server:app \
            --app-dir "$APP_ROOT" --host 127.0.0.1 --port 8720 \
            > "$APP_ROOT/logs/temp-uvicorn.log" 2>&1 &
          TEMP_PID="$!"
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8720/api/health >/tmp/x72-health.json; then
              break
            fi
            sleep 0.5
          done
          curl --fail --silent --show-error http://127.0.0.1:8720/api/health
          curl --fail --silent --show-error http://127.0.0.1:8720/api/state >/tmp/x72-state.json
          curl --fail --silent --show-error http://127.0.0.1:8720/api/events >/tmp/x72-events.json
          curl --fail --silent --show-error http://127.0.0.1:8720/api/report >/tmp/x72-report.json
          "$APP_ROOT/venv/bin/python" "$APP_ROOT/run_server_tests.py" \
            --base http://127.0.0.1:8720 \
            --report "$REPORT_PATH"

          section "checkpoint restart test"
          TICK_BEFORE="$("$APP_ROOT/venv/bin/python" - <<'PY'
          import json
          print(json.load(open('/tmp/x72-state.json', encoding='utf-8'))['tick_count'])
          PY
          )"
          cleanup_temp
          TEMP_PID=""
          ANTMUX_X72_DATA_DIR="$APP_ROOT/data" "$APP_ROOT/venv/bin/python" -m uvicorn app.server:app \
            --app-dir "$APP_ROOT" --host 127.0.0.1 --port 8720 \
            > "$APP_ROOT/logs/temp-uvicorn-restart.log" 2>&1 &
          TEMP_PID="$!"
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8720/api/state >/tmp/x72-state-after-restart.json; then
              break
            fi
            sleep 0.5
          done
          "$APP_ROOT/venv/bin/python" - "$REPORT_PATH" "$TICK_BEFORE" <<'PY'
          import json, sys
          report_path, tick_before_s = sys.argv[1], sys.argv[2]
          report = json.load(open(report_path, encoding='utf-8'))
          after = json.load(open('/tmp/x72-state-after-restart.json', encoding='utf-8'))
          restored = int(after['tick_count']) >= int(tick_before_s)
          report['persistent_state_restored'] = restored
          report['tests'].append({'name': 'N restart backend', 'ok': restored, 'detail': f"before={tick_before_s} after={after['tick_count']}"})
          report['tests_total'] = len(report['tests'])
          report['tests_passed'] = sum(1 for item in report['tests'] if item['ok'])
          report['tests_failed'] = sum(1 for item in report['tests'] if not item['ok'])
          report['verdict'] = 'PASS' if report['tests_failed'] == 0 else 'FAIL'
          json.dump(report, open(report_path, 'w', encoding='utf-8'), indent=2, sort_keys=True)
          print(f"PERSISTENT_STATE_RESTORED={restored}")
          if not restored:
            raise SystemExit(1)
          PY

          section "privilege check for systemd and nginx"
          if ! sudo -n true >/dev/null 2>&1; then
            printf 'BLOCKER=sudo -n unavailable for systemd/nginx installation\n'
            exit 1
          fi

          section "install systemd service"
          cleanup_temp
          TEMP_PID=""
          SERVICE_FILE="/etc/systemd/system/$SERVICE_NAME"
          sudo -n tee "$SERVICE_FILE" >/dev/null <<EOF
          [Unit]
          Description=ANTMUX X72 Shared Queen Server
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=rob
          WorkingDirectory=$APP_ROOT
          Environment=ANTMUX_X72_DATA_DIR=$APP_ROOT/data
          ExecStart=$APP_ROOT/venv/bin/python -m uvicorn app.server:app --app-dir $APP_ROOT --host 127.0.0.1 --port 8720
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          EOF
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable "$SERVICE_NAME"
          sudo -n systemctl restart "$SERVICE_NAME"
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8720/api/health >/tmp/x72-health-service.json; then
              break
            fi
            sleep 0.5
          done
          curl --fail --silent --show-error http://127.0.0.1:8720/api/health
          sudo -n systemctl --no-pager --full status "$SERVICE_NAME" || true

          section "nginx backup and managed route"
          NGINX_FILE="$(sudo -n grep -RIlE 'server_name[[:space:]].*antmux\.com' /etc/nginx/sites-available /etc/nginx/conf.d 2>/dev/null | head -n 1 || true)"
          if [ -z "$NGINX_FILE" ]; then
            printf 'BLOCKER=nginx antmux.com server block not found\n'
            exit 1
          fi
          mkdir -p "$BACKUP_ROOT/nginx"
          sudo -n cp -a "$NGINX_FILE" "$BACKUP_ROOT/nginx/$(basename "$NGINX_FILE").before-x72-shared-queen"
          sudo -n python3 - "$NGINX_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          marker = "# ANTMUX X72 shared queen API - managed by deploy-x72-shared-queen-server"
          block = f"""
              {marker}
              location /laboratoire/embryon-x72/api/ {{
                  proxy_pass http://127.0.0.1:8720/api/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }}

              location /laboratoire/embryon-x72/ws {{
                  proxy_pass http://127.0.0.1:8720/ws;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_read_timeout 3600;
              }}
          """
          if marker in text:
              raise SystemExit(0)

          starts = []
          index = 0
          while True:
              found = text.find("server", index)
              if found == -1:
                  break
              brace = text.find("{", found)
              if brace != -1 and text[found:brace].strip() == "server":
                  starts.append((found, brace))
              index = found + 6

          for start, brace in starts:
              depth = 0
              end = None
              for pos in range(brace, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          end = pos
                          break
              if end is None:
                  continue
              server_block = text[start:end]
              if "server_name" in server_block and "antmux.com" in server_block:
                  text = text[:end] + block + "\n" + text[end:]
                  path.write_text(text, encoding="utf-8")
                  raise SystemExit(0)
          raise SystemExit("antmux.com server block not found in selected nginx file")
          PY
          sudo -n nginx -t
          sudo -n systemctl reload nginx

          section "deploy frontend server client"
          install -m 0644 "$REMOTE_STAGE/frontend/app.js" "$TARGET_ROOT/app.js"
          python3 - "$TARGET_ROOT/index.html" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          text = text.replace('PORT WEB DU CORE V0.2', 'QUEEN SERVER V0.2 - SHARED')
          text = text.replace('Le navigateur reproduit la dynamique et la visualisation; le fichier Python original et le rapport de test sont publiés à côté pour audit.', 'Le navigateur affiche l etat partage recu du Queen Server; aucun tick local fictif nest genere quand le WebSocket est deconnecte.')
          path.write_text(text, encoding='utf-8')
          PY
          install -m 0644 "$REPORT_PATH" "$TARGET_ROOT/core/ANTMUX_X72_SERVER_SHARED_QUEEN_TEST_REPORT.json"

          section "public verification"
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/embryon-x72/api/health >/tmp/x72-public-health.json
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/embryon-x72/api/state >/tmp/x72-public-state.json
          curl --fail --silent --show-error --location https://antmux.com/laboratoire/embryon-x72/app.js >/tmp/x72-public-app.js
          grep -Fq 'QUEEN_SERVER_V0_2' /tmp/x72-public-app.js

          "$APP_ROOT/venv/bin/python" - "$REPORT_PATH" <<'PY'
          import json, sys
          report_path = sys.argv[1]
          report = json.load(open(report_path, encoding='utf-8'))
          state = json.load(open('/tmp/x72-public-state.json', encoding='utf-8'))
          report['systemd_restart'] = True
          report['public_api'] = True
          report['final_state'] = {
              'tick_count': state['tick_count'],
              'whole_h256': state['whole_h256'],
              'protected_h256': state['protected_h256'],
              'reference_h256': state['reference_h256'],
          }
          report['tests'].append({'name': 'O restauration SQLite', 'ok': bool(report.get('persistent_state_restored')), 'detail': ''})
          report['tests'].append({'name': 'Public API health/state', 'ok': True, 'detail': 'https://antmux.com/laboratoire/embryon-x72/api/'})
          report['tests_total'] = len(report['tests'])
          report['tests_passed'] = sum(1 for item in report['tests'] if item['ok'])
          report['tests_failed'] = sum(1 for item in report['tests'] if not item['ok'])
          report['verdict'] = 'PASS' if report['tests_failed'] == 0 else 'FAIL'
          json.dump(report, open(report_path, 'w', encoding='utf-8'), indent=2, sort_keys=True)
          print(json.dumps({
              'verdict': report['verdict'],
              'tests_total': report['tests_total'],
              'tests_failed': report['tests_failed'],
              'queen_entity_id': report['queen_entity_id'],
              'reference_h256': report['reference_h256'],
              'tick_count': report['final_state']['tick_count'],
          }, sort_keys=True))
          if report['verdict'] != 'PASS':
            raise SystemExit(1)
          PY
          install -m 0644 "$REPORT_PATH" "$TARGET_ROOT/core/ANTMUX_X72_SERVER_SHARED_QUEEN_TEST_REPORT.json"

          section "final paths"
          printf 'APP_ROOT=%s\n' "$APP_ROOT"
          printf 'DB_PATH=%s\n' "$APP_ROOT/data/queen.db"
          printf 'REPORT_PATH=%s\n' "$TARGET_ROOT/core/ANTMUX_X72_SERVER_SHARED_QUEEN_TEST_REPORT.json"
          printf 'BACKUP_ROOT=%s\n' "$BACKUP_ROOT"
          printf 'SERVICE_NAME=%s\n' "$SERVICE_NAME"
          printf 'LOCAL_PORT=127.0.0.1:8720\n'
          REMOTE

      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x72-shared-queen-deploy-log
          path: deploy-x72-shared-queen.log
          if-no-files-found: ignore

