name: Deploy X72 Shared Queen Server

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-X72-SHARED-QUEEN to install the shared Queen server'
        required: true
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: x72-shared-queen-server-deploy
  cancel-in-progress: false

jobs:
  deploy-x72-shared-queen:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY-X72-SHARED-QUEEN'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REMOTE_STAGE: /tmp/antmux-x72-shared-queen-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build vendor and validate on runner
        run: |
          set -euo pipefail
          python3 -m py_compile \
            deploy/x72-shared-queen/app/server.py \
            deploy/x72-shared-queen/tests/run_server_tests.py \
            deploy/x72-shared-queen/tests/check_frontend_authority.py \
            deploy/x72-shared-queen/tests/check_runtime_metrics.py
          node --check deploy/x72-shared-queen/frontend/app.js
          python3 deploy/x72-shared-queen/tests/check_frontend_authority.py

          rm -rf _x72_runner_vendor _x72_runner_data
          python3 -m pip install --target _x72_runner_vendor fastapi 'uvicorn[standard]' websockets
          PYTHONPATH=_x72_runner_vendor python3 - <<'PY'
          import fastapi
          import uvicorn
          import websockets
          print("VENDOR_IMPORT_PASS")
          PY
          PYTHONPATH="$PWD/_x72_runner_vendor" \
          python3 deploy/x72-shared-queen/tests/check_runtime_metrics.py

          ANTMUX_X72_DATA_DIR="$PWD/_x72_runner_data" \
          PYTHONPATH="$PWD/_x72_runner_vendor" \
          python3 -m uvicorn app.server:app \
            --app-dir deploy/x72-shared-queen \
            --host 127.0.0.1 \
            --port 8720 \
            > _x72_runner_uvicorn.log 2>&1 &
          RUNNER_PID="$!"
          cleanup_runner() {
            if kill -0 "$RUNNER_PID" >/dev/null 2>&1; then
              kill "$RUNNER_PID" >/dev/null 2>&1 || true
              wait "$RUNNER_PID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_runner EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8720/api/health >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl --fail --silent --show-error http://127.0.0.1:8720/api/health
          PYTHONPATH="$PWD/_x72_runner_vendor" \
          python3 deploy/x72-shared-queen/tests/run_server_tests.py \
            --base http://127.0.0.1:8720 \
            --report _x72_runner_data/runner-report.json

      - name: Assemble deployment payload
        run: |
          set -euo pipefail
          rm -rf _x72_shared_queen_deploy
          mkdir -p _x72_shared_queen_deploy
          cp -a deploy/x72-shared-queen/app _x72_shared_queen_deploy/
          cp -a deploy/x72-shared-queen/tests _x72_shared_queen_deploy/
          cp -a deploy/x72-shared-queen/frontend _x72_shared_queen_deploy/
          cp -a _x72_runner_vendor _x72_shared_queen_deploy/vendor
          mv _x72_shared_queen_deploy/tests/run_server_tests.py _x72_shared_queen_deploy/run_server_tests.py
          rm -rf _x72_shared_queen_deploy/tests
          (
            cd _x72_shared_queen_deploy
            find . -type f \
              -not -name agent.md \
              -not -name SHA256SUMS \
              -not -name '*.pyc' \
              -not -path '*/__pycache__/*' \
              -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          if [ "$actual_public_key" != "$expected_public_key" ]; then
            echo 'ANTMUX_VPS_SSH_PRIVATE_KEY does not match the pinned deployment identity.' >&2
            exit 1
          fi
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Recover existing Queen service before upload
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_USER:-}"
          echo "::add-mask::$VPS_HOST"
          echo "::add-mask::$VPS_USER"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE'
          set -euo pipefail
          systemctl --user restart antmux-x72-queen.service
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8720/api/health >/tmp/x72-recovery-health.json; then
              cat /tmp/x72-recovery-health.json
              printf '\nRECOVERY_SERVICE=PASS\n'
              exit 0
            fi
            sleep 0.5
          done
          printf 'RECOVERY_SERVICE=FAIL\n' >&2
          exit 1
          REMOTE

      - name: Upload deployment payload
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_USER:-}"
          echo "::add-mask::$VPS_HOST"
          echo "::add-mask::$VPS_USER"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" \
            "rm -rf '${REMOTE_STAGE}' && mkdir -p '${REMOTE_STAGE}'"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -r _x72_shared_queen_deploy/. \
            "$VPS_USER@$VPS_HOST:${REMOTE_STAGE}/"

      - name: Install and test shared Queen server on VPS
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          echo "::add-mask::$VPS_HOST"
          echo "::add-mask::$VPS_USER"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE' 2>&1 | tee deploy-x72-shared-queen.log
          set -euo pipefail

          section() {
            printf '\n===== %s =====\n' "$1"
          }

          APP_ROOT="$HOME/antmux-x72-queen"
          TARGET_ROOT="/var/www/antmux.com/public_html/laboratoire/embryon-x72"
          REMOTE_STAGE='${{ env.REMOTE_STAGE }}'
          BACKUP_ROOT="$HOME/antmux-x72-queen-backups/$(date -u +%Y%m%d-%H%M%S)-${{ github.sha }}"
          REPORT_PATH="$APP_ROOT/data/ANTMUX_X72_SERVER_SHARED_QUEEN_TEST_REPORT.json"
          TEMP_PID=""
          SERVICE_WAS_ACTIVE=0

          cleanup_temp() {
            if [ -n "${TEMP_PID:-}" ] && kill -0 "$TEMP_PID" >/dev/null 2>&1; then
              kill "$TEMP_PID" >/dev/null 2>&1 || true
              wait "$TEMP_PID" >/dev/null 2>&1 || true
            fi
          }

          on_exit() {
            rc=$?
            cleanup_temp
            if [ "$rc" -ne 0 ] && [ "${SERVICE_WAS_ACTIVE:-0}" -eq 1 ]; then
              printf 'DEPLOY_FAILSAFE_RESTART=ATTEMPT\n'
              systemctl --user restart antmux-x72-queen.service >/dev/null 2>&1 || true
            fi
            trap - EXIT
            exit "$rc"
          }
          trap on_exit EXIT

          section "preflight"
          test "$(hostname)" = "server1.antmux.com"
          test "$(id -un)" = "rob"
          command -v python3 >/dev/null
          command -v ss >/dev/null
          command -v curl >/dev/null
          if ss -ltn | awk '{print $4}' | grep -Eq '(^|:)8720$'; then
            if systemctl --user is-active --quiet antmux-x72-queen.service; then
              SERVICE_WAS_ACTIVE=1
              systemctl --user stop antmux-x72-queen.service
              printf 'PORT_8720_EXISTING_USER_SERVICE_STOPPED=PASS\n'
            else
              printf 'PORT_8720=FAIL\n'
              printf 'BLOCKER=PORT_8720_BUSY_UNKNOWN_OWNER\n'
              exit 1
            fi
          fi
          printf 'PORT_8720=PASS\n'
          test -d "$TARGET_ROOT"
          test -w "$TARGET_ROOT"
          test -d "$REMOTE_STAGE"
          cd "$REMOTE_STAGE"
          sha256sum -c SHA256SUMS

          section "read accessible nginx text only"
          if [ -d /etc/nginx ]; then
            find /etc/nginx -type f \( -name '*.conf' -o -name 'default' -o -name '*.inc' \) -readable -print0 2>/dev/null \
              | xargs -0 grep -HnE 'antmux\.com|embryon-x72|server_name|proxy_pass|location' 2>/dev/null || true
          fi

          section "backup"
          mkdir -p "$BACKUP_ROOT/frontend"
          cp -a "$TARGET_ROOT/." "$BACKUP_ROOT/frontend/"
          printf 'BACKUP_ROOT=%s\n' "$BACKUP_ROOT"

          section "install application files and vendor"
          rm -rf "$APP_ROOT/app" "$APP_ROOT/vendor"
          install -d -m 0755 "$APP_ROOT/app" "$APP_ROOT/data" "$APP_ROOT/snapshots" "$APP_ROOT/logs"
          cp -a "$REMOTE_STAGE/app/." "$APP_ROOT/app/"
          cp -a "$REMOTE_STAGE/vendor" "$APP_ROOT/vendor"
          install -m 0644 "$REMOTE_STAGE/run_server_tests.py" "$APP_ROOT/run_server_tests.py"

          section "VPS vendor import"
          cd "$APP_ROOT"
          PYTHONPATH="$APP_ROOT/vendor" python3 - <<'PY'
          import fastapi
          import uvicorn
          import websockets
          print("VPS_VENDOR_IMPORT_PASS")
          PY

          section "temporary backend test"
          ANTMUX_X72_DATA_DIR="$APP_ROOT/data" \
          PYTHONPATH="$APP_ROOT/vendor" \
          python3 -m uvicorn app.server:app \
            --host 127.0.0.1 \
            --port 8720 \
            > "$APP_ROOT/logs/temp-uvicorn.log" 2>&1 &
          TEMP_PID="$!"
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8720/api/health >/tmp/x72-health.json; then
              break
            fi
            sleep 0.5
          done
          curl --fail --silent --show-error http://127.0.0.1:8720/api/health
          curl --fail --silent --show-error http://127.0.0.1:8720/api/state >/tmp/x72-state.json
          curl --fail --silent --show-error http://127.0.0.1:8720/api/events >/tmp/x72-events.json
          curl --fail --silent --show-error http://127.0.0.1:8720/api/report >/tmp/x72-report.json
          printf 'HEALTH_API=PASS\n'
          printf 'STATE_API=PASS\n'

          section "ensure clean baseline before backend tests"
          python3 - <<'PY'
          import json
          import urllib.request

          def get(path):
              with urllib.request.urlopen("http://127.0.0.1:8720" + path, timeout=10) as response:
                  return json.loads(response.read().decode("utf-8"))

          def post(path):
              req = urllib.request.Request(
                  "http://127.0.0.1:8720" + path,
                  data=b"{}",
                  method="POST",
                  headers={"Content-Type": "application/json", "X-Forwarded-For": "10.72.250.250"},
              )
              with urllib.request.urlopen(req, timeout=10) as response:
                  return json.loads(response.read().decode("utf-8"))

          state = get("/api/state")
          if not state.get("integrity_match", False):
              repaired = post("/api/repair")
              report = repaired.get("report", {})
              if report.get("verdict") != "PASS" or not repaired.get("state", {}).get("integrity_match"):
                  raise SystemExit(f"clean baseline repair failed: {repaired}")
              print("CLEAN_BASELINE_REPAIR=PASS")
          else:
              print("CLEAN_BASELINE=PASS")
          PY

          PYTHONPATH="$APP_ROOT/vendor" \
          python3 "$APP_ROOT/run_server_tests.py" \
            --base http://127.0.0.1:8720 \
            --report "$REPORT_PATH"
          printf 'BACKEND_TESTS=PASS\n'

          section "checkpoint restart test"
          sleep 2
          test -f "$APP_ROOT/data/queen.db"
          printf 'SQLITE=PASS\n'
          TICK_BEFORE="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/x72-state.json', encoding='utf-8'))['tick_count'])
          PY
          )"
          cleanup_temp
          TEMP_PID=""
          ANTMUX_X72_DATA_DIR="$APP_ROOT/data" \
          PYTHONPATH="$APP_ROOT/vendor" \
          python3 -m uvicorn app.server:app \
            --host 127.0.0.1 \
            --port 8720 \
            > "$APP_ROOT/logs/temp-uvicorn-restart.log" 2>&1 &
          TEMP_PID="$!"
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8720/api/state >/tmp/x72-state-after-restart.json; then
              break
            fi
            sleep 0.5
          done
          python3 - "$REPORT_PATH" "$TICK_BEFORE" <<'PY'
          import json, sys
          report_path, tick_before_s = sys.argv[1], sys.argv[2]
          report = json.load(open(report_path, encoding='utf-8'))
          after = json.load(open('/tmp/x72-state-after-restart.json', encoding='utf-8'))
          restored = int(after['tick_count']) >= int(tick_before_s)
          report['persistent_state_restored'] = restored
          report['tests'].append({'name': 'checkpoint restore', 'ok': restored, 'detail': f"before={tick_before_s} after={after['tick_count']}"})
          report['tests_total'] = len(report['tests'])
          report['tests_passed'] = sum(1 for item in report['tests'] if item['ok'])
          report['tests_failed'] = sum(1 for item in report['tests'] if not item['ok'])
          report['verdict'] = 'PASS' if report['tests_failed'] == 0 else 'FAIL'
          json.dump(report, open(report_path, 'w', encoding='utf-8'), indent=2, sort_keys=True)
          print(f"CHECKPOINT_RESTORE={'PASS' if restored else 'FAIL'}")
          if not restored:
            raise SystemExit(1)
          PY

          section "prepare user service and nginx snippet"
          cleanup_temp
          TEMP_PID=""
          mkdir -p "$APP_ROOT/prepared"
          cat > "$APP_ROOT/prepared/antmux-x72-queen.service" <<EOF
          [Unit]
          Description=ANTMUX X72 Shared Queen Server
          [Service]
          Type=simple
          WorkingDirectory=$APP_ROOT
          Environment=ANTMUX_X72_DATA_DIR=$APP_ROOT/data
          Environment=PYTHONPATH=$APP_ROOT/vendor
          ExecStart=/usr/bin/python3 -m uvicorn app.server:app --host 127.0.0.1 --port 8720
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=default.target
          EOF
          cat > "$APP_ROOT/prepared/nginx-x72-shared-queen.conf" <<'EOF'
          # ANTMUX X72 shared queen API routes
          location /laboratoire/embryon-x72/api/ {
              proxy_pass http://127.0.0.1:8720/api/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $remote_addr;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          location /laboratoire/embryon-x72/ws {
              proxy_pass http://127.0.0.1:8720/ws;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $remote_addr;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 3600;
          }
          EOF
          printf 'SYSTEMD_PREPARED=%s\n' "$APP_ROOT/prepared/antmux-x72-queen.service"
          printf 'NGINX_SNIPPET_PREPARED=%s\n' "$APP_ROOT/prepared/nginx-x72-shared-queen.conf"

          section "install and verify user service"
          if systemctl --user status >/tmp/x72-systemctl-user-status.txt 2>&1; then
            mkdir -p "$HOME/.config/systemd/user"
            install -m 0644 "$APP_ROOT/prepared/antmux-x72-queen.service" "$HOME/.config/systemd/user/antmux-x72-queen.service"
            systemctl --user daemon-reload
            systemctl --user enable antmux-x72-queen.service
            systemctl --user restart antmux-x72-queen.service
            for _ in $(seq 1 60); do
              if curl --fail --silent --show-error http://127.0.0.1:8720/api/health >/tmp/x72-user-service-health.json; then
                break
              fi
              sleep 0.5
            done
            curl --fail --silent --show-error http://127.0.0.1:8720/api/health
            printf 'SYSTEMD=PASS\n'
          else
            printf 'SYSTEMD=BLOCKED\n'
            printf 'BLOCKER=SYSTEMD_USER_UNAVAILABLE\n'
            exit 1
          fi

          section "exact shared S4 websocket test"
          PYTHONPATH="$APP_ROOT/vendor" python3 - <<'PY'
          import asyncio
          import json
          import urllib.error
          import urllib.request
          import websockets

          BASE = "http://127.0.0.1:8720"
          WS_URL = "ws://127.0.0.1:8720/ws"

          def request_json(path, method="GET", body=None, allowed=(200,), ip="10.72.77.1"):
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(
                  BASE + path,
                  data=data,
                  method=method,
                  headers={"Content-Type": "application/json", "X-Forwarded-For": ip},
              )
              try:
                  with urllib.request.urlopen(req, timeout=10) as response:
                      payload = response.read().decode("utf-8")
                      status = response.status
              except urllib.error.HTTPError as exc:
                  payload = exc.read().decode("utf-8")
                  status = exc.code
              if status not in allowed:
                  raise AssertionError(f"{method} {path} returned {status}: {payload}")
              return json.loads(payload)

          def synapse_faulted(state, synapse_id):
              for synapse in state.get("synapses", []):
                  if synapse.get("synapse_id") == synapse_id:
                      return synapse.get("enabled") is False and synapse.get("integrity") == 0
              raise AssertionError(f"{synapse_id} not found")

          async def recv_until(ws, predicate, label):
              for _ in range(80):
                  message = json.loads(await asyncio.wait_for(ws.recv(), timeout=2))
                  if predicate(message):
                      return message
              raise AssertionError(f"timeout waiting for {label}")

          async def main():
              health = request_json("/api/health")
              if not health.get("ok"):
                  raise AssertionError("health is not ok")
              async with websockets.connect(WS_URL) as first, websockets.connect(WS_URL) as second:
                  await recv_until(first, lambda msg: "tick_count" in msg, "first initial state")
                  await recv_until(second, lambda msg: "tick_count" in msg, "second initial state")
                  fault = request_json("/api/fault", method="POST", body={"synapse_id": "S4"}, ip="10.72.77.4")
                  if not synapse_faulted(fault["state"], "S4"):
                      raise AssertionError("S4 did not enter MISMATCH")
                  def saw_s4_fault(msg):
                      state = msg.get("state", msg) if isinstance(msg, dict) else None
                      return isinstance(state, dict) and synapse_faulted(state, "S4")
                  first_fault = await recv_until(first, saw_s4_fault, "first S4 fault")
                  second_fault = await recv_until(second, saw_s4_fault, "second S4 fault")
                  first_state = first_fault.get("state", first_fault)
                  second_state = second_fault.get("state", second_fault)
                  if first_state["protected_h256"] != second_state["protected_h256"]:
                      raise AssertionError("shared S4 fault hash differs between clients")
                  repaired = request_json("/api/repair", method="POST", body={}, ip="10.72.77.5")
                  if repaired.get("report", {}).get("verdict") != "PASS" or not repaired["state"].get("integrity_match"):
                      raise AssertionError("repair did not restore reference hash")
                  print("FAULT_S4_SHARED=PASS")
                  print("REPAIR_HASH_CLOSE=PASS")

          asyncio.run(main())
          PY

          printf 'NGINX=BLOCKED\n'
          printf 'ROOT_COMMAND_NGINX=merge snippet into antmux.com server block, then nginx -t && systemctl reload nginx\n'

          section "final report summary"
          python3 - "$REPORT_PATH" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          state = report['final_state']
          print(json.dumps({
              'verdict': report['verdict'],
              'tests_total': report['tests_total'],
              'tests_failed': report['tests_failed'],
              'queen_entity_id': report['queen_entity_id'],
              'reference_h256': report['reference_h256'],
              'tick_count': state['tick_count'],
              'protected_h256': state['protected_h256'],
          }, sort_keys=True))
          if report['verdict'] != 'PASS':
              raise SystemExit(1)
          PY
          printf 'APP_ROOT=%s\n' "$APP_ROOT"
          printf 'DB_PATH=%s\n' "$APP_ROOT/data/queen.db"
          printf 'REPORT_PATH=%s\n' "$REPORT_PATH"
          printf 'BACKUP_ROOT=%s\n' "$BACKUP_ROOT"
          printf 'LOCAL_PORT=127.0.0.1:8720\n'
          REMOTE

      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x72-shared-queen-deploy-log
          path: deploy-x72-shared-queen.log
          if-no-files-found: ignore


  hotfix-x72-live:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'HOTFIX-X72-LIVE'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v6

      - name: Validate hotfix payload
        run: |
          set -euo pipefail
          python3 -m py_compile deploy/x72-shared-queen/app/server.py
          node --check laboratoire/embryon-x72/app.js
          cmp -s laboratoire/embryon-x72/app.js deploy/x72-shared-queen/frontend/app.js
          grep -q 'target_hz = 240.0' deploy/x72-shared-queen/app/server.py
          grep -q 'GENERATION_ADVANCED' deploy/x72-shared-queen/app/server.py
          grep -q 'self.tick % 360 == 0' deploy/x72-shared-queen/app/server.py
          printf 'HOTFIX_PAYLOAD_VALID=PASS\n'

      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          test "$actual_public_key" = "$expected_public_key"
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage minimal hotfix
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_USER:-}"
          echo "::add-mask::$VPS_HOST"
          echo "::add-mask::$VPS_USER"
          STAGE="/tmp/x72-hotfix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "rm -rf '$STAGE' && mkdir -p '$STAGE'"
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519             deploy/x72-shared-queen/app/server.py             laboratoire/embryon-x72/app.js             laboratoire/embryon-x72/index.html             "$VPS_USER@$VPS_HOST:$STAGE/"

      - name: Backup, install, reset and verify live Queen
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          echo "::add-mask::$VPS_HOST"
          echo "::add-mask::$VPS_USER"
          STAGE="/tmp/x72-hotfix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "STAGE='$STAGE' bash -se" <<'REMOTE'
          set -euo pipefail
          test "$(hostname)" = "server1.antmux.com"

          APP_ROOT="$HOME/antmux-x72-queen"
          DATA_DIR="$APP_ROOT/data"
          TARGET="/var/www/antmux.com/public_html/laboratoire/embryon-x72"
          BACKUP="$HOME/antmux-x72-queen-backups/hotfix-live-$(date -u +%Y%m%d-%H%M%S)"

          test -f "$STAGE/server.py"
          test -f "$STAGE/app.js"
          test -f "$STAGE/index.html"
          test -d "$APP_ROOT/app"
          test -d "$DATA_DIR"
          test -d "$TARGET"
          mkdir -p "$BACKUP"

          cp -a "$APP_ROOT/app/server.py" "$BACKUP/server.py.before"
          cp -a "$TARGET/app.js" "$BACKUP/app.js.before"
          cp -a "$TARGET/index.html" "$BACKUP/index.html.before"
          for f in "$DATA_DIR"/queen.db "$DATA_DIR"/queen.db-wal "$DATA_DIR"/queen.db-shm; do
            if [ -e "$f" ]; then cp -a "$f" "$BACKUP/"; fi
          done

          rollback() {
            set +e
            systemctl --user stop antmux-x72-queen.service
            cp -a "$BACKUP/server.py.before" "$APP_ROOT/app/server.py"
            cp -a "$BACKUP/app.js.before" "$TARGET/app.js"
            cp -a "$BACKUP/index.html.before" "$TARGET/index.html"
            rm -f "$DATA_DIR/queen.db" "$DATA_DIR/queen.db-wal" "$DATA_DIR/queen.db-shm"
            for f in "$BACKUP"/queen.db "$BACKUP"/queen.db-wal "$BACKUP"/queen.db-shm; do
              [ -e "$f" ] && cp -a "$f" "$DATA_DIR/"
            done
            systemctl --user start antmux-x72-queen.service
          }
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then rollback; fi; exit "$rc"' EXIT

          systemctl --user stop antmux-x72-queen.service
          install -m 0644 "$STAGE/server.py" "$APP_ROOT/app/server.py"
          install -m 0644 "$STAGE/app.js" "$TARGET/app.js"
          install -m 0644 "$STAGE/index.html" "$TARGET/index.html"

          # User-requested clean birth: no prior checkpoints, ticks, events,
          # memory or crystallization survive this reset.
          rm -f "$DATA_DIR/queen.db" "$DATA_DIR/queen.db-wal" "$DATA_DIR/queen.db-shm"

          systemctl --user start antmux-x72-queen.service

          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8720/api/state > "$BACKUP/state-zero.json"; then
              ready=1
              break
            fi
            sleep 0.5
          done
          test "$ready" -eq 1

          sleep 35
          curl --fail --silent --show-error http://127.0.0.1:8720/api/state > "$BACKUP/state-35s.json"

          python3 - "$BACKUP/state-zero.json" "$BACKUP/state-35s.json" <<'PY'
          import json, sys
          zero = json.load(open(sys.argv[1], encoding="utf-8"))
          live = json.load(open(sys.argv[2], encoding="utf-8"))

          summary = {
              "zero": {
                  "tick": zero.get("tick_count"),
                  "generation": zero.get("generation"),
                  "events": zero.get("event_count"),
                  "memory": zero.get("memory_level"),
                  "crystal": zero.get("crystallization_level"),
              },
              "live": {
                  "tick": live.get("tick_count"),
                  "generation": live.get("generation"),
                  "events": live.get("event_count"),
                  "mode": live.get("queen_mode"),
                  "r_exec": live.get("r_exec"),
                  "f_rt": live.get("f_rt"),
                  "memory": live.get("memory_level"),
                  "crystal": live.get("crystallization_level"),
                  "integrity": live.get("integrity_match"),
              },
          }
          print(json.dumps(summary, sort_keys=True))

          if zero.get("generation") != 0:
              raise SystemExit("zero generation failed")
          if int(zero.get("event_count", 999999)) > 4:
              raise SystemExit("zero event history failed")
          if not live.get("integrity_match"):
              raise SystemExit("integrity mismatch")
          if float(live.get("r_exec", 0.0)) < 200.0:
              raise SystemExit("live tick rate below 200/s")
          if float(live.get("f_rt", 0.0)) < 0.85:
              raise SystemExit("simulation remains too slow")
          if int(live.get("generation", 0)) < 1:
              raise SystemExit("generation did not advance")
          if int(live.get("event_count", 0)) <= 2:
              raise SystemExit("event bus did not advance")
          if float(live.get("memory_level", 1.0)) >= 0.95:
              raise SystemExit("memory saturated unexpectedly")
          if float(live.get("crystallization_level", 1.0)) >= 0.95:
              raise SystemExit("crystallization saturated unexpectedly")
          PY

          rm -rf "$STAGE"
          trap - EXIT
          printf 'HOTFIX_X72_LIVE=PASS\n'
          printf 'BACKUP=%s\n' "$BACKUP"
          REMOTE
