name: Probe X72 VPS Python Venv

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROBE-X72-VENV to run the minimal VPS venv probe'
        required: true
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: x72-vps-venv-probe
  cancel-in-progress: false

jobs:
  probe-x72-venv:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'PROBE-X72-VENV'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          if [ "$actual_public_key" != "$expected_public_key" ]; then
            echo 'ANTMUX_VPS_SSH_PRIVATE_KEY does not match the pinned deployment identity.' >&2
            exit 1
          fi

          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Probe venv support on VPS
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_USER:-}"
          echo "::add-mask::$VPS_HOST"
          echo "::add-mask::$VPS_USER"

          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" "bash -se" <<'REMOTE' 2>&1 | tee x72-venv-probe.log
          set -u
          printf 'HOSTNAME=%s\n' "$(hostname)"
          printf 'WHOAMI=%s\n' "$(whoami)"
          rm -rf /tmp/x72-venv-probe /tmp/x72-venv-test
          if python3 -m venv /tmp/x72-venv-probe; then
            /tmp/x72-venv-probe/bin/python --version
            rm -rf /tmp/x72-venv-probe
            python3 -m venv /tmp/x72-venv-test
            /tmp/x72-venv-test/bin/python --version
            rm -rf /tmp/x72-venv-test
            printf 'VENV_PROBE=PASS\n'
            exit 0
          fi

          rm -rf /tmp/x72-venv-probe /tmp/x72-venv-test
          printf 'VENV_PROBE=FAIL\n'
          printf 'BLOCKER=PRIVILEGED_PACKAGE_INSTALL_REQUIRED\n'
          printf 'MINIMAL_COMMAND_1=apt-get update\n'
          printf 'MINIMAL_COMMAND_2=apt-get install -y python3.12-venv\n'
          printf 'MINIMAL_COMMAND_WITH_SUDO_1=sudo apt-get update\n'
          printf 'MINIMAL_COMMAND_WITH_SUDO_2=sudo apt-get install -y python3.12-venv\n'
          exit 1
          REMOTE

      - name: Upload venv probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x72-vps-venv-probe-log
          path: x72-venv-probe.log
          if-no-files-found: ignore

