name: Deploy Antmux Generator

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'generator/**'
      - 'carrou/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check carrou/app.js
          node --check generator/antmux-generator.js
          node --check generator/antmux-cortex.js
          node --check generator/antmux-worker.js
          node --check generator/verifier.js

      - name: Assemble public site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js _site/
          cp -R generator carrou _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
