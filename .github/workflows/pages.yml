name: Deploy Antmux Generator

on:
  push:
    branches: [main]
    paths:
      - 'generator/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript
        run: |
          node --check generator/antmux-generator.js
          node --check generator/antmux-cortex.js
          node --check generator/antmux-worker.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generator only
        uses: actions/upload-pages-artifact@v4
        with:
          path: './generator'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
