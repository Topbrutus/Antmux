name: ASTRA STEP8 GAMEZEL VPS Audit

on:
  push:
    branches:
      - astra/gamezel-control-20261003
    paths:
      - '.github/workflows/astra-step8-vps-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          actual_public_key="$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $1, $2}')"
          expected_public_key='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOsRFrry5A6SRRMPOQDm2an9roU8JmXh2UN5UaaFpnWm'
          test "$actual_public_key" = "$expected_public_key"
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read-only GAMEZEL VPS audit
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -u
          ROOT="$HOME/zelstereos-gamezel"
          echo "MAIN_USER_SERVICE=$(systemctl --user is-active zelstereos-gamezel.service 2>/dev/null || true)"
          for seat in p2 p3 p4; do
            printf '%s_USER_SERVICE=%s\n' "$(printf '%s' "$seat" | tr '[:lower:]' '[:upper:]')" "$(systemctl --user is-active "zelstereos-gamezel-$seat.service" 2>/dev/null || true)"
          done
          if test -d "$ROOT"; then echo 'ROOT=PASS'; else echo 'ROOT=MISS'; fi
          if test -d "$ROOT/.git"; then echo 'GIT_CLONE=PASS'; else echo 'GIT_CLONE=NO'; fi
          for f in server.js verso/codex-player-adapter.js agents/gamezel-autoplayer.mjs agents/antigravity-card-agent.py bin/gamezel-ai-status; do
            if test -f "$ROOT/$f"; then echo "FILE_$f=PASS"; else echo "FILE_$f=MISS"; fi
          done
          for p in "$HOME/.local/bin/codex" "$HOME/.local/bin/muse" "$HOME/.local/bin/grok" /usr/local/bin/muse /usr/local/bin/grok; do
            name="$(basename "$p" | tr '[:lower:]' '[:upper:]')"
            if test -x "$p"; then echo "${name}_PATH=$p"; fi
          done
          if test -x "$HOME/.local/share/gamezel-antigravity-sdk/venv/bin/python"; then echo 'ANTIGRAVITY_PYTHON=PASS'; else echo 'ANTIGRAVITY_PYTHON=MISS'; fi
          if test -x "$ROOT/bin/gamezel-ai-status"; then
            echo 'AI_STATUS_HELPER=PASS'
            "$ROOT/bin/gamezel-ai-status" 2>&1 | sed -E 's#(token|secret|key|password)=.*#\1=REDACTED#Ig' | sed -n '1,40p'
          else
            echo 'AI_STATUS_HELPER=MISS'
          fi
          REMOTE

# turbo-audit-trigger-20261005-0402
