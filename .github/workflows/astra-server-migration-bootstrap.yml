name: ASTRA GAMEZEL VPS Bootstrap

on:
  push:
    branches:
      - astra/gamezel-control-20261003
    paths:
      - '.github/workflows/astra-server-migration-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install dedicated GAMEZEL admin public key
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          KEY='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMhVb7vMrmD1Lmk+MOWQisTqRaA1CMWe/4x7fwrdA4z8 gamezel-admin'
          install -d -m 700 "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          grep -qxF "$KEY" "$HOME/.ssh/authorized_keys" || printf '%s\n' "$KEY" >> "$HOME/.ssh/authorized_keys"
          test "$(grep -cF 'gamezel-admin' "$HOME/.ssh/authorized_keys")" -eq 1
          echo 'GAMEZEL_ADMIN_KEY=PASS'
          echo "MAIN=$(systemctl --user is-active zelstereos-gamezel.service 2>/dev/null || true)"
          echo "P2=$(systemctl --user is-active zelstereos-gamezel-p2.service 2>/dev/null || true)"
          echo "P3=$(systemctl --user is-active zelstereos-gamezel-p3.service 2>/dev/null || true)"
          echo "P4=$(systemctl --user is-active zelstereos-gamezel-p4.service 2>/dev/null || true)"
          REMOTE
