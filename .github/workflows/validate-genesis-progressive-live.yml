name: Genesis progressive LIVE validation

on:
  pull_request:
    paths:
      - 'laboratoire/genesis/live-v2/**'
      - '.github/workflows/deploy-genesis-progressive-live-runtime.yml'
      - '.github/workflows/validate-genesis-progressive-live.yml'
  push:
    branches:
      - genesis/progressive-live-c061-20260903
      - genesis/progressive-live-c067-20260904
      - rob/genesis-c068-progressive-live-20260904
    paths:
      - 'laboratoire/genesis/live-v2/**'
      - '.github/workflows/deploy-genesis-progressive-live-runtime.yml'
      - '.github/workflows/validate-genesis-progressive-live.yml'

permissions:
  contents: read

jobs:
  validate-progressive-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run progressive LIVE adversarial batteries through C081
        run: |
          set -euo pipefail
          node laboratoire/genesis/live-v2/test-progressive-live.mjs
          node laboratoire/genesis/live-v2/test-progressive-live-c067.mjs
          node laboratoire/genesis/live-v2/test-progressive-live-c068.mjs
          node laboratoire/genesis/live-v2/test-progressive-live-c069-c070-signal.mjs
          node laboratoire/genesis/live-v2/test-progressive-live-c071-kernel.mjs
          node laboratoire/genesis/live-v2/test-progressive-live-c072-ingest.mjs
          node laboratoire/genesis/live-v2/test-progressive-live-c073-decode-adapter.mjs
          node laboratoire/genesis/live-v2/test-progressive-live-c074-runtime-transform.mjs
          node laboratoire/genesis/live-v2/test-progressive-live-c081-health.mjs
      - name: Validate sync shell and C060 integration with C081-capable runtime
        run: |
          set -euo pipefail
          bash -n laboratoire/genesis/live/sync-public-read-only.sh
          cat > /tmp/status.env <<'EOF'
          science_baseline=GREEN
          genesis003_c041_c060=COMPLETE_VALIDATED
          experiment_selection_performed=true
          selected_experiment_status=PLANNED_NOT_EXECUTED
          hypothesis_selection_performed=false
          hypothesis_ranking_produced=false
          uncertainty_promotion_performed=false
          probabilities_produced=false
          evidence_ledger_auto_promotion=false
          GENESIS_AUDIT_FAILED=0
          EOF
          GENESIS_PUBLIC_LIVE_ACTIVE=1 node laboratoire/genesis/live-v2/build-public-source-progressive-c081.mjs /tmp/status.env /tmp/input.json
          node laboratoire/genesis/live-v2/bridge-public-progressive-c081.mjs /tmp/input.json
          node laboratoire/genesis/validate-public-v2.mjs .build/genesis-public-read-only-bridge/public-read-only-envelope.json
          echo 'GENESIS_PROGRESSIVE_LIVE_C081_VALIDATION=PASS'
      - name: Smoke-test exact assembled C081 runtime package
        run: |
          set -euo pipefail
          rm -rf /tmp/genesis-c081-package .build/genesis-public-read-only-bridge
          mkdir -p /tmp/genesis-c081-package/runtime/live-v2
          for stage in c067 c068 c069 c070 c071 c072 c073 c074 c081; do
            cp "laboratoire/genesis/live-v2/build-public-source-progressive-${stage}.mjs" "/tmp/genesis-c081-package/runtime/live-v2/build-public-source-progressive-${stage}.mjs"
            cp "laboratoire/genesis/live-v2/bridge-public-progressive-${stage}.mjs" "/tmp/genesis-c081-package/runtime/live-v2/bridge-public-progressive-${stage}.mjs"
          done
          cp laboratoire/genesis/live-v2/build-public-source-progressive-c081.mjs /tmp/genesis-c081-package/runtime/live-v2/build-public-source-progressive.mjs
          cp laboratoire/genesis/live-v2/bridge-public-progressive-c081.mjs /tmp/genesis-c081-package/runtime/live-v2/bridge-public-progressive.mjs
          cp laboratoire/genesis/validate-public-v2.mjs /tmp/genesis-c081-package/runtime/validate-public-v2.mjs
          test -f /tmp/antmux-c081-cli-status.env
          GENESIS_PUBLIC_LIVE_ACTIVE=1 node /tmp/genesis-c081-package/runtime/live-v2/build-public-source-progressive.mjs /tmp/antmux-c081-cli-status.env /tmp/package-input.json
          node /tmp/genesis-c081-package/runtime/live-v2/bridge-public-progressive.mjs /tmp/package-input.json
          node /tmp/genesis-c081-package/runtime/validate-public-v2.mjs .build/genesis-public-read-only-bridge/public-read-only-envelope.json
          for stage in c067 c068 c069 c070 c071 c072 c073 c074 c081; do
            test -f "/tmp/genesis-c081-package/runtime/live-v2/build-public-source-progressive-${stage}.mjs"
            test -f "/tmp/genesis-c081-package/runtime/live-v2/bridge-public-progressive-${stage}.mjs"
          done
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const d=JSON.parse(await readFile('.build/genesis-public-read-only-bridge/public-read-only-envelope.json','utf8'));
          const m=Object.fromEntries(d.payload.metrics.map(x=>[x.id,x.value]));
          if(m['genesis003-validated-through']!=='C081') process.exit(1);
          if(m['c081-status']!=='VALIDATED_MEASURED_INCONCLUSIVE') process.exit(1);
          if(m['c081-firefox-decode-count']!==18) process.exit(1);
          if(m['c081-chrome-decode-count']!==0) process.exit(1);
          if(m['c081-primary-hypothesis-tested']!==false) process.exit(1);
          if(m['c081-prediction-verdict']!=='NONE') process.exit(1);
          if(m['c082-started']!==false) process.exit(1);
          if(m['bridge-write-capability']!=='NONE') process.exit(1);
          NODE
          echo 'GENESIS_PROGRESSIVE_C081_PACKAGE_SMOKE=PASS'
