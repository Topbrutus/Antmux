name: Genesis progressive LIVE validation

on:
  pull_request:
    paths:
      - 'laboratoire/genesis/live-v2/**'
      - '.github/workflows/deploy-genesis-progressive-live-runtime.yml'
      - '.github/workflows/validate-genesis-progressive-live.yml'
  push:
    branches:
      - genesis/progressive-live-c061-20260903
      - genesis/progressive-live-c067-20260904
      - rob/genesis-c068-progressive-live-20260904
      - rob/genesis-c069-progressive-live-20260904
    paths:
      - 'laboratoire/genesis/live-v2/**'
      - '.github/workflows/deploy-genesis-progressive-live-runtime.yml'
      - '.github/workflows/validate-genesis-progressive-live.yml'

permissions:
  contents: read

jobs:
  validate-progressive-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Run progressive LIVE adversarial batteries through C069
        run: |
          set -euo pipefail
          node laboratoire/genesis/live-v2/test-progressive-live.mjs
          node laboratoire/genesis/live-v2/test-progressive-live-c067.mjs
          node laboratoire/genesis/live-v2/test-progressive-live-c068.mjs
          node laboratoire/genesis/live-v2/test-progressive-live-c069.mjs
      - name: Validate sync shell and C060 integration with C069-capable runtime
        run: |
          set -euo pipefail
          bash -n laboratoire/genesis/live/sync-public-read-only.sh
          cat > /tmp/status.env <<'EOF'
          science_baseline=GREEN
          genesis003_c041_c060=COMPLETE_VALIDATED
          experiment_selection_performed=true
          selected_experiment_status=PLANNED_NOT_EXECUTED
          hypothesis_selection_performed=false
          hypothesis_ranking_produced=false
          uncertainty_promotion_performed=false
          probabilities_produced=false
          evidence_ledger_auto_promotion=false
          GENESIS_AUDIT_FAILED=0
          EOF
          GENESIS_PUBLIC_LIVE_ACTIVE=1 node laboratoire/genesis/live-v2/build-public-source-progressive-c069.mjs /tmp/status.env /tmp/input.json
          node laboratoire/genesis/live-v2/bridge-public-progressive-c069.mjs /tmp/input.json
          node laboratoire/genesis/validate-public-v2.mjs .build/genesis-public-read-only-bridge/public-read-only-envelope.json
          echo 'GENESIS_PROGRESSIVE_LIVE_C069_VALIDATION=PASS'
      - name: Smoke-test exact assembled C069 runtime package
        run: |
          set -euo pipefail
          rm -rf /tmp/genesis-c069-package .build/genesis-public-read-only-bridge
          mkdir -p /tmp/genesis-c069-package/runtime/live-v2
          cp laboratoire/genesis/live-v2/build-public-source-progressive-c067.mjs /tmp/genesis-c069-package/runtime/live-v2/build-public-source-progressive-c067.mjs
          cp laboratoire/genesis/live-v2/bridge-public-progressive-c067.mjs /tmp/genesis-c069-package/runtime/live-v2/bridge-public-progressive-c067.mjs
          cp laboratoire/genesis/live-v2/build-public-source-progressive-c068.mjs /tmp/genesis-c069-package/runtime/live-v2/build-public-source-progressive-c068.mjs
          cp laboratoire/genesis/live-v2/bridge-public-progressive-c068.mjs /tmp/genesis-c069-package/runtime/live-v2/bridge-public-progressive-c068.mjs
          cp laboratoire/genesis/live-v2/build-public-source-progressive-c069.mjs /tmp/genesis-c069-package/runtime/live-v2/build-public-source-progressive-c069.mjs
          cp laboratoire/genesis/live-v2/bridge-public-progressive-c069.mjs /tmp/genesis-c069-package/runtime/live-v2/bridge-public-progressive-c069.mjs
          cp laboratoire/genesis/live-v2/build-public-source-progressive-c069.mjs /tmp/genesis-c069-package/runtime/live-v2/build-public-source-progressive.mjs
          cp laboratoire/genesis/live-v2/bridge-public-progressive-c069.mjs /tmp/genesis-c069-package/runtime/live-v2/bridge-public-progressive.mjs
          cp laboratoire/genesis/validate-public-v2.mjs /tmp/genesis-c069-package/runtime/validate-public-v2.mjs
          cat > /tmp/package-status.env <<'EOF'
          science_baseline=GREEN
          genesis003_c041_c060=COMPLETE_VALIDATED
          experiment_selection_performed=true
          selected_experiment_status=PLANNED_NOT_EXECUTED
          hypothesis_selection_performed=false
          hypothesis_ranking_produced=false
          uncertainty_promotion_performed=false
          probabilities_produced=false
          evidence_ledger_auto_promotion=false
          GENESIS_AUDIT_FAILED=0
          EOF
          GENESIS_PUBLIC_LIVE_ACTIVE=1 node /tmp/genesis-c069-package/runtime/live-v2/build-public-source-progressive.mjs /tmp/package-status.env /tmp/package-input.json
          node /tmp/genesis-c069-package/runtime/live-v2/bridge-public-progressive.mjs /tmp/package-input.json
          node /tmp/genesis-c069-package/runtime/validate-public-v2.mjs .build/genesis-public-read-only-bridge/public-read-only-envelope.json
          test -f /tmp/genesis-c069-package/runtime/live-v2/build-public-source-progressive-c067.mjs
          test -f /tmp/genesis-c069-package/runtime/live-v2/bridge-public-progressive-c067.mjs
          test -f /tmp/genesis-c069-package/runtime/live-v2/build-public-source-progressive-c068.mjs
          test -f /tmp/genesis-c069-package/runtime/live-v2/bridge-public-progressive-c068.mjs
          test -f /tmp/genesis-c069-package/runtime/live-v2/build-public-source-progressive-c069.mjs
          test -f /tmp/genesis-c069-package/runtime/live-v2/bridge-public-progressive-c069.mjs
          echo 'GENESIS_PROGRESSIVE_C069_PACKAGE_SMOKE=PASS'
