name: Deploy Brotoculateur T1 Family VPS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit, start T1 family shadow, or disable T1
        required: true
        default: audit
        type: choice
        options:
          - audit
          - canary_start
          - disable
      confirm:
        description: Type BRUTUS-T1-VPS for canary_start or disable
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: brotoculateur-t1-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate request and T1 tools
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$MODE" in audit|canary_start|disable) ;; *) exit 2 ;; esac
          if [ "$MODE" != audit ]; then test "$CONFIRM" = 'BRUTUS-T1-VPS'; fi
          python3 -m py_compile \
            deploy/vps-t1/t1_family.py \
            deploy/vps-t1/patch_brotoculateur_t1_family.py \
            deploy/vps-t1/test_t1_family.py

      - name: Configure pinned VPS SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage T1 tools
        if: inputs.mode == 'canary_start'
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy/vps-t1/t1_family.py \
            deploy/vps-t1/patch_brotoculateur_t1_family.py \
            deploy/vps-t1/test_t1_family.py \
            "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Audit or deploy T1
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "MODE='$MODE' bash -se" <<'REMOTE'
          set -euo pipefail
          BROTO_ROOT="$HOME/brotoculateur"
          PKG="$BROTO_ROOT/src/brotoculateur"
          ORCH="$PKG/orchestrator.py"
          DASH="$PKG/dashboard.py"
          C6MOD="$PKG/c6_provenance.py"
          C7MOD="$PKG/c7_router.py"
          T1MOD="$PKG/t1_family.py"
          STATUS_URL='http://127.0.0.1:8781/api/status'

          EXPECT_C6='81a24a088817274e423688b3133ca3b7d568b1790fb8a7df2ccb37c31aaeeefd'
          EXPECT_C7='9290fd8db6a34b0df3e94ad0281963ee3b7c5531fa955eb946e1aa10675c30f6'
          PRE_ORCH='e22f0f8dc54765243f2e62a20c2dc841efa6d6bb860a3f0b48fa8f67b7cfb7ee'
          PRE_DASH='a146aa18a5ff01c82a879e8810a9a58b359709dd469cb1aa94c571c44224ab6e'
          POST_ORCH='453c06a2064e743e08a042ced8dc7406492ab323c664dea16b1f6de1aaa9f526'
          POST_DASH='c54737bfa9213d1625f8134a7588ee37a99712b44e7aa37a2246743c5c344355'
          POST_T1='e68643e72c4c0551b3d7187fde05f5d3a37c45b7e5f0d30cd750869378a32320'

          test -f "$ORCH" -a -f "$DASH" -a -f "$C6MOD" -a -f "$C7MOD"
          systemctl --user is-active --quiet brotoculateur.service
          curl -fsS --max-time 5 "$STATUS_URL" >/tmp/t1-before.json

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t1-before.json',encoding='utf-8'))
          c2=d.get('c2_fingerprint') or {}; c3=d.get('c3_library') or {}; c4=d.get('c4_novelty') or {}; c5=d.get('c5_rarity') or {}; c6=d.get('c6_provenance') or {}; c7=d.get('c7_router') or {}; t1=d.get('t1_family') or {}
          print('STATE='+str(d.get('state')))
          print('RUN_ID='+str(d.get('run_id')))
          print('PROCESSED='+str(d.get('processed_packets')))
          print('CRYSTALS='+str((d.get('brutomagique') or {}).get('total_crystals')))
          print('C2_TOTAL='+str(c2.get('total_fingerprints')))
          print('C3_OBSERVATIONS='+str(c3.get('observations')))
          print('C4_OBSERVATIONS='+str(c4.get('observations')))
          print('C5_OBSERVATIONS='+str(c5.get('observations')))
          print('C6_OBSERVATIONS='+str(c6.get('observations')))
          print('C7_OBSERVATIONS='+str(c7.get('observations')))
          print('T1_MODE='+str(t1.get('mode')))
          print('T1_ENABLED='+str(t1.get('enabled')))
          print('T1_OBSERVATIONS='+str(t1.get('observations')))
          print('T1_FAMILIES='+str(t1.get('family_counts')))
          PY

          orch_hash=$(sha256sum "$ORCH"|awk '{print $1}')
          dash_hash=$(sha256sum "$DASH"|awk '{print $1}')
          c6_hash=$(sha256sum "$C6MOD"|awk '{print $1}')
          c7_hash=$(sha256sum "$C7MOD"|awk '{print $1}')
          if [ -f "$T1MOD" ]; then t1_hash=$(sha256sum "$T1MOD"|awk '{print $1}'); else t1_hash='ABSENT'; fi
          test "$c6_hash" = "$EXPECT_C6"
          test "$c7_hash" = "$EXPECT_C7"
          source_state='UNKNOWN'
          if [ "$orch_hash" = "$PRE_ORCH" ] && [ "$dash_hash" = "$PRE_DASH" ] && [ "$t1_hash" = 'ABSENT' ]; then source_state='PRE_T1'; fi
          if [ "$orch_hash" = "$POST_ORCH" ] && [ "$dash_hash" = "$POST_DASH" ] && [ "$t1_hash" = "$POST_T1" ]; then source_state='POST_T1'; fi
          test "$source_state" != 'UNKNOWN'
          echo "T1_SOURCE_STATE=$source_state"
          df -P / | awk 'NR==2 {print "ROOT_DISK_USED=" $5 " ROOT_DISK_FREE_KB=" $4}'

          if [ "$MODE" = audit ]; then
            SOURCE_STATE="$source_state" python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/t1-before.json',encoding='utf-8'))
          c2=d.get('c2_fingerprint') or {}; c3=d.get('c3_library') or {}; c4=d.get('c4_novelty') or {}; c5=d.get('c5_rarity') or {}; c6=d.get('c6_provenance') or {}; c7=d.get('c7_router') or {}; t1=d.get('t1_family') or {}
          assert not d.get('worker_error'), d.get('worker_error')
          n=int(c2.get('total_fingerprints') or 0)
          assert n==int(c3.get('observations') or 0)==int(c4.get('observations') or 0)==int(c5.get('observations') or 0)==int(c6.get('observations') or 0)==int(c7.get('observations') or 0)
          if os.environ['SOURCE_STATE']=='POST_T1' and t1.get('enabled') is True:
              assert n==int(t1.get('observations') or 0)
              assert sum(int(v) for v in (t1.get('family_counts') or {}).values())==n
              assert t1.get('authority')=='SHADOW_ONLY'
              assert t1.get('scientific_taxonomy_claim') is False
              assert t1.get('controls_routing') is False and t1.get('controls_scheduling') is False
              assert int(t1.get('actual_routes_applied',-1))==0 and int(t1.get('compute_skips',-1))==0
              assert t1.get('proof_promotion') is False
          print('T1_AUDIT_ONLY=PASS')
          PY
            exit 0
          fi

          if [ "$MODE" = canary_start ]; then
            test "$source_state" = 'PRE_T1'
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t1-before.json',encoding='utf-8'))
          z=d.get('brutus_cortex') or {}; c2=d.get('c2_fingerprint') or {}; c3=d.get('c3_library') or {}; c4=d.get('c4_novelty') or {}; c5=d.get('c5_rarity') or {}; c6=d.get('c6_provenance') or {}; c7=d.get('c7_router') or {}
          assert d.get('state') in {'RUNNING','PAUSED'} and not d.get('worker_error')
          assert z.get('enabled') is True and int(z.get('rollout_percent') or 0)==10
          assert all(x.get('enabled') is True for x in (c2,c3,c4,c5,c6,c7))
          n=int(c2.get('total_fingerprints') or 0)
          assert n==int(c3.get('observations') or 0)==int(c4.get('observations') or 0)==int(c5.get('observations') or 0)==int(c6.get('observations') or 0)==int(c7.get('observations') or 0)
          assert c7.get('authority')=='SHADOW_ONLY' and c7.get('controls_scheduling') is False and int(c7.get('actual_routes_applied',-1))==0
          print('T1_REQUIRES_C7_C6_C5_C4_C3_C2_Z10=PASS')
          PY

            STAGE="/tmp/brotoculateur-t1-stage-$$"
            rm -rf "$STAGE"; mkdir -p "$STAGE/src"
            cp -a "$PKG" "$STAGE/src/brotoculateur"
            python3 /tmp/patch_brotoculateur_t1_family.py "$STAGE"
            test "$(sha256sum "$STAGE/src/brotoculateur/orchestrator.py"|awk '{print $1}')" = "$POST_ORCH"
            test "$(sha256sum "$STAGE/src/brotoculateur/dashboard.py"|awk '{print $1}')" = "$POST_DASH"
            test "$(sha256sum "$STAGE/src/brotoculateur/c7_router.py"|awk '{print $1}')" = "$EXPECT_C7"
            test "$(sha256sum "$STAGE/src/brotoculateur/t1_family.py"|awk '{print $1}')" = "$POST_T1"
            PYTHONPATH="$STAGE/src" python3 /tmp/test_t1_family.py
            echo 'T1_EXACT_LIVE_STAGE=PASS'
          else
            test "$source_state" = 'POST_T1'
          fi

          WAS_RUNNING=$(python3 - <<'PY'
          import json
          print('1' if json.load(open('/tmp/t1-before.json',encoding='utf-8')).get('state')=='RUNNING' else '0')
          PY
          )
          if [ "$WAS_RUNNING" = 1 ]; then
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/save >/tmp/t1-save.json
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/pause >/tmp/t1-pause.json
          fi
          curl -fsS --max-time 5 "$STATUS_URL" >/tmp/t1-paused.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t1-paused.json',encoding='utf-8'))
          assert d.get('state')=='PAUSED', d.get('state')
          print('T1_PAUSE_VERIFY=PASS')
          PY

          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP="$BROTO_ROOT/backups/t1-$STAMP"
          mkdir -p "$BACKUP"
          cp -a "$ORCH" "$DASH" "$BACKUP/"
          [ ! -f "$T1MOD" ] || cp -a "$T1MOD" "$BACKUP/"
          cp -a /tmp/t1-before.json "$BACKUP/status-before.json"
          DROPIN_DIR="$HOME/.config/systemd/user/brotoculateur.service.d"
          DROPIN="$DROPIN_DIR/81-brutus-t1.conf"
          mkdir -p "$DROPIN_DIR"
          HAD_DROPIN=0; [ ! -f "$DROPIN" ] || { HAD_DROPIN=1; cp -a "$DROPIN" "$BACKUP/81-brutus-t1.conf"; }
          HAD_T1=0; [ ! -f "$T1MOD" ] || HAD_T1=1
          echo "T1_BACKUP=$BACKUP"

          rollback() {
            rc=$?; set +e; echo "T1_ROLLBACK_BEGIN rc=$rc"
            cp -a "$BACKUP/orchestrator.py" "$ORCH"
            cp -a "$BACKUP/dashboard.py" "$DASH"
            if [ "$HAD_T1" = 1 ]; then cp -a "$BACKUP/t1_family.py" "$T1MOD"; else rm -f "$T1MOD"; fi
            if [ "$HAD_DROPIN" = 1 ]; then cp -a "$BACKUP/81-brutus-t1.conf" "$DROPIN"; else rm -f "$DROPIN"; fi
            systemctl --user daemon-reload
            systemctl --user restart brotoculateur.service
            sleep 2
            if [ "$WAS_RUNNING" = 1 ]; then curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/start >/tmp/t1-rollback-start.json || true; fi
            echo 'T1_ROLLBACK_DONE'; exit "$rc"
          }
          trap rollback ERR

          if [ "$MODE" = canary_start ]; then
            cp -a "$STAGE/src/brotoculateur/orchestrator.py" "$ORCH"
            cp -a "$STAGE/src/brotoculateur/dashboard.py" "$DASH"
            cp -a "$STAGE/src/brotoculateur/t1_family.py" "$T1MOD"
            cat > "$DROPIN" <<'EOF'
          [Service]
          Environment="BROTO_T1_ENABLED=1"
          EOF
          else
            cat > "$DROPIN" <<'EOF'
          [Service]
          Environment="BROTO_T1_ENABLED=0"
          EOF
          fi

          systemctl --user daemon-reload
          systemctl --user restart brotoculateur.service
          ok=0
          for _ in $(seq 1 20); do
            if systemctl --user is-active --quiet brotoculateur.service && curl -fsS --max-time 2 "$STATUS_URL" >/tmp/t1-after.json; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

          MODE="$MODE" python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/t1-after.json',encoding='utf-8'))
          c7=d.get('c7_router') or {}; t1=d.get('t1_family') or {}
          assert not d.get('worker_error'), d.get('worker_error')
          assert c7.get('enabled') is True
          if os.environ['MODE']=='canary_start':
              assert t1.get('mode')=='BRUTUS_T1_FAMILY_V1' and t1.get('enabled') is True
              assert t1.get('authority')=='SHADOW_ONLY'
              assert t1.get('scientific_taxonomy_claim') is False
              assert t1.get('controls_routing') is False and t1.get('controls_scheduling') is False
              assert int(t1.get('actual_routes_applied',-1))==0 and int(t1.get('compute_skips',-1))==0
              assert t1.get('proof_promotion') is False
          else:
              assert t1.get('enabled') is False
          print('T1_DEPLOY_VERIFY=PASS')
          PY

          if [ "$MODE" = canary_start ] || [ "$WAS_RUNNING" = 1 ]; then
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/start >/tmp/t1-start.json
            live=0
            for _ in $(seq 1 30); do
              curl -fsS --max-time 2 "$STATUS_URL" >/tmp/t1-live.json || true
              if MODE="$MODE" python3 - <<'PY'
          import json,os,sys
          try: d=json.load(open('/tmp/t1-live.json',encoding='utf-8'))
          except Exception: sys.exit(1)
          c7=d.get('c7_router') or {}; t1=d.get('t1_family') or {}
          good=d.get('state')=='RUNNING' and not d.get('worker_error')
          if os.environ.get('MODE')=='canary_start':
              n=int(t1.get('observations') or 0)
              good=good and n>0 and n==int(c7.get('observations') or 0)
              good=good and sum(int(v) for v in (t1.get('family_counts') or {}).values())==n
              good=good and int(t1.get('actual_routes_applied',-1))==0 and t1.get('controls_routing') is False
          sys.exit(0 if good else 1)
          PY
              then live=1; break; fi
              sleep 1
            done
            test "$live" = 1
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t1-live.json',encoding='utf-8'))
          c2=d.get('c2_fingerprint') or {}; c3=d.get('c3_library') or {}; c4=d.get('c4_novelty') or {}; c5=d.get('c5_rarity') or {}; c6=d.get('c6_provenance') or {}; c7=d.get('c7_router') or {}; t1=d.get('t1_family') or {}
          print('T1_LIVE_STATE='+str(d.get('state')))
          print('T1_LIVE_PROCESSED='+str(d.get('processed_packets')))
          print('T1_LIVE_CRYSTALS='+str((d.get('brutomagique') or {}).get('total_crystals')))
          print('T1_LIVE_C2='+str(c2.get('total_fingerprints')))
          print('T1_LIVE_C3='+str(c3.get('observations')))
          print('T1_LIVE_C4='+str(c4.get('observations')))
          print('T1_LIVE_C5='+str(c5.get('observations')))
          print('T1_LIVE_C6='+str(c6.get('observations')))
          print('T1_LIVE_C7='+str(c7.get('observations')))
          print('T1_LIVE_OBSERVATIONS='+str(t1.get('observations')))
          print('T1_LIVE_FAMILIES='+str(t1.get('family_counts')))
          print('T1_LIVE_MIXED='+str(t1.get('mixed_lineage_observations')))
          print('T1_LIVE_ACTUAL_ROUTES='+str(t1.get('actual_routes_applied')))
          print('T1_LIVE_VERIFY=PASS')
          PY
          fi

          if [ "$MODE" = canary_start ]; then
            test "$(sha256sum "$ORCH"|awk '{print $1}')" = "$POST_ORCH"
            test "$(sha256sum "$DASH"|awk '{print $1}')" = "$POST_DASH"
            test "$(sha256sum "$C7MOD"|awk '{print $1}')" = "$EXPECT_C7"
            test "$(sha256sum "$T1MOD"|awk '{print $1}')" = "$POST_T1"
          fi
          df -P / | awk 'NR==2 {print "T1_ROOT_DISK_USED=" $5 " T1_ROOT_DISK_FREE_KB=" $4}'
          trap - ERR
          rm -rf "${STAGE:-}"
          echo 'T1_WORKFLOW=PASS'
          REMOTE

