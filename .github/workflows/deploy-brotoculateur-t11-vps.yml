name: Deploy Brotoculateur T11 Budget VPS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit, start T11 budget shadow, or disable T11
        required: true
        default: audit
        type: choice
        options: [audit, canary_start, disable]
      confirm:
        description: Type BRUTUS-T11-VPS for canary_start or disable
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: brotoculateur-t11-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate request and T11 tools
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$MODE" in audit|canary_start|disable) ;; *) exit 2 ;; esac
          if [ "$MODE" != audit ]; then test "$CONFIRM" = 'BRUTUS-T11-VPS'; fi
          python3 -m py_compile \
            deploy/vps-t11/t11_budget.py \
            deploy/vps-t11/patch_brotoculateur_t11_budget.py \
            deploy/vps-t11/test_t11_budget.py

      - name: Configure pinned VPS SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage T11 tools
        if: inputs.mode == 'canary_start'
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy/vps-t11/t11_budget.py \
            deploy/vps-t11/patch_brotoculateur_t11_budget.py \
            deploy/vps-t11/test_t11_budget.py \
            "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Audit or deploy T11
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "MODE='$MODE' bash -se" <<'REMOTE'
          set -euo pipefail
          BROTO_ROOT="$HOME/brotoculateur"
          PKG="$BROTO_ROOT/src/brotoculateur"
          PAP="$PKG/papillon_engine.py"
          T6MOD="$PKG/t6_papillon.py"
          T7MOD="$PKG/t7_calculation.py"
          T8MOD="$PKG/t8_countertest.py"
          T9MOD="$PKG/t9_stability.py"
          T10MOD="$PKG/t10_replay.py"
          T11MOD="$PKG/t11_budget.py"
          ORCH="$PKG/orchestrator.py"
          DASH="$PKG/dashboard.py"
          STATUS_URL='http://127.0.0.1:8781/api/status'

          EXPECT_PAP='87045c18db95871f4cc9521bdfae1c7c4175dcf0a09ef33a8f7e35c5879fa50a'
          EXPECT_T6='6c58c96cd46de6f10851e443b5882ffdd2c505c82f907b325cae250e1ffd0792'
          EXPECT_T7='5d6ce094a5b9238994182d56b1740555633f4c49983a40e4abceb0a7495303fd'
          EXPECT_T8='a93bd6cd9aaaf0fe832604de9e390e6d69de7dfb8b853e558d8c9955761cce9e'
          EXPECT_T9='c0e0309dfe6d571c1d786010f72bc6f8bf3ccdada1f5fa960ab6f428e3640dd1'
          EXPECT_T10='9fe9b3bbb9a42c790d02e2d85638b2ea11e067750dc1cc5c6812b2c42f40a3be'
          EXPECT_T11='559824ead9ed8f824955e10cbe4d3826da4eb4673a43a64125cf46e01985221d'
          EXPECT_ORCH='cf4978cb315f817abf2283f41630c322a80ccbb94c75662eac8b4a87c7a05d63'
          PRE_DASH='8b97522a6210f0c6ec2feaa1a3786bd00ffda5362aed9feee2c1966768bd61d4'

          test -f "$PAP" -a -f "$T6MOD" -a -f "$T7MOD" -a -f "$T8MOD" -a -f "$T9MOD" -a -f "$T10MOD" -a -f "$ORCH" -a -f "$DASH"
          systemctl --user is-active --quiet brotoculateur.service
          curl -fsS --max-time 5 "$STATUS_URL" >/tmp/t11-before.json

          pap_hash=$(sha256sum "$PAP"|awk '{print $1}')
          t6_hash=$(sha256sum "$T6MOD"|awk '{print $1}')
          t7_hash=$(sha256sum "$T7MOD"|awk '{print $1}')
          t8_hash=$(sha256sum "$T8MOD"|awk '{print $1}')
          t9_hash=$(sha256sum "$T9MOD"|awk '{print $1}')
          t10_hash=$(sha256sum "$T10MOD"|awk '{print $1}')
          orch_hash=$(sha256sum "$ORCH"|awk '{print $1}')
          dash_hash=$(sha256sum "$DASH"|awk '{print $1}')
          if [ -f "$T11MOD" ]; then t11_hash=$(sha256sum "$T11MOD"|awk '{print $1}'); else t11_hash='ABSENT'; fi

          test "$pap_hash" = "$EXPECT_PAP"
          test "$t6_hash" = "$EXPECT_T6"
          test "$t7_hash" = "$EXPECT_T7"
          test "$t8_hash" = "$EXPECT_T8"
          test "$t9_hash" = "$EXPECT_T9"
          test "$t10_hash" = "$EXPECT_T10"
          test "$orch_hash" = "$EXPECT_ORCH"

          source_state='UNKNOWN'
          if [ "$dash_hash" = "$PRE_DASH" ] && [ "$t11_hash" = 'ABSENT' ]; then
            source_state='PRE_T11'
          elif [ "$t11_hash" = "$EXPECT_T11" ]; then
            if python3 - "$DASH" <<'PY'
          import sys
          text=open(sys.argv[1],encoding='utf-8').read()
          markers=[
              'from .t11_budget import T11BudgetTelemetry',
              'self.t11_budget = T11BudgetTelemetry()',
              't10_outcome = self.t10_replay.observe(formula_id, source, out, t8_outcome, t9_outcome)',
              'self.t11_budget.observe(formula_id, source, out, t10_outcome)',
              '"t11_budget": self.t11_budget.status(),',
          ]
          assert all(text.count(m) >= 1 for m in markers)
          assert text.count('from .t11_budget import T11BudgetTelemetry') == 1
          assert text.count('"t11_budget": self.t11_budget.status(),') == 1
          PY
            then source_state='POST_T11'; fi
          fi
          test "$source_state" != 'UNKNOWN'
          echo "T11_SOURCE_STATE=$source_state"
          echo "T11_DASHBOARD_SHA256=$dash_hash"
          echo "T11_MODULE_SHA256=$t11_hash"

          SOURCE_STATE="$source_state" python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/t11-before.json',encoding='utf-8'))
          t8=d.get('t8_countertest') or {}
          t9=d.get('t9_stability') or {}
          t10=d.get('t10_replay') or {}
          t11=d.get('t11_budget') or {}
          bm=d.get('brutomagique') or {}
          print('STATE='+str(d.get('state')))
          print('PROCESSED='+str(d.get('processed_packets')))
          print('CRYSTALS='+str(bm.get('total_crystals')))
          print('T8_OBSERVATIONS='+str(t8.get('observations')))
          print('T8_FAIL='+str(t8.get('failed')))
          print('T8_LIMITED='+str(t8.get('limited')))
          print('T9_OBSERVATIONS='+str(t9.get('observations')))
          print('T9_DRIFTS='+str(t9.get('drifts')))
          print('T10_OBSERVATIONS='+str(t10.get('observations')))
          print('T10_ELIGIBLE='+str(t10.get('eligible_observations')))
          print('T10_MERIT_TOTAL='+str(t10.get('current_replay_merit_total')))
          print('T11_MODE='+str(t11.get('mode')))
          print('T11_ENABLED='+str(t11.get('enabled')))
          print('T11_OBSERVATIONS='+str(t11.get('observations')))
          print('T11_DEMAND_TOTAL='+str(t11.get('demand_total')))
          print('T11_ADVISED_TOTAL='+str(t11.get('advised_total')))
          print('T11_CLIPPED_TOTAL='+str(t11.get('clipped_total')))
          assert not d.get('worker_error'), d.get('worker_error')
          assert t8.get('enabled') is True and t8.get('authority') == 'SHADOW_ONLY'
          assert int(t8.get('failed') or 0) == 0 and int(t8.get('limited') or 0) == 0
          assert t9.get('enabled') is True and t9.get('authority') == 'SHADOW_ONLY'
          assert int(t9.get('drifts') or 0) == 0
          assert int(t9.get('observations') or 0) == int(t8.get('observations') or 0)
          assert t10.get('enabled') is True and t10.get('authority') == 'SHADOW_ONLY'
          assert t10.get('executes_replay') is False and t10.get('schedules_replay') is False
          assert int(t10.get('blocked_t8_fail') or 0) == 0
          assert int(t10.get('blocked_t8_limited') or 0) == 0
          assert int(t10.get('blocked_t9_drift') or 0) == 0
          assert int(t10.get('observations') or 0) == int(t9.get('observations') or 0)
          if os.environ['SOURCE_STATE']=='POST_T11' and t11.get('enabled') is True:
              assert t11.get('authority')=='SHADOW_ONLY'
              assert t11.get('source_of_truth')=='T10_REPLAY_OUTCOME_CALLBACK'
              assert t11.get('slot_units')=='NORMALIZED_REPLAY_POLICY_SLOTS'
              assert t11.get('physical_calibration') is False
              assert t11.get('physical_units_claimed') is False
              assert t11.get('execution_eligible') is False
              assert t11.get('reserves_resources') is False
              assert t11.get('executes_replay') is False
              assert t11.get('schedules_replay') is False
              assert t11.get('candidate_advisory_only') is True
              assert t11.get('t12_candidate_input') is True
              assert t11.get('scientific_proof_claim') is False
              assert t11.get('controls_calculation') is False
              assert int(t11.get('compute_skips') or 0) == 0
              assert t11.get('proof_promotion') is False
              assert t11.get('slot_caps') == {'cpu':8,'memory':8,'storage':8,'time':8}
              assert int(t11.get('normalized_capacity') or 0) == 8
              assert int(t11.get('observations') or 0) == int(t10.get('observations') or 0)
              assert int(t11.get('blocked_t10_other') or 0) == 0
              assert int(t11.get('demand_total') or 0) == int(t11.get('advised_total') or 0)
              assert int(t11.get('clipped_total') or 0) == 0
          print('T11_AUDIT_ONLY=PASS')
          PY
          df -P / | awk 'NR==2 {print "ROOT_DISK_USED=" $5 " ROOT_DISK_FREE_KB=" $4}'

          if [ "$MODE" = audit ]; then exit 0; fi

          if [ "$MODE" = canary_start ]; then
            test "$source_state" = 'PRE_T11'
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t11-before.json',encoding='utf-8'))
          t8=d.get('t8_countertest') or {}
          t9=d.get('t9_stability') or {}
          t10=d.get('t10_replay') or {}
          assert d.get('state') in {'RUNNING','PAUSED'} and not d.get('worker_error')
          assert t8.get('enabled') is True and int(t8.get('failed') or 0)==0 and int(t8.get('limited') or 0)==0
          assert t9.get('enabled') is True and int(t9.get('drifts') or 0)==0
          assert t10.get('enabled') is True and t10.get('authority')=='SHADOW_ONLY'
          assert t10.get('executes_replay') is False and t10.get('controls_budget') is False
          print('T11_REQUIRES_T8_T9_T10=PASS')
          PY

            STAGE="/tmp/brotoculateur-t11-stage-$$"
            rm -rf "$STAGE"; mkdir -p "$STAGE/src"
            cp -a "$PKG" "$STAGE/src/brotoculateur"
            python3 /tmp/patch_brotoculateur_t11_budget.py "$STAGE"
            test "$(sha256sum "$STAGE/src/brotoculateur/t8_countertest.py"|awk '{print $1}')" = "$EXPECT_T8"
            test "$(sha256sum "$STAGE/src/brotoculateur/t9_stability.py"|awk '{print $1}')" = "$EXPECT_T9"
            test "$(sha256sum "$STAGE/src/brotoculateur/t10_replay.py"|awk '{print $1}')" = "$EXPECT_T10"
            test "$(sha256sum "$STAGE/src/brotoculateur/t11_budget.py"|awk '{print $1}')" = "$EXPECT_T11"
            python3 -m py_compile \
              "$STAGE/src/brotoculateur/dashboard.py" \
              "$STAGE/src/brotoculateur/t8_countertest.py" \
              "$STAGE/src/brotoculateur/t9_stability.py" \
              "$STAGE/src/brotoculateur/t10_replay.py" \
              "$STAGE/src/brotoculateur/t11_budget.py"
            PYTHONPATH="$STAGE/src" \
              BROTO_T8_ENABLED=1 BROTO_T9_ENABLED=1 BROTO_T10_ENABLED=1 BROTO_T11_ENABLED=1 \
              BROTO_T11_CPU_SLOTS=8 BROTO_T11_MEMORY_SLOTS=8 BROTO_T11_STORAGE_SLOTS=8 BROTO_T11_TIME_SLOTS=8 \
              python3 /tmp/test_t11_budget.py
            STAGE_DASH_SHA=$(sha256sum "$STAGE/src/brotoculateur/dashboard.py"|awk '{print $1}')
            echo "T11_STAGE_DASHBOARD_SHA256=$STAGE_DASH_SHA"
            echo 'T11_EXACT_LIVE_STAGE=PASS'
          else
            test "$source_state" = 'POST_T11'
          fi

          WAS_RUNNING=$(python3 - <<'PY'
          import json
          print('1' if json.load(open('/tmp/t11-before.json',encoding='utf-8')).get('state')=='RUNNING' else '0')
          PY
          )
          if [ "$WAS_RUNNING" = 1 ]; then
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/save >/tmp/t11-save.json
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/pause >/tmp/t11-pause.json
          fi
          curl -fsS --max-time 5 "$STATUS_URL" >/tmp/t11-paused.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/t11-paused.json',encoding='utf-8')).get('state')=='PAUSED'
          print('T11_PAUSE_VERIFY=PASS')
          PY

          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP="$BROTO_ROOT/backups/t11-$STAMP"
          mkdir -p "$BACKUP"
          cp -a "$DASH" "$BACKUP/"
          cp -a "$T8MOD" "$BACKUP/"
          cp -a "$T9MOD" "$BACKUP/"
          cp -a "$T10MOD" "$BACKUP/"
          [ ! -f "$T11MOD" ] || cp -a "$T11MOD" "$BACKUP/"
          cp -a /tmp/t11-before.json "$BACKUP/status-before.json"
          DROPIN_DIR="$HOME/.config/systemd/user/brotoculateur.service.d"
          DROPIN="$DROPIN_DIR/99-brutus-t11.conf"
          mkdir -p "$DROPIN_DIR"
          HAD_DROPIN=0; [ ! -f "$DROPIN" ] || { HAD_DROPIN=1; cp -a "$DROPIN" "$BACKUP/99-brutus-t11.conf"; }
          HAD_T11=0; [ ! -f "$T11MOD" ] || HAD_T11=1
          echo "T11_BACKUP=$BACKUP"

          rollback() {
            rc=$?; set +e; echo "T11_ROLLBACK_BEGIN rc=$rc"
            cp -a "$BACKUP/dashboard.py" "$DASH"
            cp -a "$BACKUP/t8_countertest.py" "$T8MOD"
            cp -a "$BACKUP/t9_stability.py" "$T9MOD"
            cp -a "$BACKUP/t10_replay.py" "$T10MOD"
            if [ "$HAD_T11" = 1 ]; then cp -a "$BACKUP/t11_budget.py" "$T11MOD"; else rm -f "$T11MOD"; fi
            if [ "$HAD_DROPIN" = 1 ]; then cp -a "$BACKUP/99-brutus-t11.conf" "$DROPIN"; else rm -f "$DROPIN"; fi
            systemctl --user daemon-reload
            systemctl --user restart brotoculateur.service
            sleep 2
            if [ "$WAS_RUNNING" = 1 ]; then
              curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/start >/tmp/t11-rollback-start.json || true
            fi
            echo 'T11_ROLLBACK_DONE'
            exit "$rc"
          }
          trap rollback ERR

          if [ "$MODE" = canary_start ]; then
            cp -a "$STAGE/src/brotoculateur/dashboard.py" "$DASH"
            cp -a "$STAGE/src/brotoculateur/t11_budget.py" "$T11MOD"
            cat > "$DROPIN" <<'EOF'
          [Service]
          Environment="BROTO_T11_ENABLED=1"
          Environment="BROTO_T11_CPU_SLOTS=8"
          Environment="BROTO_T11_MEMORY_SLOTS=8"
          Environment="BROTO_T11_STORAGE_SLOTS=8"
          Environment="BROTO_T11_TIME_SLOTS=8"
          EOF
          else
            cat > "$DROPIN" <<'EOF'
          [Service]
          Environment="BROTO_T11_ENABLED=0"
          EOF
          fi

          systemctl --user daemon-reload
          systemctl --user restart brotoculateur.service
          ok=0
          for _ in $(seq 1 20); do
            if systemctl --user is-active --quiet brotoculateur.service && curl -fsS --max-time 2 "$STATUS_URL" >/tmp/t11-after.json; then
              ok=1; break
            fi
            sleep 1
          done
          test "$ok" = 1

          MODE="$MODE" python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/t11-after.json',encoding='utf-8'))
          t8=d.get('t8_countertest') or {}
          t9=d.get('t9_stability') or {}
          t10=d.get('t10_replay') or {}
          t11=d.get('t11_budget') or {}
          assert not d.get('worker_error'), d.get('worker_error')
          assert t8.get('enabled') is True and t8.get('authority')=='SHADOW_ONLY'
          assert t9.get('enabled') is True and t9.get('authority')=='SHADOW_ONLY'
          assert t10.get('enabled') is True and t10.get('authority')=='SHADOW_ONLY'
          if os.environ['MODE']=='canary_start':
              assert t11.get('mode')=='BRUTUS_T11_BUDGET_V1'
              assert t11.get('enabled') is True
              assert t11.get('authority')=='SHADOW_ONLY'
              assert t11.get('slot_caps') == {'cpu':8,'memory':8,'storage':8,'time':8}
              assert t11.get('physical_calibration') is False
              assert t11.get('execution_eligible') is False
              assert t11.get('reserves_resources') is False
              assert t11.get('executes_replay') is False
              assert t11.get('candidate_advisory_only') is True
              assert t11.get('proof_promotion') is False
          else:
              assert t11.get('enabled') is False
          print('T11_DEPLOY_VERIFY=PASS')
          PY

          if [ "$MODE" = canary_start ] || [ "$WAS_RUNNING" = 1 ]; then
            BASE_T10=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t11-after.json',encoding='utf-8'))
          print(int((d.get('t10_replay') or {}).get('observations') or 0))
          PY
            )
            BASE_T11=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/t11-after.json',encoding='utf-8'))
          print(int((d.get('t11_budget') or {}).get('observations') or 0))
          PY
            )
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/start >/tmp/t11-start.json
            live=0
            for _ in $(seq 1 30); do
              curl -fsS --max-time 2 "$STATUS_URL" >/tmp/t11-live.json || true
              if BASE_T10="$BASE_T10" BASE_T11="$BASE_T11" MODE="$MODE" python3 - <<'PY'
          import json, os, sys
          try:
              d=json.load(open('/tmp/t11-live.json',encoding='utf-8'))
          except Exception:
              sys.exit(1)
          t8=d.get('t8_countertest') or {}
          t9=d.get('t9_stability') or {}
          t10=d.get('t10_replay') or {}
          t11=d.get('t11_budget') or {}
          good=d.get('state')=='RUNNING' and not d.get('worker_error')
          if os.environ.get('MODE')=='canary_start':
              dt10=int(t10.get('observations') or 0)-int(os.environ['BASE_T10'])
              dt11=int(t11.get('observations') or 0)-int(os.environ['BASE_T11'])
              good=good and dt11>0 and dt11==dt10
              good=good and int(t8.get('failed') or 0)==0 and int(t8.get('limited') or 0)==0
              good=good and int(t9.get('drifts') or 0)==0
              good=good and int(t10.get('blocked_t8_fail') or 0)==0
              good=good and int(t10.get('blocked_t8_limited') or 0)==0
              good=good and int(t10.get('blocked_t9_drift') or 0)==0
              good=good and int(t11.get('blocked_t10_other') or 0)==0
              good=good and int(t11.get('eligible_observations') or 0)>0
              good=good and int(t11.get('demand_total') or 0)>0
              good=good and int(t11.get('demand_total') or 0)==int(t11.get('advised_total') or 0)
              good=good and int(t11.get('clipped_total') or 0)==0
          sys.exit(0 if good else 1)
          PY
              then live=1; break; fi
              sleep 1
            done
            test "$live" = 1

            BASE_T10="$BASE_T10" BASE_T11="$BASE_T11" python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/t11-live.json',encoding='utf-8'))
          t10=d.get('t10_replay') or {}
          t11=d.get('t11_budget') or {}
          dt10=int(t10.get('observations') or 0)-int(os.environ['BASE_T10'])
          dt11=int(t11.get('observations') or 0)-int(os.environ['BASE_T11'])
          print('T11_LIVE_STATE='+str(d.get('state')))
          print('T11_LIVE_PROCESSED='+str(d.get('processed_packets')))
          print('T11_LIVE_T10_OBSERVATIONS='+str(t10.get('observations')))
          print('T11_LIVE_OBSERVATIONS='+str(t11.get('observations')))
          print('T11_LIVE_ELIGIBLE='+str(t11.get('eligible_observations')))
          print('T11_LIVE_DEMAND_TOTAL='+str(t11.get('demand_total')))
          print('T11_LIVE_ADVISED_TOTAL='+str(t11.get('advised_total')))
          print('T11_LIVE_CLIPPED_TOTAL='+str(t11.get('clipped_total')))
          print('T11_LIVE_SLOT_CAPS='+str(t11.get('slot_caps')))
          print('T11_LIVE_DELTA_T10='+str(dt10))
          print('T11_LIVE_DELTA_T11='+str(dt11))
          print('T11_LIVE_VERIFY=PASS')
          PY
          fi

          if [ "$MODE" = canary_start ]; then
            test "$(sha256sum "$DASH"|awk '{print $1}')" = "$STAGE_DASH_SHA"
            test "$(sha256sum "$T8MOD"|awk '{print $1}')" = "$EXPECT_T8"
            test "$(sha256sum "$T9MOD"|awk '{print $1}')" = "$EXPECT_T9"
            test "$(sha256sum "$T10MOD"|awk '{print $1}')" = "$EXPECT_T10"
            test "$(sha256sum "$T11MOD"|awk '{print $1}')" = "$EXPECT_T11"
            echo "T11_POST_DASHBOARD_SHA256=$STAGE_DASH_SHA"
          fi

          df -P / | awk 'NR==2 {print "T11_ROOT_DISK_USED=" $5 " T11_ROOT_DISK_FREE_KB=" $4}'
          trap - ERR
          rm -rf "${STAGE:-}"
          echo 'T11_WORKFLOW=PASS'
          REMOTE
