name: ASTRA GAMEZEL Runtime Preflight 2026-10-05

on:
  push:
    branches: [astra/gamezel-runtime-sync-20261005]
    paths:
      - '.github/workflows/astra-gamezel-runtime-sync-20261005.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure pinned SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read GAMEZEL runtime layout only
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          echo "::add-mask::$VPS_HOST"
          echo "::add-mask::$VPS_USER"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -u
          ROOT="$HOME/zelstereos-gamezel"
          echo "PREFLIGHT_HOST=$(hostname)"
          echo "PREFLIGHT_USER=$(id -un)"
          if [ -d "$ROOT" ]; then echo "ROOT_EXISTS=YES"; else echo "ROOT_EXISTS=NO"; fi
          if [ -d "$ROOT/.git" ]; then
            echo "ROOT_GIT=YES"
            echo "ROOT_HEAD=$(git -C "$ROOT" rev-parse HEAD 2>/dev/null || echo UNKNOWN)"
            echo "ROOT_BRANCH=$(git -C "$ROOT" rev-parse --abbrev-ref HEAD 2>/dev/null || echo UNKNOWN)"
            if git -C "$ROOT" remote get-url origin >/dev/null 2>&1; then echo "ROOT_ORIGIN=CONFIGURED"; else echo "ROOT_ORIGIN=MISSING"; fi
          else
            echo "ROOT_GIT=NO"
          fi
          if [ -f "$ROOT/server.js" ]; then
            echo "SERVER_JS=YES"
            if grep -q 'publishTrouDeCulSpeech' "$ROOT/server.js"; then echo "SERVER_TDC_SPEECH=YES"; else echo "SERVER_TDC_SPEECH=NO"; fi
          else
            echo "SERVER_JS=NO"
          fi
          if [ -f "$ROOT/verso/trou-de-cul-engine.js" ]; then echo "TDC_ENGINE=YES"; else echo "TDC_ENGINE=NO"; fi
          for unit in zelstereos-gamezel.service zelstereos-gamezel-p2.service zelstereos-gamezel-p3.service zelstereos-gamezel-p4.service; do
            active="$(systemctl --user is-active "$unit" 2>/dev/null || true)"
            enabled="$(systemctl --user is-enabled "$unit" 2>/dev/null || true)"
            echo "UNIT=$unit ACTIVE=$active ENABLED=$enabled"
          done
          code="$(curl -sS -o /tmp/tdc-preflight.json -w '%{http_code}' --max-time 3 http://127.0.0.1:3217/api/public/gamezel/trou-de-cul/spectator 2>/dev/null || true)"
          echo "LOCAL_TDC_HTTP=$code"
          if command -v git >/dev/null 2>&1; then echo "GIT_BIN=YES"; else echo "GIT_BIN=NO"; fi
          echo "PREFLIGHT=PASS"
          REMOTE
