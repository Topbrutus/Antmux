name: ASTRA GAMEZEL Private Source Probe 2026-10-05

on:
  push:
    branches: [astra/gamezel-runtime-sync-20261005]
    paths:
      - '.github/workflows/astra-gamezel-runtime-sync-20261005.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure pinned SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_HOST ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Probe private canonical repository access from VPS
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          echo "::add-mask::$VPS_HOST"
          echo "::add-mask::$VPS_USER"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -u
          export GIT_TERMINAL_PROMPT=0
          if command -v gh >/dev/null 2>&1; then
            echo "GH_BIN=YES"
            if timeout 10 gh auth status >/dev/null 2>&1; then echo "GH_AUTH=YES"; else echo "GH_AUTH=NO"; fi
          else
            echo "GH_BIN=NO"
          fi
          if timeout 12 git ls-remote git@github.com:Topbrutus/zelstereos.git HEAD >/dev/null 2>&1; then
            echo "GITHUB_SSH_PRIVATE_ZEL=YES"
          else
            echo "GITHUB_SSH_PRIVATE_ZEL=NO"
          fi
          if timeout 12 git ls-remote https://github.com/Topbrutus/zelstereos.git HEAD >/dev/null 2>&1; then
            echo "GITHUB_HTTPS_PRIVATE_ZEL=YES"
          else
            echo "GITHUB_HTTPS_PRIVATE_ZEL=NO"
          fi
          echo "SOURCE_PROBE=PASS"
          REMOTE
