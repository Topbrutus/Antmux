name: Deploy Brotoculateur C6 Provenance VPS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Audit, start C6 on the existing C5/C4/C3/Z canary, or disable C6
        required: true
        default: audit
        type: choice
        options:
          - audit
          - canary_start
          - disable
      confirm:
        description: Type BRUTUS-C6-VPS for canary_start or disable
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: brotoculateur-c6-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate request and C6 tools
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$MODE" in audit|canary_start|disable) ;; *) exit 2 ;; esac
          if [ "$MODE" != audit ]; then test "$CONFIRM" = 'BRUTUS-C6-VPS'; fi
          python3 -m py_compile \
            deploy/vps-c6/c6_provenance.py \
            deploy/vps-c6/patch_brotoculateur_c6_provenance.py \
            deploy/vps-c6/test_c6_provenance.py

      - name: Configure pinned VPS SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANTMUX_VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '203.161.50.201 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICjyMojRJzylRZhOfOtCqsSD957UoglTVwIalfMBxnG' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stage C6 tools
        if: inputs.mode == 'canary_start'
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy/vps-c6/c6_provenance.py \
            deploy/vps-c6/patch_brotoculateur_c6_provenance.py \
            deploy/vps-c6/test_c6_provenance.py \
            "$VPS_USER@$VPS_HOST:/tmp/"

      - name: Audit or deploy C6
        env:
          VPS_HOST: ${{ secrets.ANTMUX_VPS_HOST }}
          VPS_USER: ${{ secrets.ANTMUX_VPS_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "MODE='$MODE' bash -se" <<'REMOTE'
          set -euo pipefail
          BROTO_ROOT="$HOME/brotoculateur"
          PKG="$BROTO_ROOT/src/brotoculateur"
          ENGINE="$PKG/engine.py"
          ORCH="$PKG/orchestrator.py"
          DASH="$PKG/dashboard.py"
          SLEEP="$PKG/sleeping_pool.py"
          C3MOD="$PKG/c3_library.py"
          C4MOD="$PKG/c4_novelty.py"
          C5MOD="$PKG/c5_rarity.py"
          C6MOD="$PKG/c6_provenance.py"
          STATUS_URL='http://127.0.0.1:8781/api/status'

          EXPECT_ENGINE='ac956512699ab0bb527449e08fdaeafab9c883eea3565c4abc5d8e4fcc9ac31b'
          EXPECT_SLEEP='1fe651ff70e4cad7afc8ec216cbad5f361ff839c072408dcc0233e0a0c637124'
          EXPECT_C3='b7970583e688488d0f9fd8a90838d9163d00b08b7e6afedd499434e79a06c434'
          EXPECT_C4='d9669cdcdbd300529ff63a07fc088be6a9e60fdc65315015b1904f83d42e10f2'
          EXPECT_C5='d8a02ccecffddffc6db8d8810e84875184861d5446eea8304d23cc8adc483999'
          PRE_ORCH='0582f5c443d67015ab88286591cbca71650a574ef38859b1563223a93c53285d'
          PRE_DASH='1f571adba61d948d0e5189843e0565ebb225f20bbeed9d9159f1f719e804efe9'
          POST_ORCH='ad079319b4dfc3c6d0f3994d2638a81ae686015bae9b7aa3a9b5052df69afa74'
          POST_DASH='5af116fe28120ee9c463a4a980751101294fc51e086c54594482b46f37dc7296'
          POST_C6='e8aa78c5834bf21a97eb11e7ce0b80a65b405a82282837485f4f23fffb2b0d84'

          test -f "$ENGINE" -a -f "$ORCH" -a -f "$DASH" -a -f "$SLEEP" -a -f "$C3MOD" -a -f "$C4MOD" -a -f "$C5MOD"
          systemctl --user is-active --quiet brotoculateur.service
          curl -fsS --max-time 5 "$STATUS_URL" >/tmp/c6-before.json

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/c6-before.json',encoding='utf-8'))
          c2=d.get('c2_fingerprint') or {}; c3=d.get('c3_library') or {}; c4=d.get('c4_novelty') or {}; c5=d.get('c5_rarity') or {}; c6=d.get('c6_provenance') or {}
          print('STATE='+str(d.get('state')))
          print('RUN_ID='+str(d.get('run_id')))
          print('PROCESSED='+str(d.get('processed_packets')))
          print('CRYSTALS='+str((d.get('brutomagique') or {}).get('total_crystals')))
          print('C2_TOTAL='+str(c2.get('total_fingerprints')))
          print('C3_OBSERVATIONS='+str(c3.get('observations')))
          print('C4_OBSERVATIONS='+str(c4.get('observations')))
          print('C5_OBSERVATIONS='+str(c5.get('observations')))
          print('C6_MODE='+str(c6.get('mode')))
          print('C6_ENABLED='+str(c6.get('enabled')))
          print('C6_OBSERVATIONS='+str(c6.get('observations')))
          print('C6_TARGETS='+str(c6.get('tracked_targets')))
          print('C6_INDEPENDENCE_CANDIDATES='+str(c6.get('operational_independence_candidate_targets')))
          PY

          engine_hash=$(sha256sum "$ENGINE"|awk '{print $1}')
          orch_hash=$(sha256sum "$ORCH"|awk '{print $1}')
          dash_hash=$(sha256sum "$DASH"|awk '{print $1}')
          sleep_hash=$(sha256sum "$SLEEP"|awk '{print $1}')
          c3_hash=$(sha256sum "$C3MOD"|awk '{print $1}')
          c4_hash=$(sha256sum "$C4MOD"|awk '{print $1}')
          c5_hash=$(sha256sum "$C5MOD"|awk '{print $1}')
          if [ -f "$C6MOD" ]; then c6_hash=$(sha256sum "$C6MOD"|awk '{print $1}'); else c6_hash='ABSENT'; fi
          test "$engine_hash" = "$EXPECT_ENGINE"
          test "$sleep_hash" = "$EXPECT_SLEEP"
          test "$c3_hash" = "$EXPECT_C3"
          test "$c4_hash" = "$EXPECT_C4"
          test "$c5_hash" = "$EXPECT_C5"
          source_state='UNKNOWN'
          if [ "$orch_hash" = "$PRE_ORCH" ] && [ "$dash_hash" = "$PRE_DASH" ] && [ "$c6_hash" = 'ABSENT' ]; then source_state='PRE_C6'; fi
          if [ "$orch_hash" = "$POST_ORCH" ] && [ "$dash_hash" = "$POST_DASH" ] && [ "$c6_hash" = "$POST_C6" ]; then source_state='POST_C6'; fi
          test "$source_state" != 'UNKNOWN'
          echo "C6_SOURCE_STATE=$source_state"
          df -P / | awk 'NR==2 {print "ROOT_DISK_USED=" $5 " ROOT_DISK_FREE_KB=" $4}'

          if [ "$MODE" = audit ]; then
            SOURCE_STATE="$source_state" python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/c6-before.json',encoding='utf-8'))
          c3=d.get('c3_library') or {}; c4=d.get('c4_novelty') or {}; c5=d.get('c5_rarity') or {}; c6=d.get('c6_provenance') or {}
          assert not d.get('worker_error'), d.get('worker_error')
          if os.environ['SOURCE_STATE']=='POST_C6' and c6.get('enabled') is True:
              n=int(c6.get('observations') or 0)
              assert n==int(c5.get('observations') or 0)==int(c4.get('observations') or 0)==int(c3.get('observations') or 0)
              assert c6.get('authority')=='SHADOW_ONLY'
              assert c6.get('scientific_independence_claim') is False
              assert int(c6.get('compute_skips',-1))==0
              assert c6.get('controls_scheduling') is False
              assert c6.get('proof_promotion') is False
          print('C6_AUDIT_ONLY=PASS')
          PY
            exit 0
          fi

          if [ "$MODE" = canary_start ]; then
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/c6-before.json',encoding='utf-8'))
          z=d.get('brutus_cortex') or {}; c2=d.get('c2_fingerprint') or {}; c3=d.get('c3_library') or {}; c4=d.get('c4_novelty') or {}; c5=d.get('c5_rarity') or {}
          assert d.get('state') in {'RUNNING','PAUSED'} and not d.get('worker_error')
          assert z.get('enabled') is True and int(z.get('rollout_percent') or 0)==10
          assert c2.get('enabled') is True and c3.get('enabled') is True and c4.get('enabled') is True and c5.get('enabled') is True
          n=int(c2.get('total_fingerprints') or 0)
          assert n==int(c3.get('observations') or 0)==int(c4.get('observations') or 0)==int(c5.get('observations') or 0)
          print('C6_REQUIRES_C5_C4_C3_C2_Z10=PASS')
          PY
            STAGE="/tmp/brotoculateur-c6-stage-$$"
            rm -rf "$STAGE"
            mkdir -p "$STAGE/src"
            cp -a "$PKG" "$STAGE/src/brotoculateur"
            python3 /tmp/patch_brotoculateur_c6_provenance.py "$STAGE"
            test "$(sha256sum "$STAGE/src/brotoculateur/orchestrator.py"|awk '{print $1}')" = "$POST_ORCH"
            test "$(sha256sum "$STAGE/src/brotoculateur/dashboard.py"|awk '{print $1}')" = "$POST_DASH"
            test "$(sha256sum "$STAGE/src/brotoculateur/c6_provenance.py"|awk '{print $1}')" = "$POST_C6"
            PYTHONPATH="$STAGE/src" python3 /tmp/test_c6_provenance.py
            echo 'C6_EXACT_LIVE_STAGE=PASS'
          else
            test "$source_state" = 'POST_C6'
          fi

          WAS_RUNNING=$(python3 - <<'PY'
          import json
          print('1' if json.load(open('/tmp/c6-before.json',encoding='utf-8')).get('state')=='RUNNING' else '0')
          PY
          )
          if [ "$WAS_RUNNING" = 1 ]; then
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/save >/tmp/c6-save.json
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/pause >/tmp/c6-pause.json
          fi
          curl -fsS --max-time 5 "$STATUS_URL" >/tmp/c6-paused.json
          python3 - <<'PY'
          import json
          assert json.load(open('/tmp/c6-paused.json',encoding='utf-8')).get('state')=='PAUSED'
          print('C6_PAUSE_VERIFY=PASS')
          PY

          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP="$BROTO_ROOT/backups/c6-$STAMP"
          mkdir -p "$BACKUP"
          cp -a "$ORCH" "$DASH" "$C3MOD" "$C4MOD" "$C5MOD" "$BACKUP/"
          if [ -f "$C6MOD" ]; then cp -a "$C6MOD" "$BACKUP/"; fi
          cp -a /tmp/c6-before.json "$BACKUP/status-before.json"
          DROPIN_DIR="$HOME/.config/systemd/user/brotoculateur.service.d"
          DROPIN="$DROPIN_DIR/90-brutus-c6.conf"
          mkdir -p "$DROPIN_DIR"
          HAD_DROPIN=0
          if [ -f "$DROPIN" ]; then HAD_DROPIN=1; cp -a "$DROPIN" "$BACKUP/90-brutus-c6.conf"; fi
          HAD_C6MOD=0
          if [ -f "$C6MOD" ]; then HAD_C6MOD=1; fi
          echo "C6_BACKUP=$BACKUP"

          rollback() {
            rc=$?
            set +e
            echo "C6_ROLLBACK_BEGIN rc=$rc"
            cp -a "$BACKUP/orchestrator.py" "$ORCH"
            cp -a "$BACKUP/dashboard.py" "$DASH"
            if [ "$HAD_C6MOD" = 1 ]; then cp -a "$BACKUP/c6_provenance.py" "$C6MOD"; else rm -f "$C6MOD"; fi
            if [ "$HAD_DROPIN" = 1 ]; then cp -a "$BACKUP/90-brutus-c6.conf" "$DROPIN"; else rm -f "$DROPIN"; fi
            systemctl --user daemon-reload
            systemctl --user restart brotoculateur.service
            sleep 2
            if [ "$WAS_RUNNING" = 1 ]; then curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/start >/dev/null || true; fi
            echo 'C6_ROLLBACK_DONE'
            exit "$rc"
          }
          trap rollback ERR

          if [ "$MODE" = canary_start ]; then
            cp -a "$STAGE/src/brotoculateur/orchestrator.py" "$ORCH"
            cp -a "$STAGE/src/brotoculateur/dashboard.py" "$DASH"
            cp -a "$STAGE/src/brotoculateur/c6_provenance.py" "$C6MOD"
            cat > "$DROPIN" <<'EOF'
          [Service]
          Environment="BROTO_C6_ENABLED=1"
          Environment="BROTO_C6_MAX_TARGETS=16384"
          Environment="BROTO_C6_SIGNATURE_CAP=16"
          EOF
          else
            cat > "$DROPIN" <<'EOF'
          [Service]
          Environment="BROTO_C6_ENABLED=0"
          EOF
          fi

          systemctl --user daemon-reload
          systemctl --user restart brotoculateur.service
          ok=0
          for _ in $(seq 1 20); do
            if systemctl --user is-active --quiet brotoculateur.service && curl -fsS --max-time 2 "$STATUS_URL" >/tmp/c6-after.json; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1

          MODE="$MODE" python3 - <<'PY'
          import json,os
          d=json.load(open('/tmp/c6-after.json',encoding='utf-8'))
          c5=d.get('c5_rarity') or {}; c6=d.get('c6_provenance') or {}
          assert not d.get('worker_error')
          assert c5.get('enabled') is True
          if os.environ['MODE']=='canary_start':
              assert c6.get('mode')=='BRUTUS_C6_PROVENANCE_V1'
              assert c6.get('enabled') is True
              assert c6.get('authority')=='SHADOW_ONLY'
              assert c6.get('scientific_independence_claim') is False
              assert c6.get('controls_scheduling') is False
              assert int(c6.get('compute_skips',-1))==0
          else:
              assert c6.get('enabled') is False
          print('C6_DEPLOY_VERIFY=PASS')
          PY

          if [ "$MODE" = canary_start ] || [ "$WAS_RUNNING" = 1 ]; then
            curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8781/api/start >/dev/null
            live=0
            for _ in $(seq 1 30); do
              curl -fsS --max-time 2 "$STATUS_URL" >/tmp/c6-live.json || true
              if MODE="$MODE" python3 - <<'PY'
          import json,os,sys
          try: d=json.load(open('/tmp/c6-live.json',encoding='utf-8'))
          except Exception: sys.exit(1)
          c5=d.get('c5_rarity') or {}; c6=d.get('c6_provenance') or {}
          good=d.get('state')=='RUNNING' and not d.get('worker_error')
          if os.environ.get('MODE')=='canary_start':
              good=good and int(c6.get('observations') or 0)>0 and int(c6.get('observations') or 0)==int(c5.get('observations') or 0) and int(c6.get('compute_skips',-1))==0
          sys.exit(0 if good else 1)
          PY
              then live=1; break; fi
              sleep 1
            done
            test "$live" = 1
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/c6-live.json',encoding='utf-8'))
          c2=d.get('c2_fingerprint') or {}; c3=d.get('c3_library') or {}; c4=d.get('c4_novelty') or {}; c5=d.get('c5_rarity') or {}; c6=d.get('c6_provenance') or {}
          print('C6_LIVE_STATE='+str(d.get('state')))
          print('C6_LIVE_PROCESSED='+str(d.get('processed_packets')))
          print('C6_LIVE_CRYSTALS='+str((d.get('brutomagique') or {}).get('total_crystals')))
          print('C6_LIVE_C2='+str(c2.get('total_fingerprints')))
          print('C6_LIVE_C3='+str(c3.get('observations')))
          print('C6_LIVE_C4='+str(c4.get('observations')))
          print('C6_LIVE_C5='+str(c5.get('observations')))
          print('C6_LIVE_OBSERVATIONS='+str(c6.get('observations')))
          print('C6_LIVE_TARGETS='+str(c6.get('tracked_targets')))
          print('C6_LIVE_MULTI_PATH='+str(c6.get('multi_path_targets')))
          print('C6_LIVE_MULTI_FORMULA='+str(c6.get('multi_formula_targets')))
          print('C6_LIVE_MULTI_PARENT='+str(c6.get('multi_parent_targets')))
          print('C6_LIVE_MULTI_ORIGIN='+str(c6.get('multi_origin_targets')))
          print('C6_LIVE_INDEPENDENCE_CANDIDATES='+str(c6.get('operational_independence_candidate_targets')))
          print('C6_LIVE_VERIFY=PASS')
          PY
          fi

          test "$(sha256sum "$ENGINE"|awk '{print $1}')" = "$EXPECT_ENGINE"
          test "$(sha256sum "$SLEEP"|awk '{print $1}')" = "$EXPECT_SLEEP"
          test "$(sha256sum "$C3MOD"|awk '{print $1}')" = "$EXPECT_C3"
          test "$(sha256sum "$C4MOD"|awk '{print $1}')" = "$EXPECT_C4"
          test "$(sha256sum "$C5MOD"|awk '{print $1}')" = "$EXPECT_C5"
          if [ "$MODE" = canary_start ]; then
            test "$(sha256sum "$ORCH"|awk '{print $1}')" = "$POST_ORCH"
            test "$(sha256sum "$DASH"|awk '{print $1}')" = "$POST_DASH"
            test "$(sha256sum "$C6MOD"|awk '{print $1}')" = "$POST_C6"
          fi
          df -P / | awk 'NR==2 {print "C6_ROOT_DISK_USED=" $5 " C6_ROOT_DISK_FREE_KB=" $4}'
          trap - ERR
          rm -rf "${STAGE:-}"
          echo 'C6_WORKFLOW=PASS'
          REMOTE
